<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizFlowAI - Nền tảng Tài chính AI cho Doanh nghiệp nhỏ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== CẤU HÌNH SUPABASE =====
    const SUPABASE_URL = "https://xofriivockwiycdnnfvx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6ogosVTXKRpzbZwJcyZmw_yKzEwKYO";
    window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== CẤU HÌNH TÀI KHOẢN NHẬN THANH TOÁN VIETQR THẬT =====
    // Tra mã ngân hàng tại https://api.vietqr.io/v2/banks (VD: MB, VCB, TCB, ACB, BIDV...)
    window.VIETQR_CONFIG = {
      BANK_ID: "MB",
      BANK_NAME: "MB Bank (Ngân hàng Quân Đội)",
      ACCOUNT_NO: "0123456789",          // <-- Điền số tài khoản thật của bạn
      ACCOUNT_NAME: "CONG TY BIZFLOWAI"  // <-- Điền tên chủ tài khoản viết hoa không dấu
    };
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // TIỆN ÍCH & CẤU HÌNH GÓI DỊCH VỤ
    // ==========================================
    const PLAN_INFO = {
      name: 'BizFlowAI SME Pro',
      monthlyPrice: 199000,
      trialDays: 7,
      features: [
        'Quản lý không giới hạn Đơn hàng, Sản phẩm & Tồn kho',
        'Tự động lưu giá vốn lịch sử tại thời điểm bán',
        'Phân biệt chính xác Doanh thu, Lợi nhuận & Dòng tiền',
        'AI Financial Intelligence phân tích & cảnh báo 24/7',
        'Trợ lý kinh doanh hỏi đáp theo số liệu thực tế'
      ]
    };

    const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Math.round(num || 0));
    const todayStr = () => new Date().toISOString().split('T')[0];
    const getMonthKey = (dateStr) => (dateStr || '').slice(0, 7);

    const currentDate = new Date();
    const THIS_MONTH = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const prevDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    const LAST_MONTH = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

    // ==========================================
    // COMPONENT CHÍNH: AUTH + BILLING + WORKSPACE
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [seeding, setSeeding] = useState(false);
      const [showCheckoutModal, setShowCheckoutModal] = useState(false);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [expenses, setExpenses] = useState([]);

      // Đọc hồ sơ từ profiles; tự động gọi ensure_profile nếu thiếu
      const loadProfile = async (authUser) => {
        let { data: prof, error } = await sb
          .from('profiles')
          .select('*')
          .eq('id', authUser.id)
          .maybeSingle();

        if (!prof || error) {
          const fallbackName = authUser.user_metadata?.shop_name || 'Cửa hàng BizFlowAI';
          const isDemo = Boolean(authUser.user_metadata?.is_demo || authUser.is_anonymous);
          const { data: ensured, error: ensureErr } = await sb.rpc('ensure_profile', {
            p_shop_name: fallbackName,
            p_is_demo: isDemo
          });
          if (ensureErr || !ensured) {
            console.error('Không thể tải hoặc khởi tạo profile:', ensureErr);
            return null;
          }
          prof = ensured;
        }

        const endsAt = new Date(
          prof.subscription_status === 'active' && prof.subscription_ends_at
            ? prof.subscription_ends_at
            : prof.trial_ends_at
        );
        const daysLeft = Math.max(0, Math.ceil((endsAt - new Date()) / 86400000));
        let status = prof.subscription_status;
        if ((status === 'trial' || status === 'active') && daysLeft === 0) status = 'expired';

        return {
          id: authUser.id,
          email: authUser.email || 'Phiên Demo Ẩn Danh',
          shop_name: prof.shop_name,
          is_demo: prof.is_demo || authUser.is_anonymous,
          subscription_status: status,
          days_left: daysLeft
        };
      };

      const loadData = async () => {
        const [p, o, t] = await Promise.all([
          sb.from('products').select('*').order('name'),
          sb.from('orders').select('*, order_items(*)').order('order_date', { ascending: false }).order('created_at', { ascending: false }),
          sb.from('transactions').select('*').order('transaction_date', { ascending: false }),
        ]);
        setProducts((p.data || []).map(x => ({ ...x, selling_price: Number(x.selling_price), cost_price: Number(x.cost_price) })));
        setOrders((o.data || []).map(x => ({
          ...x,
          items: (x.order_items || []).map(i => ({ ...i, quantity: Number(i.quantity), unit_price: Number(i.unit_price), unit_cost: Number(i.unit_cost) }))
        })));
        setExpenses((t.data || []).map(x => ({ ...x, amount: Number(x.amount), expense_date: x.transaction_date })));
      };

      const finishLogin = async (authUser) => {
        const u = await loadProfile(authUser);
        setCurrentUser(u);
        if (u) await loadData();
        return u;
      };

      useEffect(() => {
        sb.auth.getSession().then(async ({ data }) => {
          if (data.session) await finishLogin(data.session.user);
          setLoading(false);
        });
        const { data: sub } = sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') {
            setCurrentUser(null);
            setProducts([]);
            setOrders([]);
            setExpenses([]);
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      const handleRegister = async ({ email, password, shop_name, buyNow }) => {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { shop_name, is_demo: false } }
        });
        if (error) return { error: error.message };
        if (!data.session) return { error: 'Đã tạo tài khoản. Vui lòng xác nhận email rồi đăng nhập.' };
        await finishLogin(data.session.user);
        if (buyNow) setShowCheckoutModal(true);
        return { ok: true };
      };

      const handleLogin = async ({ email, password }) => {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return { error: 'Sai email hoặc mật khẩu!' };
        await finishLogin(data.user);
        return { ok: true };
      };

      const handleLogout = async () => {
        await sb.auth.signOut();
      };

      // Nạp dữ liệu mẫu idempotent qua RPC (hoặc reset nếu p_reset = true)
      const handleLoadSampleData = async () => {
  const { error } = await sb.rpc('seed_sample_data', { p_reset: false });
  if (error) return alert('Lỗi: ' + error.message);
  await loadData();
};

      // Phiên Demo cô lập riêng cho từng giám khảo (không dùng chung 1 tài khoản)
      const handleQuickDemo = async () => {
        if (seeding) return;
        setSeeding(true);
        try {
          let authData = null;

          // Ưu tiên Anonymous Sign-In (cô lập hoàn toàn từng trình duyệt)
          const anonRes = await sb.auth.signInAnonymously({
            options: { data: { shop_name: 'Tiệm Trà & Cà Phê Demo (Riêng tư)', is_demo: true } }
          });

          if (!anonRes.error && anonRes.data?.session) {
            authData = anonRes.data;
          } else {
            // Dự phòng nếu chưa bật Anonymous Sign-Ins: tạo tài khoản demo ngẫu nhiên riêng
            const randId = Math.random().toString(36).slice(2, 10);
            const demoEmail = `demo.${randId}@demo.bizflowai.vn`;
            const demoPass = `Demo#${randId}99`;
            const signUpRes = await sb.auth.signUp({
              email: demoEmail,
              password: demoPass,
              options: { data: { shop_name: `Tiệm Demo #${randId.toUpperCase()}`, is_demo: true } }
            });
            if (signUpRes.error || !signUpRes.data?.session) {
              alert('Hãy bật "Anonymous Sign-Ins" hoặc tắt "Confirm email" trong Supabase Authentication để dùng Demo nhanh.');
              return;
            }
            authData = signUpRes.data;
          }

          await finishLogin(authData.session.user);
          await sb.rpc('seed_sample_data', { p_reset: false });
          await loadData();
        } finally {
          setSeeding(false);
        }
      };

      // Làm mới profile sau khi thanh toán thành công từ backend webhook
      const handlePaymentVerified = async () => {
        const { data: { user } } = await sb.auth.getUser();
        if (user) await finishLogin(user);
        setShowCheckoutModal(false);
      };

      if (loading) {
        return <div className="min-h-screen flex items-center justify-center text-slate-500 text-sm">Đang tải BizFlowAI...</div>;
      }

      if (!currentUser) {
        return (
          <AuthAndPricingPage
            onRegister={handleRegister}
            onLogin={handleLogin}
            onQuickDemo={handleQuickDemo}
            demoLoading={seeding}
          />
        );
      }

      if (currentUser.subscription_status === 'pending_payment' || currentUser.subscription_status === 'expired') {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <CheckoutModal
              user={currentUser}
              onPaymentVerified={handlePaymentVerified}
              onLogout={handleLogout}
            />
          </div>
        );
      }

      return (
        <>
          <WorkspaceApp
            user={currentUser}
            onLogout={handleLogout}
            onOpenUpgrade={() => setShowCheckoutModal(true)}
            products={products}
            orders={orders}
            expenses={expenses}
            seeding={seeding}
            onLoadSampleData={() => handleLoadSampleData(false)}
            onResetSampleData={() => handleLoadSampleData(true)}
            onReload={loadData}
          />
          {showCheckoutModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <CheckoutModal
                user={currentUser}
                onPaymentVerified={handlePaymentVerified}
                onClose={() => setShowCheckoutModal(false)}
              />
            </div>
          )}
        </>
      );
    }

    // ==========================================
    // MÀN HÌNH 1: LANDING + BẢNG GIÁ + AUTH
    // ==========================================
    function AuthAndPricingPage({ onRegister, onLogin, onQuickDemo, demoLoading }) {
      const [mode, setMode] = useState('register');
      const [shopName, setShopName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [buyOption, setBuyOption] = useState('trial');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const submitForm = async (e) => {
        e.preventDefault();
        setError('');
        setSubmitting(true);
        try {
          if (mode === 'register') {
            if (!shopName.trim()) return setError('Vui lòng nhập tên cửa hàng của bạn.');
            const res = await onRegister({ email, password, shop_name: shopName, buyNow: buyOption === 'buy_now' });
            if (res.error) setError(res.error);
          } else {
            const res = await onLogin({ email, password });
            if (res.error) setError(res.error);
          }
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white flex flex-col">
          <header className="max-w-6xl w-full mx-auto px-6 py-5 flex items-center justify-between border-b border-slate-800">
            <div className="flex items-center gap-2">
              <span className="text-2xl">⚡</span>
              <span className="font-bold text-xl bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">
                BizFlowAI
              </span>
            </div>
            <button
              onClick={onQuickDemo}
              disabled={demoLoading}
              className="px-4 py-2 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 text-xs font-semibold hover:bg-emerald-500/25 transition disabled:opacity-50"
            >
              {demoLoading ? '⏳ Đang tạo phiên Demo riêng...' : '🎯 Vào nhanh Demo Riêng Biệt (Ban Giám Khảo)'}
            </button>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div className="lg:col-span-7 space-y-6">
              <div className="inline-block px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-semibold">
                Dành riêng cho Doanh nghiệp nhỏ & Chủ Shop
              </div>
              <h1 className="text-3xl sm:text-4xl font-extrabold leading-tight">
                Biết chính xác <span className="text-emerald-400">Lợi nhuận thật</span>, không nhầm lẫn với Doanh thu.
              </h1>
              <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                BizFlowAI giúp bạn quản lý đơn hàng, tồn kho, sổ thu chi và tích hợp trợ lý AI phân tích nguyên nhân biến động lợi nhuận theo thời gian thực.
              </p>

              <div className="bg-gradient-to-br from-slate-900 to-slate-800 border-2 border-indigo-500 rounded-2xl p-6 shadow-2xl shadow-indigo-950/50">
                <div className="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-700">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">Gói duy nhất - Đầy đủ tính năng</span>
                    <h2 className="text-xl font-bold text-white mt-0.5">{PLAN_INFO.name}</h2>
                  </div>
                  <div className="text-right">
                    <span className="text-3xl font-extrabold text-emerald-400">{formatVND(PLAN_INFO.monthlyPrice)}</span>
                    <span className="text-xs text-slate-400"> / tháng</span>
                  </div>
                </div>
                <ul className="mt-4 space-y-2.5 text-sm text-slate-300">
                  {PLAN_INFO.features.map((f, idx) => (
                    <li key={idx} className="flex items-start gap-2.5">
                      <span className="text-emerald-400 font-bold">✓</span>
                      <span>{f}</span>
                    </li>
                  ))}
                </ul>
                <div className="mt-5 pt-4 border-t border-slate-700/80 flex items-center justify-between text-xs text-slate-400">
                  <span>🎁 Tặng <strong>7 ngày dùng thử miễn phí</strong></span>
                  <span>💳 Thanh toán qua VietQR tự động xác nhận</span>
                </div>
              </div>
            </div>

            <div className="lg:col-span-5 bg-white text-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
              <div className="flex border-b border-slate-200 mb-6">
                <button
                  onClick={() => { setMode('register'); setError(''); }}
                  className={`flex-1 pb-3 text-sm font-bold border-b-2 transition ${mode === 'register' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400'}`}
                >
                  Tạo tài khoản mới
                </button>
                <button
                  onClick={() => { setMode('login'); setError(''); }}
                  className={`flex-1 pb-3 text-sm font-bold border-b-2 transition ${mode === 'login' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400'}`}
                >
                  Đăng nhập
                </button>
              </div>

              {error && (
                <div className="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                  {error}
                </div>
              )}

              <form onSubmit={submitForm} className="space-y-4 text-sm">
                {mode === 'register' && (
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Tên Cửa hàng / Doanh nghiệp</label>
                    <input
                      required
                      value={shopName}
                      onChange={e => setShopName(e.target.value)}
                      placeholder="VD: Tiệm Bánh Mì An Nhiên"
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                  <input
                    required
                    type="email"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    placeholder="chushop@gmail.com"
                    className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu</label>
                  <input
                    required
                    minLength={6}
                    type="password"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="Tối thiểu 6 ký tự"
                    className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500"
                  />
                </div>

                {mode === 'register' && (
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                    <div className="text-xs font-bold text-slate-700">Chọn hình thức bắt đầu:</div>
                    <label className="flex items-center gap-2 text-xs cursor-pointer">
                      <input type="radio" name="buyOpt" checked={buyOption === 'trial'} onChange={() => setBuyOption('trial')} className="accent-indigo-600" />
                      <span>Dùng thử miễn phí <strong>7 ngày</strong></span>
                    </label>
                    <label className="flex items-center gap-2 text-xs cursor-pointer">
                      <input type="radio" name="buyOpt" checked={buyOption === 'buy_now'} onChange={() => setBuyOption('buy_now')} className="accent-indigo-600" />
                      <span>Mua gói <strong>SME Pro (199.000đ/tháng)</strong> ngay qua VietQR</span>
                    </label>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={submitting}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition disabled:opacity-50"
                >
                  {submitting ? 'Đang xử lý...' : mode === 'register'
                    ? (buyOption === 'buy_now' ? 'Đăng ký & Mở mã VietQR →' : 'Tạo tài khoản & Dùng thử ngay →')
                    : 'Đăng nhập vào BizFlowAI'}
                </button>
              </form>
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // MÀN HÌNH 2: MODAL THANH TOÁN VIETQR THẬT + XÁC MINH BACKEND
    // ==========================================
    function CheckoutModal({ user, onPaymentVerified, onClose, onLogout }) {
      const [paymentOrder, setPaymentOrder] = useState(null);
      const [statusMsg, setStatusMsg] = useState('Đang tạo mã thanh toán VietQR...');
      const [checking, setChecking] = useState(false);

      useEffect(() => {
        let channel = null;

        const initPayment = async () => {
          const { data, error } = await sb.rpc('create_payment_order');
          if (error || !data) {
            setStatusMsg('❌ Lỗi tạo đơn thanh toán: ' + (error?.message || 'Không xác định'));
            return;
          }
          setPaymentOrder(data);
          setStatusMsg('⏳ Đang chờ xác nhận chuyển khoản tự động từ ngân hàng...');

          // Lắng nghe Realtime khi Edge Function vietqr-webhook cập nhật paid
          channel = sb
            .channel(`payment-${data.order_code}`)
            .on(
              'postgres_changes',
              {
                event: 'UPDATE',
                schema: 'public',
                table: 'payment_orders',
                filter: `order_code=eq.${data.order_code}`
              },
              (payload) => {
                if (payload.new?.status === 'paid') {
                  setStatusMsg('✅ Đã nhận thanh toán! Đang kích hoạt gói...');
                  onPaymentVerified();
                }
              }
            )
            .subscribe();
        };

        initPayment();
        return () => {
          if (channel) sb.removeChannel(channel);
        };
      }, []);

      const checkPaymentStatus = async () => {
        if (!paymentOrder) return;
        setChecking(true);
        try {
          const { data } = await sb
            .from('payment_orders')
            .select('status')
            .eq('id', paymentOrder.id)
            .single();

          if (data?.status === 'paid') {
            setStatusMsg('✅ Đã nhận thanh toán! Đang kích hoạt gói...');
            await onPaymentVerified();
          } else {
            setStatusMsg('⏳ Giao dịch chưa ghi nhận trên hệ thống. Vui lòng đợi vài giây sau khi chuyển khoản.');
          }
        } finally {
          setChecking(false);
        }
      };

      const qrUrl = paymentOrder
        ? `https://img.vietqr.io/image/${VIETQR_CONFIG.BANK_ID}-${VIETQR_CONFIG.ACCOUNT_NO}-compact2.png?amount=${paymentOrder.amount}&addInfo=${encodeURIComponent(paymentOrder.order_code)}&accountName=${encodeURIComponent(VIETQR_CONFIG.ACCOUNT_NAME)}`
        : null;

      return (
        <div className="bg-white text-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 relative">
          {onClose && (
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-lg">✕</button>
          )}

          <div className="text-center">
            <span className="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold">
              Thanh toán {PLAN_INFO.name}
            </span>
            <h2 className="text-xl font-bold mt-2">Quét mã VietQR để kích hoạt</h2>
            <p className="text-xs text-slate-500 mt-1">Cửa hàng: <strong>{user.shop_name}</strong></p>
          </div>

          <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col items-center space-y-3">
            {qrUrl ? (
              <img
                src={qrUrl}
                alt="Mã VietQR thanh toán"
                className="w-52 h-52 object-contain rounded-xl border border-slate-200 bg-white p-2 shadow-sm"
              />
            ) : (
              <div className="w-52 h-52 flex items-center justify-center text-xs text-slate-400 bg-white rounded-xl border">
                Đang tải mã QR...
              </div>
            )}

            <div className="w-full text-xs space-y-1.5 bg-white p-3 rounded-lg border border-slate-200">
              <div className="flex justify-between"><span className="text-slate-500">Ngân hàng:</span><span className="font-bold">{VIETQR_CONFIG.BANK_NAME}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">Số tài khoản:</span><span className="font-bold">{VIETQR_CONFIG.ACCOUNT_NO}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">Chủ tài khoản:</span><span className="font-bold">{VIETQR_CONFIG.ACCOUNT_NAME}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">Số tiền:</span><span className="font-bold text-emerald-600">{formatVND(paymentOrder?.amount || PLAN_INFO.monthlyPrice)}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">Nội dung CK (bắt buộc):</span><span className="font-bold text-indigo-600">{paymentOrder?.order_code || '...'}</span></div>
            </div>

            <div className="text-[11px] text-center text-slate-600 font-medium bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-2 w-full">
              {statusMsg}
            </div>
          </div>

          <div className="space-y-2">
            <button
              onClick={checkPaymentStatus}
              disabled={checking || !paymentOrder}
              className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-200 transition disabled:opacity-50"
            >
              {checking ? 'Đang kiểm tra với máy chủ...' : '🔄 Kiểm tra trạng thái thanh toán'}
            </button>

            {onLogout && (
              <button onClick={onLogout} className="w-full py-1 text-xs text-slate-400 hover:text-slate-600">
                ← Quay lại trang đăng nhập
              </button>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // MÀN HÌNH 3: WORKSPACE CHÍNH
    // ==========================================
    function WorkspaceApp({
      user, onLogout, onOpenUpgrade,
      products, orders, expenses, seeding,
      onLoadSampleData, onResetSampleData, onReload
    }) {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [showPipeline, setShowPipeline] = useState(true);

      const analytics = useMemo(() => {
        const calcPeriod = (monthKey) => {
          const completedOrders = orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === monthKey);
          const pendingOrders = orders.filter(o => o.status === 'pending' && getMonthKey(o.order_date) === monthKey);

          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });

          const pendingValue = pendingOrders.reduce((sum, o) => sum + o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0), 0);
          const monthExp = expenses.filter(e => getMonthKey(e.expense_date) === monthKey);
          const opex = monthExp.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const materialCost = monthExp.filter(e => e.type === 'expense' && e.category === 'Nguyên liệu').reduce((s, e) => s + e.amount, 0);
          const shippingCost = monthExp.filter(e => e.type === 'expense' && e.category === 'Vận chuyển').reduce((s, e) => s + e.amount, 0);
          const otherIncome = monthExp.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
          const inventoryCashOut = monthExp.filter(e => e.type === 'inventory_purchase').reduce((s, e) => s + e.amount, 0);

          const grossProfit = revenue - cogs;
          const netProfit = grossProfit - opex + otherIncome;
          const netMargin = revenue > 0 ? (netProfit / revenue) * 100 : 0;
          const cashFlow = revenue + otherIncome - opex - inventoryCashOut;

          return {
            monthKey, revenue, cogs, grossProfit, opex, materialCost, shippingCost,
            otherIncome, inventoryCashOut, netProfit, netMargin, cashFlow,
            completedCount: completedOrders.length, pendingCount: pendingOrders.length, pendingValue
          };
        };

        const thisM = calcPeriod(THIS_MONTH);
        const lastM = calcPeriod(LAST_MONTH);

        const productInsights = products.map(p => {
          const margin = p.selling_price > 0 ? ((p.selling_price - p.cost_price) / p.selling_price) * 100 : 0;
          let soldQtyThisMonth = 0;
          orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === THIS_MONTH).forEach(o => {
            o.items.forEach(i => { if (i.product_id === p.id) soldQtyThisMonth += i.quantity; });
          });
          return { ...p, margin, soldQtyThisMonth, isLowStock: p.stock <= p.low_stock_threshold, isLowMargin: margin < 20 };
        });

        return {
          thisM, lastM,
          revChangePct: lastM.revenue > 0 ? ((thisM.revenue - lastM.revenue) / lastM.revenue) * 100 : 0,
          profitChangePct: lastM.netProfit !== 0 ? ((thisM.netProfit - lastM.netProfit) / Math.abs(lastM.netProfit)) * 100 : 0,
          materialDiff: thisM.materialCost - lastM.materialCost,
          shippingDiff: thisM.shippingCost - lastM.shippingCost,
          productInsights,
          lowStockProducts: productInsights.filter(p => p.isLowStock),
          lowMarginProducts: productInsights.filter(p => p.isLowMargin)
        };
      }, [products, orders, expenses]);

      const run = async (fn) => {
        const { error } = await fn();
        if (error) alert('Lỗi: ' + error.message);
        await onReload();
      };
      const handleAddProduct = (p) => run(() => sb.from('products').insert(p));
      const handleUpdateProduct = ({ id, ...rest }) => run(() => sb.from('products').update(rest).eq('id', id));
      const handleCreateOrder = ({ customer_name, order_date, status, selectedItems }) => run(() => sb.rpc('create_order', {
        p_customer: customer_name, p_date: order_date, p_status: status,
        p_items: selectedItems.map(i => ({ product_id: i.product_id, quantity: Number(i.quantity) }))
      }));
      const handleChangeOrderStatus = (orderId, newStatus) => run(() => sb.rpc('set_order_status', { p_order_id: orderId, p_status: newStatus }));
      const handleAddExpense = (e) => run(() => sb.from('transactions').insert({
        type: e.type, category: e.category, amount: e.amount, transaction_date: e.expense_date, note: e.note
      }));

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
        { id: 'orders', label: 'Orders', icon: '🧾', badge: analytics.thisM.pendingCount },
        { id: 'products', label: 'Products', icon: '📦', badge: analytics.lowStockProducts.length, badgeColor: 'bg-rose-500' },
        { id: 'finance', label: 'Finance', icon: '💳' },
        { id: 'ai', label: 'AI Intelligence', icon: '🤖', highlight: true },
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row text-slate-800">
          <aside className="w-full md:w-64 bg-slate-900 text-white flex flex-col shrink-0">
            <div className="p-5 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="text-2xl">⚡</span>
                <span className="font-bold text-xl bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">BizFlowAI</span>
              </div>
              <div className="mt-2 text-xs font-semibold text-slate-200 truncate">🏪 {user.shop_name}</div>
              <div className="text-[11px] text-slate-400 truncate">{user.email}</div>
            </div>

            <nav className="flex-1 p-3 space-y-1">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === item.id ? 'bg-indigo-600 text-white shadow-md' :
                    item.highlight ? 'text-emerald-300 hover:bg-slate-800' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <span className="flex items-center gap-2.5"><span>{item.icon}</span><span>{item.label}</span></span>
                  {item.badge > 0 && <span className={`px-2 py-0.5 text-xs rounded-full text-white ${item.badgeColor || 'bg-amber-500'}`}>{item.badge}</span>}
                </button>
              ))}
            </nav>

            <div className="p-4 m-3 rounded-xl bg-slate-800 border border-slate-700 text-xs space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="font-bold text-slate-200">Gói SME Pro</span>
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                  user.subscription_status === 'active' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'
                }`}>
                  {user.subscription_status === 'active' ? 'ĐANG HOẠT ĐỘNG' : 'DÙNG THỬ'}
                </span>
              </div>
              <div className="text-slate-400">
                Thời hạn còn lại: <strong className="text-white">{user.days_left} ngày</strong>
              </div>
              {user.subscription_status !== 'active' && (
                <button
                  onClick={onOpenUpgrade}
                  className="w-full py-1.5 rounded-lg bg-gradient-to-r from-indigo-500 to-emerald-500 text-white font-bold hover:opacity-90"
                >
                  Mua gói 199.000đ/tháng
                </button>
              )}
              <div className="pt-1 flex gap-1.5 border-t border-slate-700">
                <button
                  onClick={() => { if (confirm('Reset toàn bộ dữ liệu cửa hàng này về dữ liệu mẫu ban đầu?')) onResetSampleData(); }}
                  disabled={seeding}
                  className="flex-1 py-1 rounded border border-slate-600 text-slate-300 hover:bg-slate-700 disabled:opacity-50"
                >
                  🔄 Reset Mẫu
                </button>
                <button onClick={onLogout} className="flex-1 py-1 rounded border border-slate-600 text-rose-300 hover:bg-slate-700">Đăng xuất</button>
              </div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 className="text-lg font-bold text-slate-800">
                  {navItems.find(n => n.id === activeTab)?.icon} {navItems.find(n => n.id === activeTab)?.label}
                </h1>
                <p className="text-xs text-slate-500">Kỳ hiện tại: <strong>{THIS_MONTH}</strong> | Kỳ trước: <strong>{LAST_MONTH}</strong></p>
              </div>

              <div className="flex items-center gap-2">
                {products.length === 0 && (
                  <button
                    onClick={onLoadSampleData}
                    disabled={seeding}
                    className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700 disabled:opacity-50"
                  >
                    {seeding ? '⏳ Đang nạp...' : '⚡ Nạp dữ liệu mẫu'}
                  </button>
                )}
                <label className="flex items-center gap-2 text-xs font-medium bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full cursor-pointer border border-indigo-200">
                  <input type="checkbox" checked={showPipeline} onChange={e => setShowPipeline(e.target.checked)} className="accent-indigo-600" />
                  X-Ray AI Pipeline
                </label>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {activeTab === 'dashboard' && <DashboardView analytics={analytics} setActiveTab={setActiveTab} productsCount={products.length} onLoadSampleData={onLoadSampleData} seeding={seeding} />}
              {activeTab === 'orders' && <OrdersView orders={orders} products={products} onCreateOrder={handleCreateOrder} onChangeStatus={handleChangeOrderStatus} />}
              {activeTab === 'products' && <ProductsView products={analytics.productInsights} onAddProduct={handleAddProduct} onUpdateProduct={handleUpdateProduct} />}
              {activeTab === 'finance' && <FinanceView expenses={expenses} analytics={analytics} onAddExpense={handleAddExpense} />}
              {activeTab === 'ai' && <AIIntelligenceView analytics={analytics} showPipeline={showPipeline} expenses={expenses} />}
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // CÁC TRANG CON
    // ==========================================
    function DashboardView({ analytics, setActiveTab, productsCount, onLoadSampleData, seeding }) {
      const { thisM, lastM, revChangePct, profitChangePct, lowStockProducts, lowMarginProducts } = analytics;
      const maxVal = Math.max(thisM.revenue, lastM.revenue, 1);

      if (productsCount === 0) {
        return (
          <div className="bg-white border border-slate-200 rounded-2xl p-10 text-center space-y-4">
            <div className="text-4xl">🏪</div>
            <h2 className="text-xl font-bold text-slate-800">Chào mừng bạn đến với BizFlowAI!</h2>
            <p className="text-sm text-slate-500 max-w-md mx-auto">
              Cửa hàng mới tạo chưa có dữ liệu. Bạn có thể tự thêm sản phẩm ở mục <strong>Products</strong> hoặc nạp nhanh dữ liệu mẫu.
            </p>
            <div className="flex justify-center gap-3 pt-2">
              <button onClick={onLoadSampleData} disabled={seeding} className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">
                {seeding ? '⏳ Đang nạp...' : '⚡ Nạp dữ liệu mẫu Demo'}
              </button>
              <button onClick={() => setActiveTab('products')} className="px-5 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold hover:bg-slate-50">
                + Tự thêm sản phẩm đầu tiên
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <KpiCard title="Doanh thu tháng này" sub="Chỉ tính đơn completed" value={formatVND(thisM.revenue)} trend={`${revChangePct >= 0 ? '+' : ''}${revChangePct.toFixed(1)}% so với tháng trước`} trendPositive={revChangePct >= 0} color="indigo" />
            <KpiCard title="Giá vốn + Chi phí" sub={`COGS: ${formatVND(thisM.cogs)} | OPEX: ${formatVND(thisM.opex)}`} value={formatVND(thisM.cogs + thisM.opex)} trend={`Ship + NL: ${formatVND(thisM.shippingCost + thisM.materialCost)}`} trendPositive={false} color="amber" />
            <KpiCard title="Lợi nhuận ròng" sub={`Biên LN: ${thisM.netMargin.toFixed(1)}%`} value={formatVND(thisM.netProfit)} trend={`${profitChangePct >= 0 ? '+' : ''}${profitChangePct.toFixed(1)}% so với tháng trước`} trendPositive={profitChangePct >= 0} color={thisM.netProfit >= 0 ? 'emerald' : 'rose'} />
            <KpiCard title="Dòng tiền ròng" sub={`Đã trừ ${formatVND(thisM.inventoryCashOut)} nhập kho`} value={formatVND(thisM.cashFlow)} trend="Khác lợi nhuận kế toán" trendPositive={thisM.cashFlow >= 0} color="sky" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-bold text-slate-800">So sánh Tháng trước vs Tháng này</h2>
                <div className="flex gap-3 text-xs">
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-indigo-500 inline-block"></span> Doanh thu</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-amber-500 inline-block"></span> Chi phí</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Lợi nhuận</span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-8 pt-4 pb-2 px-4 border-b border-slate-100">
                {[{ label: `Tháng trước (${lastM.monthKey})`, data: lastM }, { label: `Tháng này (${thisM.monthKey})`, data: thisM }].map((col, idx) => (
                  <div key={idx} className="flex flex-col items-center">
                    <div className="h-44 w-full flex items-end justify-center gap-4">
                      <BarItem heightPct={(col.data.revenue / maxVal) * 100} color="bg-indigo-500" label={formatVND(col.data.revenue)} />
                      <BarItem heightPct={((col.data.cogs + col.data.opex) / maxVal) * 100} color="bg-amber-500" label={formatVND(col.data.cogs + col.data.opex)} />
                      <BarItem heightPct={(Math.max(0, col.data.netProfit) / maxVal) * 100} color="bg-emerald-500" label={formatVND(col.data.netProfit)} />
                    </div>
                    <span className="mt-3 text-xs font-semibold text-slate-700">{col.label}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-3">
              <div>
                <h2 className="font-bold text-slate-800 mb-3">🚨 Cảnh báo nhanh</h2>
                <div className="space-y-2.5 text-xs">
                  <div className="p-3 rounded-lg bg-rose-50 border border-rose-200">
                    <div className="font-bold text-rose-800">Tồn kho sắp hết ({lowStockProducts.length} SP)</div>
                    {lowStockProducts.map(p => <div key={p.id} className="text-rose-700 flex justify-between mt-1"><span>{p.name}</span><strong>Còn {p.stock}</strong></div>)}
                  </div>
                  <div className="p-3 rounded-lg bg-amber-50 border border-amber-200">
                    <div className="font-bold text-amber-800">Biên LN thấp &lt;20% ({lowMarginProducts.length} SP)</div>
                    {lowMarginProducts.map(p => <div key={p.id} className="text-amber-700 flex justify-between mt-1"><span>{p.name}</span><strong>{p.margin.toFixed(1)}%</strong></div>)}
                  </div>
                </div>
              </div>
              <button onClick={() => setActiveTab('ai')} className="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">
                Mở AI Intelligence ✨
              </button>
            </div>
          </div>
        </div>
      );
    }

    function KpiCard({ title, sub, value, trend, trendPositive, color }) {
      const borders = { indigo: 'border-l-indigo-500', amber: 'border-l-amber-500', emerald: 'border-l-emerald-500', rose: 'border-l-rose-500', sky: 'border-l-sky-500' };
      return (
        <div className={`bg-white p-4 rounded-xl border border-slate-200 border-l-4 ${borders[color]} shadow-sm`}>
          <div className="text-xs font-medium text-slate-500">{title}</div>
          <div className="text-xl font-bold text-slate-900 mt-1">{value}</div>
          <div className="text-[11px] text-slate-500 mt-1">{sub}</div>
          <div className={`text-xs font-semibold mt-2 ${trendPositive ? 'text-emerald-600' : 'text-rose-600'}`}>{trend}</div>
        </div>
      );
    }

    function BarItem({ heightPct, color, label }) {
      return (
        <div className="flex flex-col items-center justify-end h-full w-12">
          <div className="text-[10px] font-semibold text-slate-600 mb-1 whitespace-nowrap">{label.replace('₫', '')}</div>
          <div className={`w-full rounded-t-md ${color}`} style={{ height: `${Math.max(4, heightPct)}%` }}></div>
        </div>
      );
    }

    function OrdersView({ orders, products, onCreateOrder, onChangeStatus }) {
      const [customerName, setCustomerName] = useState('');
      const [orderDate, setOrderDate] = useState(todayStr());
      const [status, setStatus] = useState('completed');
      const [selectedProdId, setSelectedProdId] = useState('');
      const [qty, setQty] = useState(1);
      const [cart, setCart] = useState([]);

      const activeProdId = selectedProdId || products[0]?.id || '';

      const addToCart = () => {
        if (!activeProdId || qty <= 0) return;
        const exist = cart.find(c => c.product_id === activeProdId);
        if (exist) setCart(cart.map(c => c.product_id === activeProdId ? { ...c, quantity: c.quantity + Number(qty) } : c));
        else setCart([...cart, { product_id: activeProdId, quantity: Number(qty) }]);
      };

      const submitOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return alert('Vui lòng thêm sản phẩm vào đơn!');
        onCreateOrder({ customer_name: customerName, order_date: orderDate, status, selectedItems: cart });
        setCustomerName('');
        setCart([]);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h2 className="font-bold text-slate-800 mb-3">➕ Tạo đơn hàng mới</h2>
            <form onSubmit={submitOrder} className="space-y-3 text-sm">
              <input value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="Tên khách hàng" className="w-full px-3 py-2 border border-slate-300 rounded-lg" />
              <div className="grid grid-cols-2 gap-2">
                <input type="date" value={orderDate} onChange={e => setOrderDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                <select value={status} onChange={e => setStatus(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                  <option value="completed">completed</option>
                  <option value="pending">pending</option>
                </select>
              </div>
              <div className="flex gap-2">
                <select value={activeProdId} onChange={e => setSelectedProdId(e.target.value)} className="flex-1 px-2 py-2 border border-slate-300 rounded-lg text-xs">
                  {products.map(p => <option key={p.id} value={p.id}>{p.name} (Tồn: {p.stock})</option>)}
                </select>
                <input type="number" min="1" value={qty} onChange={e => setQty(e.target.value)} className="w-16 px-2 py-2 border border-slate-300 rounded-lg text-center" />
                <button type="button" onClick={addToCart} className="px-3 py-2 bg-slate-800 text-white rounded-lg text-xs">Thêm</button>
              </div>
              {cart.length > 0 && (
                <div className="bg-slate-50 p-2.5 rounded-lg text-xs space-y-1">
                  {cart.map(c => {
                    const p = products.find(pr => pr.id === c.product_id);
                    return <div key={c.product_id} className="flex justify-between"><span>{p?.name} × {c.quantity}</span><strong>{formatVND((p?.selling_price || 0) * c.quantity)}</strong></div>;
                  })}
                </div>
              )}
              <button type="submit" disabled={products.length === 0} className="w-full py-2.5 bg-indigo-600 text-white rounded-lg font-semibold disabled:opacity-50">Lưu đơn hàng</button>
            </form>
          </div>

          <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
            <h2 className="font-bold text-slate-800 mb-3">Danh sách đơn hàng ({orders.length})</h2>
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-600 uppercase border-b">
                <tr><th className="py-2 px-3">Mã / Ngày</th><th className="py-2 px-3">Chi tiết</th><th className="py-2 px-3 text-right">Doanh thu</th><th className="py-2 px-3">Trạng thái</th></tr>
              </thead>
              <tbody className="divide-y">
                {orders.map(o => {
                  const totalRev = o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0);
                  return (
                    <tr key={o.id}>
                      <td className="py-2.5 px-3"><div className="font-bold">{String(o.id).slice(0, 8).toUpperCase()}</div><div className="text-slate-500">{o.order_date}</div></td>
                      <td className="py-2.5 px-3">{o.items.map((it, i) => <div key={i}>{it.name} × {it.quantity} <span className="text-slate-400">(Vốn lưu: {formatVND(it.unit_cost)})</span></div>)}</td>
                      <td className="py-2.5 px-3 text-right font-semibold">{o.status === 'completed' ? formatVND(totalRev) : <span className="line-through text-slate-400">{formatVND(totalRev)}</span>}</td>
                      <td className="py-2.5 px-3">
                        <select value={o.status} onChange={e => onChangeStatus(o.id, e.target.value)} className="px-2 py-1 border rounded font-semibold">
                          <option value="completed">completed</option><option value="pending">pending</option><option value="cancelled">cancelled</option>
                        </select>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ProductsView({ products, onAddProduct, onUpdateProduct }) {
      const [form, setForm] = useState({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 });
      const [editingId, setEditingId] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = {
          name: form.name,
          selling_price: Number(form.selling_price),
          cost_price: Number(form.cost_price),
          stock: Number(form.stock),
          low_stock_threshold: Number(form.low_stock_threshold || 10)
        };
        if (editingId) { onUpdateProduct({ ...payload, id: editingId }); setEditingId(null); }
        else onAddProduct(payload);
        setForm({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 });
      };

      const startEdit = (p) => {
        setEditingId(p.id);
        setForm({
          name: p.name,
          selling_price: p.selling_price,
          cost_price: p.cost_price,
          stock: p.stock,
          low_stock_threshold: p.low_stock_threshold
        });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h2 className="font-bold text-slate-800 mb-3">{editingId ? '✏️ Sửa sản phẩm' : '➕ Thêm sản phẩm'}</h2>
            <form onSubmit={handleSubmit} className="space-y-3 text-sm">
              <input required placeholder="Tên sản phẩm" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <div className="grid grid-cols-2 gap-2">
                <input required type="number" placeholder="Giá bán" value={form.selling_price} onChange={e => setForm({ ...form, selling_price: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
                <input required type="number" placeholder="Giá vốn" value={form.cost_price} onChange={e => setForm({ ...form, cost_price: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <input required type="number" placeholder="Tồn kho" value={form.stock} onChange={e => setForm({ ...form, stock: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
                <input required type="number" placeholder="Ngưỡng cảnh báo" value={form.low_stock_threshold} onChange={e => setForm({ ...form, low_stock_threshold: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              </div>
              <div className="flex gap-2">
                <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-lg font-semibold">{editingId ? 'Cập nhật' : 'Thêm sản phẩm'}</button>
                {editingId && (
                  <button type="button" onClick={() => { setEditingId(null); setForm({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 }); }} className="px-3 py-2.5 border rounded-lg text-xs">Hủy</button>
                )}
              </div>
            </form>
          </div>
          <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
            <h2 className="font-bold text-slate-800 mb-3">Danh sách sản phẩm ({products.length})</h2>
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 uppercase border-b"><tr><th className="py-2 px-3">Sản phẩm</th><th className="py-2 px-3 text-right">Giá bán</th><th className="py-2 px-3 text-right">Giá vốn</th><th className="py-2 px-3 text-right">Biên LN</th><th className="py-2 px-3 text-center">Tồn</th><th className="py-2 px-3"></th></tr></thead>
              <tbody className="divide-y">
                {products.map(p => (
                  <tr key={p.id} className={p.isLowStock ? 'bg-rose-50/50' : ''}>
                    <td className="py-2.5 px-3 font-medium">{p.name} {p.isLowStock && <span className="ml-1 px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded text-[10px] font-bold">SẮP HẾT</span>}</td>
                    <td className="py-2.5 px-3 text-right">{formatVND(p.selling_price)}</td>
                    <td className="py-2.5 px-3 text-right">{formatVND(p.cost_price)}</td>
                    <td className={`py-2.5 px-3 text-right font-bold ${p.isLowMargin ? 'text-amber-600' : 'text-emerald-600'}`}>{p.margin.toFixed(1)}%</td>
                    <td className="py-2.5 px-3 text-center font-bold">{p.stock}</td>
                    <td className="py-2.5 px-3 text-right"><button onClick={() => startEdit(p)} className="text-indigo-600 font-semibold">Sửa</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function FinanceView({ expenses, analytics, onAddExpense }) {
      const [form, setForm] = useState({ type: 'expense', category: 'Nguyên liệu', amount: '', expense_date: todayStr(), note: '' });
      const submit = (e) => {
        e.preventDefault();
        if (!form.amount) return;
        onAddExpense({ ...form, amount: Number(form.amount) });
        setForm({ ...form, amount: '', note: '' });
      };
      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h2 className="font-bold text-slate-800 mb-3">➕ Ghi nhận Thu / Chi</h2>
            <form onSubmit={submit} className="space-y-3 text-sm">
              <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className="w-full px-3 py-2 border rounded-lg">
                <option value="expense">Chi phí vận hành (Trừ Lợi nhuận)</option>
                <option value="inventory_purchase">Chi nhập hàng tồn kho (Chỉ trừ Dòng tiền)</option>
                <option value="income">Thu nhập khác</option>
              </select>
              <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="w-full px-3 py-2 border rounded-lg">
                <option value="Nguyên liệu">Nguyên liệu</option><option value="Vận chuyển">Vận chuyển</option><option value="Mặt bằng">Mặt bằng</option><option value="Nhập hàng tồn kho">Nhập hàng tồn kho</option><option value="Thu khác">Thu khác</option>
              </select>
              <input required type="number" placeholder="Số tiền" value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <input required type="date" value={form.expense_date} onChange={e => setForm({ ...form, expense_date: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <input placeholder="Ghi chú" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <button type="submit" className="w-full py-2.5 bg-indigo-600 text-white rounded-lg font-semibold">Lưu giao dịch</button>
            </form>
          </div>
          <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
            <h2 className="font-bold text-slate-800 mb-3">Sổ Thu Chi (LN: {formatVND(analytics.thisM.netProfit)} | Dòng tiền: {formatVND(analytics.thisM.cashFlow)})</h2>
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 uppercase border-b"><tr><th className="py-2 px-3">Ngày</th><th className="py-2 px-3">Danh mục</th><th className="py-2 px-3">Ghi chú</th><th className="py-2 px-3 text-right">Số tiền</th></tr></thead>
              <tbody className="divide-y">
                {expenses.map(e => (
                  <tr key={e.id}>
                    <td className="py-2 px-3 text-slate-500">{e.expense_date}</td>
                    <td className="py-2 px-3 font-medium">{e.category}</td>
                    <td className="py-2 px-3 text-slate-600">{e.note}</td>
                    <td className={`py-2 px-3 text-right font-bold ${e.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`}>{e.type === 'income' ? '+' : '-'}{formatVND(e.amount)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // AI INTELLIGENCE: GỌI QUA SUPABASE EDGE FUNCTION (KHÔNG LỘ API KEY)
    // ==========================================
    function AIIntelligenceView({ analytics, showPipeline, expenses }) {
      const { thisM, lastM, revChangePct, profitChangePct, materialDiff, shippingDiff, lowStockProducts, lowMarginProducts } = analytics;
      const [messages, setMessages] = useState([
        { role: 'ai', text: `Xin chào! Tôi là BizFlowAI. Tôi đã tổng hợp dữ liệu kỳ ${thisM.monthKey}. Hãy chọn câu hỏi gợi ý bên dưới hoặc đặt câu hỏi cho tôi!` }
      ]);
      const [input, setInput] = useState('');
      const [thinking, setThinking] = useState(false);

      const generateLocalAnswer = (q) => {
        const lower = q.toLowerCase();
        if (/^(xin )?chào|^hello|^hi\b/.test(lower)) return '👋 Xin chào! Bạn có thể hỏi về lợi nhuận, dòng tiền hoặc tồn kho của cửa hàng.';
        if (lower.includes('lợi nhuận') && !lower.includes('dòng tiền') && (lower.includes('thay đổi') || lower.includes('vì sao') || lower.includes('tại sao'))) {
          return `📊 PHÂN TÍCH LỢI NHUẬN (${thisM.monthKey} vs ${lastM.monthKey}):\n• Doanh thu: ${formatVND(thisM.revenue)} (${revChangePct.toFixed(1)}%)\n• Lợi nhuận ròng: ${formatVND(thisM.netProfit)} (${profitChangePct.toFixed(1)}%)\n• Chi phí nguyên liệu biến động: ${materialDiff >= 0 ? '+' : ''}${formatVND(materialDiff)}\n• Chi phí vận chuyển biến động: ${shippingDiff >= 0 ? '+' : ''}${formatVND(shippingDiff)}\n• SP biên lợi nhuận thấp (<20%): ${lowMarginProducts.map(p => `${p.name} (${p.margin.toFixed(1)}%)`).join(', ') || 'Không có'}.`;
        }
        if (lower.includes('tồn kho') || lower.includes('hết hàng')) {
          return lowStockProducts.length === 0 ? '✅ Tồn kho hiện tại an toàn.' : `🚨 CẢNH BÁO TỒN KHO:\n` + lowStockProducts.map(p => `• ${p.name}: Còn ${p.stock} (Ngưỡng: ${p.low_stock_threshold})`).join('\n');
        }
        if (lower.includes('dòng tiền')) {
          return `💵 Lợi nhuận ròng: ${formatVND(thisM.netProfit)} | Dòng tiền thực tế: ${formatVND(thisM.cashFlow)}.\nLý do chênh lệch: Chi ${formatVND(thisM.inventoryCashOut)} tiền nhập hàng tồn kho (làm giảm tiền mặt nhưng chưa tính vào giá vốn tháng này).`;
        }
        return `📈 TÓM TẮT KỲ ${thisM.monthKey}: Doanh thu ${formatVND(thisM.revenue)}, Giá vốn ${formatVND(thisM.cogs)}, Chi phí ${formatVND(thisM.opex)}, Lợi nhuận ròng ${formatVND(thisM.netProfit)}, Dòng tiền ${formatVND(thisM.cashFlow)}.`;
      };

      const sendMessage = async (text) => {
        const q = (text || input).trim();
        if (!q || thinking) return;
        setMessages(prev => [...prev, { role: 'user', text: q }]);
        setInput('');
        setThinking(true);

        try {
          const { data, error } = await sb.functions.invoke('ai-advisor', {
            body: {
              question: q,
              context: {
                thisM,
                lastM,
                lowStockProducts: lowStockProducts.map(p => ({ name: p.name, stock: p.stock, threshold: p.low_stock_threshold })),
                lowMarginProducts: lowMarginProducts.map(p => ({ name: p.name, margin: Number(p.margin.toFixed(1)) }))
              }
            }
          });

          if (!error && data?.reply) {
            setMessages(prev => [...prev, { role: 'ai', text: data.reply }]);
            return;
          }

          // Fallback an toàn về Local Engine nếu chưa deploy Edge Function
          const fallback = generateLocalAnswer(q);
          setMessages(prev => [...prev, { role: 'ai', text: `${fallback}\n\n(⚙️ Chế độ phân tích nội bộ)` }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'ai', text: generateLocalAnswer(q) }]);
        } finally {
          setThinking(false);
        }
      };

      return (
        <div className="space-y-4">
          {showPipeline && (
            <div className="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs grid grid-cols-1 md:grid-cols-3 gap-4">
              <div><strong className="text-indigo-300">1. INPUT:</strong> {thisM.completedCount} đơn completed, {expenses.length} phiếu thu/chi</div>
              <div><strong className="text-amber-300">2. PROCESS:</strong> LN = {formatVND(thisM.revenue)} - {formatVND(thisM.cogs)} - {formatVND(thisM.opex)}</div>
              <div><strong className="text-emerald-300">3. OUTPUT:</strong> {lowStockProducts.length} cảnh báo tồn, {lowMarginProducts.length} SP biên thấp</div>
            </div>
          )}

          <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col h-[480px]">
            <div className="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-thin">
              {messages.map((m, idx) => (
                <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[85%] rounded-xl px-4 py-3 text-xs whitespace-pre-line ${m.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-800 border'}`}>{m.text}</div>
                </div>
              ))}
              {thinking && (
                <div className="flex justify-start">
                  <div className="rounded-xl px-4 py-2 text-xs bg-slate-100 text-slate-500 border">⏳ BizFlowAI đang phân tích số liệu...</div>
                </div>
              )}
            </div>
            <div className="px-4 py-2 border-t flex flex-wrap gap-1.5 bg-slate-50">
              {['Vì sao lợi nhuận tháng này thay đổi?', 'Sản phẩm nào sắp hết hàng?', 'Tại sao dòng tiền khác lợi nhuận?'].map((q, i) => (
                <button key={i} onClick={() => sendMessage(q)} disabled={thinking} className="text-[11px] px-2.5 py-1 rounded-full bg-white border hover:border-indigo-500 disabled:opacity-50">{q}</button>
              ))}
            </div>
            <form onSubmit={e => { e.preventDefault(); sendMessage(); }} className="p-3 border-t flex gap-2">
              <input value={input} onChange={e => setInput(e.target.value)} placeholder="Đặt câu hỏi cho BizFlowAI..." className="flex-1 px-3 py-2 border rounded-lg text-sm" />
              <button type="submit" disabled={thinking} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold disabled:opacity-50">Gửi</button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
