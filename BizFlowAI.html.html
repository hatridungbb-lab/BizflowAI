  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // TIỆN ÍCH ĐỊNH DẠNG TIỀN, SỐ ĐIỆN THOẠI & NGÀY THÁNG
    // ==========================================
    const formatTien = (num) => {
      const rounded = Math.round(num || 0);
      const sign = rounded < 0 ? '-' : '';
      return `${sign}${Math.abs(rounded).toLocaleString('vi-VN')}đ`;
    };

    const formatNumberInput = (val) => {
      const digits = String(val ?? '').replace(/\D/g, '');
      if (!digits) return '';
      return Number(digits).toLocaleString('vi-VN');
    };

    const parseDigits = (val) => {
      const digits = String(val ?? '').replace(/\D/g, '');
      return digits ? parseInt(digits, 10) : 0;
    };

    const normalizePhone = (raw) => {
      const cleaned = String(raw || '').replace(/[\s.\-()]/g, '');
      if (!cleaned) return '';
      if (cleaned.startsWith('0')) return `+84${cleaned.slice(1)}`;
      if (cleaned.startsWith('84')) return `+${cleaned}`;
      if (cleaned.startsWith('+')) return cleaned;
      return `+84${cleaned}`;
    };

    const isValidPhone = (e164) => /^\+\d{9,15}$/.test(e164);

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const getMonthKey = (dateStr) => (dateStr || '').slice(0, 7);

    const currentDate = new Date();
    const THIS_MONTH = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const prevDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    const LAST_MONTH = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

    const ORDER_STATUS_LABEL = {
      completed: 'Đã bán',
      pending: 'Chờ giao',
      cancelled: 'Đã hủy'
    };

    // ==========================================
    // Ô NHẬP TIỀN GỌN ĐẸP (50.000, CHỈ GÕ SỐ)
    // ==========================================
    function MoneyInput({ value, onChange, placeholder = 'Nhập số tiền', required = false, className = '' }) {
      const handleChange = (e) => {
        const digits = e.target.value.replace(/\D/g, '');
        onChange(digits ? String(parseInt(digits, 10)) : '');
      };

      return (
        <div className="relative">
          <input
            type="text"
            inputMode="numeric"
            required={required}
            value={formatNumberInput(value)}
            onChange={handleChange}
            placeholder={placeholder}
            className={`w-full min-h-[44px] px-3.5 py-2 pr-9 border-2 border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-blue-700 bg-white ${className}`}
          />
          <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-500">đ</span>
        </div>
      );
    }

    // ==========================================
    // HỘP THOẠI XÁC NHẬN
    // ==========================================
    function ConfirmModal({ open, title, message, confirmLabel = 'Đồng ý', cancelLabel = 'Quay lại', danger = false, onConfirm, onCancel }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border-2 border-blue-200 rounded-2xl p-4 sm:p-5 max-w-sm w-full shadow-2xl space-y-3">
            <h3 className="text-lg font-extrabold text-slate-900 leading-snug">{title}</h3>
            <p className="text-sm sm:text-base text-slate-700 leading-relaxed">{message}</p>
            <div className="grid grid-cols-2 gap-2.5 pt-1">
              <button
                type="button"
                onClick={onCancel}
                className="min-h-[44px] px-3 py-2 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-900 text-sm sm:text-base font-bold"
              >
                {cancelLabel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className={`min-h-[44px] px-3 py-2 rounded-xl text-white text-sm sm:text-base font-bold shadow-md ${
                  danger ? 'bg-rose-700 hover:bg-rose-800' : 'bg-blue-700 hover:bg-blue-800'
                }`}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // NÚT CHUYỂN NỀN SÁNG / TỐI
    // ==========================================
    function ThemeToggleButton({ theme, onToggle, compact = false }) {
      const isDark = theme === 'dark';
      return (
        <button
          type="button"
          onClick={onToggle}
          title={isDark ? 'Chuyển sang nền sáng' : 'Chuyển sang nền tối'}
          className={`min-h-[38px] sm:min-h-[42px] inline-flex items-center justify-center gap-1.5 rounded-xl border-2 text-xs sm:text-sm font-bold transition shrink-0 ${
            compact ? 'px-2.5 py-1.5' : 'px-3 py-1.5'
          } ${
            isDark
              ? 'bg-slate-800 border-slate-600 text-sky-400 hover:bg-slate-700'
              : 'bg-blue-50 border-blue-200 text-blue-800 hover:bg-blue-100'
          }`}
        >
          <span>{isDark ? '☀️' : '🌙'}</span>
          {!compact && <span>{isDark ? 'Nền sáng' : 'Nền tối'}</span>}
        </button>
      );
    }

    // ==========================================
    // LOGO BIZFLOW AI
    // ==========================================
    function BizFlowLogo({ size = 'md', showTagline = false }) {
      const uid = React.useId().replace(/:/g, '');
      const blueId = `bfBlue-${uid}`;
      const arrowId = `bfArrow-${uid}`;
      const iconSizes = { sm: 'w-7 h-7', md: 'w-8 h-8', lg: 'w-12 h-12' };
      const textSizes = { sm: 'text-base sm:text-lg', md: 'text-lg sm:text-xl', lg: 'text-2xl' };

      return (
        <div className="flex items-center gap-2 select-none min-w-0">
          <svg viewBox="0 0 120 110" className={`${iconSizes[size]} shrink-0 drop-shadow-sm`} fill="none">
            <defs>
              <linearGradient id={blueId} x1="15" y1="10" x2="105" y2="100" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#0ea5e9" />
                <stop offset="50%" stopColor="#2563eb" />
                <stop offset="100%" stopColor="#4338ca" />
              </linearGradient>
              <linearGradient id={arrowId} x1="15" y1="85" x2="112" y2="18" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#38bdf8" />
                <stop offset="100%" stopColor="#1d4ed8" />
              </linearGradient>
            </defs>
            <path
              d="M28 14 H66 C85 14 96 24 96 38 C96 47 90 54 81 58 C93 61 100 71 100 83 C100 98 87 104 68 104 H22 L28 14 Z M47 31 L45 48 H64 C71 48 76 44 76 39 C76 34 71 31 64 31 H47 Z"
              fill={`url(#${blueId})`}
            />
            <path d="M16 86 C34 62 58 50 86 42 C60 56 38 72 22 96 Z" fill="#ffffff" />
            <rect x="40" y="76" width="9" height="18" rx="2" fill="#ffffff" />
            <rect x="54" y="68" width="9" height="26" rx="2" fill="#ffffff" />
            <rect x="68" y="59" width="9" height="35" rx="2" fill="#ffffff" />
            <path d="M56 54 C74 47 90 36 104 23" stroke={`url(#${arrowId})`} strokeWidth="7" strokeLinecap="round" />
            <path d="M92 20 L111 16 L107 35 Z" fill="#2563eb" />
          </svg>

          <div className="min-w-0">
            <div className={`font-extrabold tracking-tight leading-none truncate ${textSizes[size]}`}>
              <span className="text-slate-900">BizFlow</span>{' '}
              <span className="text-blue-700">AI</span>
            </div>
            {showTagline && (
              <div className="text-xs font-medium text-slate-600 mt-0.5 hidden sm:block">
                Sổ ghi bán hàng & tính tiền lãi cho cửa hàng
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // ỨNG DỤNG CHÍNH
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState(false);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [expenses, setExpenses] = useState([]);

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('bizflow_theme') || 'light'; } catch { return 'light'; }
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        try { localStorage.setItem('bizflow_theme', theme); } catch {}
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      const loadProfile = async (authUser) => {
        try {
          let { data: prof, error } = await sb
            .from('profiles')
            .select('*')
            .eq('id', authUser.id)
            .maybeSingle();

          if (!prof || error) {
            const shopName = authUser.user_metadata?.shop_name || 'Cửa hàng của bạn';
            const isDemo = Boolean(authUser.user_metadata?.is_demo || authUser.is_anonymous);
            const { data: ensured, error: ensureErr } = await sb.rpc('ensure_profile', {
              p_shop_name: shopName,
              p_is_demo: isDemo
            });
            if (ensureErr || !ensured) return null;
            prof = ensured;
          }

          const isDemo = Boolean(prof.is_demo || authUser.is_anonymous || authUser.user_metadata?.is_demo);
          const plan = isDemo ? 'ai_199k' : (prof.plan || authUser.user_metadata?.plan || 'free');
          const hasAI = isDemo || plan === 'ai_199k';

          return {
            id: authUser.id,
            phone: authUser.phone || authUser.email || 'Tài khoản xem thử',
            shop_name: prof.shop_name,
            is_demo: isDemo,
            plan,
            has_ai: hasAI
          };
        } catch (err) {
          console.error('Lỗi tải hồ sơ:', err);
          return null;
        }
      };

      const loadData = async () => {
        try {
          const [p, o, t] = await Promise.all([
            sb.from('products').select('*').order('name'),
            sb.from('orders').select('*, order_items(*)').order('order_date', { ascending: false }).order('created_at', { ascending: false }),
            sb.from('transactions').select('*').order('transaction_date', { ascending: false }).order('created_at', { ascending: false }),
          ]);

          if (p.error) console.error('Lỗi tải hàng hóa:', p.error);
          if (o.error) console.error('Lỗi tải đơn hàng:', o.error);
          if (t.error) console.error('Lỗi tải thu chi:', t.error);

          setProducts((p.data || []).map(x => ({
            ...x,
            selling_price: Number(x.selling_price),
            cost_price: Number(x.cost_price)
          })));
          setOrders((o.data || []).map(x => ({
            ...x,
            items: (x.order_items || []).map(i => ({
              ...i,
              quantity: Number(i.quantity),
              unit_price: Number(i.unit_price),
              unit_cost: Number(i.unit_cost)
            }))
          })));
          setExpenses((t.data || []).map(x => ({
            ...x,
            amount: Number(x.amount),
            expense_date: x.transaction_date
          })));
        } catch (err) {
          console.error('Lỗi tải dữ liệu:', err);
        }
      };

      const finishLogin = async (authUser) => {
        const u = await loadProfile(authUser);
        setCurrentUser(u);
        if (u) await loadData();
        return u;
      };

      useEffect(() => {
        sb.auth.getSession().then(async ({ data }) => {
          if (data?.session?.user) await finishLogin(data.session.user);
          setLoading(false);
        }).catch((err) => {
          console.error('Lỗi kiểm tra đăng nhập:', err);
          setLoading(false);
        });

        const { data: sub } = sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') {
            setCurrentUser(null);
            setProducts([]);
            setOrders([]);
            setExpenses([]);
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      const handleSendOtp = async ({ phone, shop_name, isRegister }) => {
        const options = isRegister
          ? { shouldCreateUser: true, data: { shop_name, is_demo: false, plan: 'free' } }
          : { shouldCreateUser: false };

        const { error } = await sb.auth.signInWithOtp({ phone, options });
        if (error) {
          console.error('Lỗi gửi OTP:', error);
          const msg = (error.message || '').toLowerCase();
          if (!isRegister && (msg.includes('signups not allowed') || msg.includes('not found') || msg.includes('user'))) {
            return { error: 'Số điện thoại này chưa có sổ. Bạn bấm sang tab "Tạo sổ mới" nhé!' };
          }
          if (msg.includes('rate') || msg.includes('limit') || msg.includes('seconds')) {
            return { error: 'Bạn vừa yêu cầu gửi mã rồi, vui lòng đợi một lát rồi thử lại nhé.' };
          }
          return { error: 'Chưa gửi được mã OTP, bạn kiểm tra lại số điện thoại nhé.' };
        }
        return { ok: true };
      };

      const handleVerifyOtp = async ({ phone, token, shop_name, isRegister }) => {
        const { data, error } = await sb.auth.verifyOtp({
          phone,
          token,
          type: 'sms'
        });
        if (error) {
          console.error('Lỗi xác nhận OTP:', error);
          return { error: 'Mã OTP chưa đúng hoặc đã hết hạn, bạn kiểm tra lại nhé!' };
        }
        const authUser = data?.session?.user || data?.user;
        if (!authUser) {
          return { error: 'Chưa đăng nhập được, bạn thử gửi lại mã OTP nhé.' };
        }
        if (isRegister && shop_name && !authUser.user_metadata?.shop_name) {
          await sb.auth.updateUser({ data: { shop_name, is_demo: false, plan: 'free' } }).catch(() => {});
        }
        await finishLogin(authUser);
        return { ok: true };
      };

      const handleLogout = async () => {
        await sb.auth.signOut();
      };

      const handleQuickDemo = async () => {
        if (busy) return;
        setBusy(true);
        try {
          let authData = null;
          const anonRes = await sb.auth.signInAnonymously({
            options: { data: { shop_name: 'Tiệm Tạp Hóa Mẫu', is_demo: true, plan: 'ai_199k' } }
          });

          if (!anonRes.error && anonRes.data?.session) {
            authData = anonRes.data;
          } else {
            const randId = Math.random().toString(36).slice(2, 9);
            const signUpRes = await sb.auth.signUp({
              email: `demo.${randId}@demo.bizflowai.vn`,
              password: `Demo#${randId}88`,
              options: { data: { shop_name: `Cửa hàng Mẫu #${randId.toUpperCase()}`, is_demo: true, plan: 'ai_199k' } }
            });
            if (signUpRes.error || !signUpRes.data?.session) {
              console.error('Lỗi mở bản mẫu:', anonRes.error, signUpRes.error);
              alert('Chưa mở được bản mẫu, bạn thử lại nhé!');
              return;
            }
            authData = signUpRes.data;
          }

          await finishLogin(authData.session.user);
          await sb.rpc('seed_sample_data', { p_reset: false });
          await loadData();
        } catch (err) {
          console.error('Lỗi bản mẫu:', err);
          alert('Chưa mở được bản mẫu, bạn thử lại nhé!');
        } finally {
          setBusy(false);
        }
      };

      const handleResetSampleData = async () => {
        if (busy) return;
        setBusy(true);
        try {
          const { error } = await sb.rpc('seed_sample_data', { p_reset: true });
          if (error) {
            console.error('Lỗi làm mới dữ liệu mẫu:', error);
            alert('Chưa làm mới được dữ liệu mẫu, bạn thử lại nhé!');
          } else {
            await loadData();
          }
        } finally {
          setBusy(false);
        }
      };

      if (loading) {
        return (
          <div className="h-[100dvh] flex flex-col items-center justify-center gap-3 bg-business-grid px-4">
            <BizFlowLogo size="lg" />
            <div className="text-base text-blue-800 font-bold">Đang mở sổ cửa hàng cho bạn...</div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <AuthPage
            onSendOtp={handleSendOtp}
            onVerifyOtp={handleVerifyOtp}
            onQuickDemo={handleQuickDemo}
            demoLoading={busy}
            theme={theme}
            onToggleTheme={toggleTheme}
          />
        );
      }

      return (
        <WorkspaceApp
          user={currentUser}
          onLogout={handleLogout}
          products={products}
          orders={orders}
          expenses={expenses}
          busy={busy}
          onResetSampleData={handleResetSampleData}
          onReload={loadData}
          theme={theme}
          onToggleTheme={toggleTheme}
        />
      );
    }

    // ==========================================
    // MÀN HÌNH ĐĂNG NHẬP & ĐĂNG KÝ BẰNG SĐT + OTP (FIT MÀN HÌNH)
    // ==========================================
    function AuthPage({ onSendOtp, onVerifyOtp, onQuickDemo, demoLoading, theme, onToggleTheme }) {
      const [mode, setMode] = useState('login');
      const [step, setStep] = useState('phone'); // 'phone' | 'otp'
      const [shopName, setShopName] = useState('');
      const [phoneInput, setPhoneInput] = useState('');
      const [normalizedPhone, setNormalizedPhone] = useState('');
      const [otp, setOtp] = useState('');
      const [countdown, setCountdown] = useState(0);
      const [error, setError] = useState('');
      const [info, setInfo] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (countdown <= 0) return;
        const t = setTimeout(() => setCountdown(c => c - 1), 1000);
        return () => clearTimeout(t);
      }, [countdown]);

      const switchMode = (nextMode) => {
        setMode(nextMode);
        setStep('phone');
        setOtp('');
        setError('');
        setInfo('');
      };

      const sendOtpSubmit = async (e) => {
        if (e) e.preventDefault();
        setError('');
        setInfo('');

        if (mode === 'register' && !shopName.trim()) {
          setError('Bạn vui lòng nhập tên cửa hàng nhé.');
          return;
        }

        const formatted = normalizePhone(phoneInput);
        if (!isValidPhone(formatted)) {
          setError('Số điện thoại chưa đúng, bạn nhập lại nhé (ví dụ: 0912 345 678).');
          return;
        }

        setSubmitting(true);
        try {
          const res = await onSendOtp({
            phone: formatted,
            shop_name: shopName.trim(),
            isRegister: mode === 'register'
          });
          if (res.error) {
            setError(res.error);
          } else {
            setNormalizedPhone(formatted);
            setStep('otp');
            setOtp('');
            setCountdown(60);
            setInfo(`Đã gửi mã OTP qua tin nhắn tới số ${phoneInput.trim()}.`);
          }
        } finally {
          setSubmitting(false);
        }
      };

      const verifyOtpSubmit = async (e) => {
        e.preventDefault();
        setError('');

        const cleanOtp = otp.replace(/\D/g, '');
        if (cleanOtp.length < 4) {
          setError('Bạn hãy nhập đủ mã số OTP nhận được trong tin nhắn nhé.');
          return;
        }

        setSubmitting(true);
        try {
          const res = await onVerifyOtp({
            phone: normalizedPhone,
            token: cleanOtp,
            shop_name: shopName.trim(),
            isRegister: mode === 'register'

          setSubmitting(false);
        }

              <BizFlowLogo size="sm" showTagline={true} />
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <ThemeToggleButton theme={theme} onToggle={onToggleTheme} compact={true} />
                <button
                  onClick={onQuickDemo}
                  disabled={demoLoading}
                  className="min-h-[38px] sm:min-h-[42px] px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-blue-50 text-blue-800 border-2 border-blue-200 text-xs sm:text-sm font-bold hover:bg-blue-100 transition disabled:opacity-50 whitespace-nowrap"
                >
                  {demoLoading ? '⏳ Đang mở...' : '👀 Xem bản mẫu'}
                </button>
              </div>
            </div>
          </header>

          {/* NỘI DUNG VỪA KHÍT MÀN HÌNH */}
          <main className="flex-1 min-h-0 overflow-y-auto flex items-center py-2.5 sm:py-5">
            <div className="max-w-5xl w-full mx-auto px-3 sm:px-4 grid grid-cols-1 lg:grid-cols-12 gap-3 lg:gap-6 items-center my-auto">
              {/* TIÊU ĐỀ NGẮN GỌN */}
              <div className="lg:hidden text-center space-y-1">
                <h1 className="text-lg font-extrabold text-slate-900 leading-snug">
                  Biết ngay <span className="text-blue-700">Hôm nay lãi bao nhiêu</span>
                </h1>
                <p className="text-xs text-slate-600">
                  Chữ gọn dễ đọc • Đăng nhập bằng SĐT • Tự trừ kho
                </p>
              </div>

              {/* KHUNG ĐĂNG NHẬP / TẠO SỔ */}
              <div className="lg:order-2 lg:col-span-6 bg-white rounded-2xl sm:rounded-3xl p-4 sm:p-5 shadow-lg border-2 border-blue-100 min-w-0">
                <div className="grid grid-cols-2 gap-1.5 bg-blue-50/80 p-1 rounded-xl mb-3.5">
                  <button
                    type="button"
                    onClick={() => switchMode('login')}
                    className={`min-h-[40px] py-1.5 text-sm sm:text-base font-bold rounded-lg transition ${mode === 'login' ? 'bg-white text-blue-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    Đăng nhập
                  </button>
                  <button
                    type="button"
                    onClick={() => switchMode('register')}
                    className={`min-h-[40px] py-1.5 text-sm sm:text-base font-bold rounded-lg transition ${mode === 'register' ? 'bg-white text-blue-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    Tạo sổ mới
                  </button>
                </div>

                {error && (
                  <div className="mb-3 p-2.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs sm:text-sm font-bold">
                    {error}
                  </div>
                )}

                {info && (
                  <div className="mb-3 p-2.5 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs sm:text-sm font-bold">
                    📩 {info}
                  </div>
                )}

                {step === 'phone' ? (
                  <form onSubmit={sendOtpSubmit} className="space-y-3">
                    {mode === 'register' && (
                      <div>
                        <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">Tên cửa hàng của bạn</label>
                        <input
                          required
                          value={shopName}
                          onChange={e => setShopName(e.target.value)}
                          placeholder="Ví dụ: Tiệm Tạp Hóa Cô Ba"
                          className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base focus:outline-none focus:border-blue-700"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">Số điện thoại của bạn</label>
                      <input
                        required
                        type="tel"
                        inputMode="tel"
                        value={phoneInput}
                        onChange={e => setPhoneInput(e.target.value)}
                        placeholder="Ví dụ: 0912 345 678"
                        className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-blue-700"
                      />
                    </div>

                    <div className="p-2.5 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-900 leading-snug">
                      📱 Không cần mật khẩu. Hệ thống sẽ gửi mã OTP về tin nhắn điện thoại.
                    </div>

                    <button
                      type="submit"
                      disabled={submitting}
                      className="w-full min-h-[46px] py-2.5 bg-blue-700 hover:bg-blue-800 text-white text-sm sm:text-base font-extrabold rounded-xl shadow-md transition disabled:opacity-50"
                    >
                      {submitting ? 'Đang gửi mã OTP...' : 'Gửi mã OTP →'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={verifyOtpSubmit} className="space-y-3">
                    <div>
                      <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">
                        Nhập mã OTP đã gửi về {phoneInput}
                      </label>
                      <input
                        required
                        type="text"
                        inputMode="numeric"
                        maxLength={6}
                        autoFocus
                        value={otp}
                        onChange={e => setOtp(e.target.value.replace(/\D/g, ''))}
                        placeholder="Nhập 6 số (ví dụ: 123456)"
                        className="w-full min-h-[48px] px-3.5 py-2 border-2 border-blue-500 rounded-xl text-xl font-extrabold tracking-widest text-center focus:outline-none focus:border-blue-700"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={submitting}
                      className="w-full min-h-[46px] py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm sm:text-base font-extrabold rounded-xl shadow-md transition disabled:opacity-50"
                    >
                      {submitting
                        ? 'Đang kiểm tra...'
                        : mode === 'register'
                        ? 'Xác nhận & Tạo cửa hàng →'
                        : 'Xác nhận & Mở sổ →'}
                    </button>

                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => sendOtpSubmit()}
                        disabled={submitting || countdown > 0}
                        className="min-h-[42px] px-2.5 py-1.5 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-800 text-xs sm:text-sm font-bold disabled:opacity-50"
                      >
                        {countdown > 0 ? `Gửi lại (${countdown}s)` : '🔄 Gửi lại mã'}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setStep('phone');
                          setOtp('');
                          setError('');
                          setInfo('');
                        }}
                        className="min-h-[42px] px-2.5 py-1.5 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 text-xs sm:text-sm font-bold"
                      >
                        ← Đổi số khác
                      </button>
                    </div>
                  </form>
                )}
              </div>

              {/* PHẦN GIỚI THIỆU GỌN NHẸ */}
              <div className="lg:order-1 lg:col-span-6 space-y-3 min-w-0">
                <div className="hidden lg:block space-y-2.5">
                  <h1 className="text-2xl xl:text-3xl font-extrabold text-slate-900 leading-snug">
                    Biết ngay <span className="text-blue-700">Hôm nay lãi bao nhiêu</span> chỉ với vài lần chạm.
                  </h1>
                  <p className="text-base text-slate-700 leading-relaxed">
                    Làm riêng cho tiệm tạp hóa và cửa hàng nhỏ. Đăng nhập bằng số điện thoại, bấm là tính tiền và tự trừ hàng trong kho.
                  </p>
                </div>

                <div className="grid grid-cols-3 lg:grid-cols-1 gap-2 sm:gap-2.5">
                  <div className="bg-white p-2.5 sm:p-3.5 rounded-xl sm:rounded-2xl border border-blue-100 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-1.5 lg:gap-3">
                    <span className="text-lg sm:text-xl shrink-0">🧾</span>
                    <div>
                      <div className="font-extrabold text-[11px] sm:text-sm lg:text-base text-slate-900 leading-tight">Chạm là ra đơn</div>
                      <div className="hidden lg:block text-sm text-slate-700 mt-0.5">Bấm chọn món khách mua, tự cộng tiền và trừ hàng còn lại.</div>
                    </div>
                  </div>
                  <div className="bg-white p-2.5 sm:p-3.5 rounded-xl sm:rounded-2xl border border-blue-100 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-1.5 lg:gap-3">
                    <span className="text-lg sm:text-xl shrink-0">💰</span>
                    <div>
                      <div className="font-extrabold text-[11px] sm:text-sm lg:text-base text-slate-900 leading-tight">Rõ tiền lãi ngày</div>
                      <div className="hidden lg:block text-sm text-slate-700 mt-0.5">Thấy ngay hôm nay bán được bao nhiêu và thực sự lãi mấy đồng.</div>
                    </div>
                  </div>
                  <div className="bg-white p-2.5 sm:p-3.5 rounded-xl sm:rounded-2xl border border-blue-100 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-1.5 lg:gap-3">
                    <span className="text-lg sm:text-xl shrink-0">📦</span>
                    <div>
                      <div className="font-extrabold text-[11px] sm:text-sm lg:text-base text-slate-900 leading-tight">Nhắc sắp hết</div>
                      <div className="hidden lg:block text-sm text-slate-700 mt-0.5">Tự động đếm kho và báo ngay món nào sắp hết để nhập kịp.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // KHÔNG GIAN LÀM VIỆC CHÍNH (KHÓA CỨNG 1 KHUNG 100dvh)
    // ==========================================
    function WorkspaceApp({
      user, onLogout, products, orders, expenses,
      busy, onResetSampleData, onReload, theme, onToggleTheme
    }) {
      const hasAI = Boolean(user?.has_ai);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [financePresetMode, setFinancePresetMode] = useState('expense_other');
      const [toast, setToast] = useState(null);
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);
      const [bankTx, setBankTx] = useState([]);
const [bankAlert, setBankAlert] = useState(null);

const loadBank = async () => {
  const { data, error } = await sb
    .from('bank_transactions')
    .select('*')
    .order('occurred_at', { ascending: false })
    .limit(100);
  if (!error) setBankTx((data || []).map(x => ({ ...x, amount: Number(x.amount) })));
};

useEffect(() => {
  loadBank();
  const ch = sb.channel('bank-tx-' + user.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'bank_transactions', filter: `user_id=eq.${user.id}` },
      (payload) => {
        loadBank();
        if (payload.eventType === 'INSERT' && payload.new?.status === 'pending') {
          setBankAlert({ direction: payload.new.direction, amount: Number(payload.new.amount) });
          try { navigator.vibrate && navigator.vibrate(200); } catch {}
        }
      })
    .subscribe();
  const poll = setInterval(loadBank, 30000); // dự phòng nếu realtime rớt
  return () => { sb.removeChannel(ch); clearInterval(poll); };
}, [user.id]);

useEffect(() => {
  if (!bankAlert) return;
  const t = setTimeout(() => setBankAlert(null), 10000);
  return () => clearTimeout(t);
}, [bankAlert]);

const pendingBankCount = bankTx.filter(t => t.status === 'pending').length;

const handleClassifyBank = async (id, action) => {
  const { error } = await sb.rpc('classify_bank_transaction', { p_id: id, p_action: action });
  if (error) {
    console.error(error);
    alert(error.message || 'Chưa phân loại được, bạn thử lại nhé.');
    return false;
  }
  await Promise.all([loadBank(), onReload()]);
  showSaveToast('Đã phân loại giao dịch', async () => {
    await sb.rpc('unclassify_bank_transaction', { p_id: id });
    await Promise.all([loadBank(), onReload()]);
    showSaveToast('Đã hoàn tác giao dịch');
  });
  return true;
};

const handleUnclassifyBank = async (id) => {
  const { error } = await sb.rpc('unclassify_bank_transaction', { p_id: id });
  if (error) { alert('Chưa hoàn tác được, bạn thử lại nhé.'); return; }
  await Promise.all([loadBank(), onReload()]);
};
      useEffect(() => {
        if (!hasAI && activeTab === 'ai') {
          setActiveTab('dashboard');
        }
      }, [hasAI, activeTab]);

      // Đếm ngược thông báo Hoàn tác 10 giây
      useEffect(() => {
        if (!toast || toast.secondsLeft <= 0) return;
        const timer = setInterval(() => {
          setToast(prev => {
            if (!prev) return null;
            if (prev.secondsLeft <= 1) return null;
            return { ...prev, secondsLeft: prev.secondsLeft - 1 };
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [toast?.id]);

      const showSaveToast = (message, undoAction = null) => {
        setToast({
          id: Date.now(),
          message,
          undoAction,
          secondsLeft: 10
        });
      };

      const analytics = useMemo(() => {
        const TODAY = todayStr();

        const calcDay = (dateStr) => {
          const completedOrders = orders.filter(
            o => o.status === 'completed' && String(o.order_date || '').slice(0, 10) === dateStr
          );
          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });
          const dayTrans = expenses.filter(
            e => String(e.expense_date || '').slice(0, 10) === dateStr
          );
          const opex = dayTrans.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const bankSales = dayTrans.filter(e => e.type === 'income' && e.category === 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
const otherIncome = dayTrans.filter(e => e.type === 'income' && e.category !== 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
revenue += bankSales;
          const netProfit = revenue - cogs - opex + otherIncome;
          return { revenue, cogs, opex, otherIncome, netProfit, profit: netProfit, completedCount: completedOrders.length };
        };

        const calcPeriod = (monthKey) => {
          const completedOrders = orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === monthKey);
          const pendingOrders = orders.filter(o => o.status === 'pending' && getMonthKey(o.order_date) === monthKey);

          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });

          const monthExp = expenses.filter(e => getMonthKey(e.expense_date) === monthKey);
          const opex = monthExp.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const materialCost = monthExp.filter(e => e.type === 'expense' && (e.category.includes('Nguyên liệu') || e.category.includes('điện'))).reduce((s, e) => s + e.amount, 0);
          const shippingCost = monthExp.filter(e => e.type === 'expense' && (e.category.includes('giao') || e.category.includes('chuyển'))).reduce((s, e) => s + e.amount, 0);
          const bankSales = monthExp.filter(e => e.type === 'income' && e.category === 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
const otherIncome = monthExp.filter(e => e.type === 'income' && e.category !== 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
revenue += bankSales;
          const inventoryCashOut = monthExp.filter(e => e.type === 'inventory_purchase').reduce((s, e) => s + e.amount, 0);

          const grossProfit = revenue - cogs;
          const netProfit = grossProfit - opex + otherIncome;
          const cashFlow = revenue + otherIncome - opex - inventoryCashOut;

          return {
            monthKey, revenue, cogs, grossProfit, opex, materialCost, shippingCost,
            otherIncome, inventoryCashOut, netProfit, cashFlow,
            completedCount: completedOrders.length, pendingCount: pendingOrders.length
          };
        };

        const todayStats = calcDay(TODAY);
        const thisM = calcPeriod(THIS_MONTH);
        const lastM = calcPeriod(LAST_MONTH);

        const productInsights = products.map(p => {
          const profitPer100 = p.selling_price > 0 ? Math.round(((p.selling_price - p.cost_price) / p.selling_price) * 100) : 0;
          const unitProfit = p.selling_price - p.cost_price;
          return {
            ...p,
            profitPer100,
            unitProfit,
            isLowStock: p.stock <= p.low_stock_threshold,
            isLowMargin: profitPer100 < 20,
            isSellingAtLoss: p.selling_price < p.cost_price
          };
        });

        const lowStockProducts = productInsights
          .filter(p => p.isLowStock)
          .sort((a, b) => a.stock - b.stock);

        return {
          todayStats,
          thisM,
          lastM,
          productInsights,
          lowStockProducts,
          lowMarginProducts: productInsights.filter(p => p.isLowMargin)
        };
      }, [products, orders, expenses]);

      const handleAddProduct = async (p) => {
        const { error } = await sb.from('products').insert(p);
        if (error) {
          console.error('Lỗi thêm hàng:', error);
          alert('Chưa lưu được món hàng, bạn thử lại nhé.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã lưu "${p.name}" vào hàng hóa`);
        return true;
      };

      const handleUpdateProduct = async ({ id, ...rest }) => {
        const { error } = await sb.from('products').update(rest).eq('id', id);
        if (error) {
          console.error('Lỗi sửa hàng:', error);
          alert('Chưa sửa được món hàng, bạn thử lại nhé.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã cập nhật "${rest.name}"`);
        return true;
      };

      const handleDeleteProduct = async (p) => {
        const { error } = await sb.from('products').delete().eq('id', p.id);
        if (error) {
          console.error('Lỗi xóa hàng:', error);
          alert('Chưa xóa được món này, bạn thử lại nhé.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã xóa "${p.name}"`);
        return true;
      };

      const handleCreateOrder = async ({ customer_name, order_date, status, selectedItems, totalAmount }) => {
        const { data: orderId, error } = await sb.rpc('create_order', {
          p_customer: customer_name,
          p_date: order_date,
          p_status: status,
          p_items: selectedItems.map(i => ({ product_id: i.product_id, quantity: Number(i.quantity) }))
        });
        if (error) {
          console.error('Lỗi tạo đơn hàng:', error);
          if (error.message && (error.message.includes('chỉ còn') || error.message.includes('không đủ'))) {
            alert(error.message);
          } else {
            alert('Chưa lưu được đơn hàng, bạn thử lại nhé.');
          }
          return false;
        }
        await onReload();
        showSaveToast(
          `Đã lưu đơn ${formatTien(totalAmount)}`,
          orderId ? async () => {
            const { error: undoErr } = await sb.rpc('set_order_status', { p_order_id: orderId, p_status: 'cancelled' });
            if (undoErr) {
              console.error('Lỗi hoàn tác đơn:', undoErr);
              alert('Chưa hoàn tác được đơn vừa ghi, bạn thử lại nhé.');
              return;
            }
            await onReload();
            showSaveToast('Đã hoàn tác đơn hàng vừa ghi');
          } : null
        );
        return true;
      };

      const handleChangeOrderStatus = async (orderId, newStatus) => {
        const { error } = await sb.rpc('set_order_status', { p_order_id: orderId, p_status: newStatus });
        if (error) {
          console.error('Lỗi đổi trạng thái đơn:', error);
          if (error.message && error.message.includes('không đủ')) {
            alert('Trong kho hiện không đủ hàng để chuyển sang Đã bán.');
          } else {
            alert('Chưa đổi được trạng thái đơn, bạn thử lại nhé.');
          }
          return false;
        }
        await onReload();
        showSaveToast(`Đã chuyển đơn sang "${ORDER_STATUS_LABEL[newStatus]}"`);
        return true;
      };

      const handleAddExpense = async (e) => {
        const { data: inserted, error } = await sb
          .from('transactions')
          .insert({
            type: e.type,
            category: e.category,
            amount: e.amount,
            transaction_date: e.expense_date,
            note: e.note
          })
          .select('id')
          .single();

        if (error) {
          console.error('Lỗi lưu thu chi:', error);
          alert('Chưa lưu được khoản vừa ghi, bạn thử lại nhé.');
          return false;
        }
        await onReload();
        showSaveToast(
          `Đã lưu ${e.category}: ${formatTien(e.amount)}`,
          inserted?.id ? async () => {
            const { error: undoErr } = await sb.from('transactions').delete().eq('id', inserted.id);
            if (undoErr) {
              console.error('Lỗi hoàn tác thu chi:', undoErr);
              alert('Chưa hoàn tác được khoản vừa ghi, bạn thử lại nhé.');
              return;
            }
            await onReload();
            showSaveToast('Đã hoàn tác khoản vừa ghi');
          } : null
        );
        return true;
      };

      const handleDeleteExpense = async (id) => {
        const { error } = await sb.from('transactions').delete().eq('id', id);
        if (error) {
          console.error('Lỗi xóa thu chi:', error);
          alert('Chưa xóa được dòng này, bạn thử lại nhé.');
          return false;
        }
        await onReload();
        showSaveToast('Đã xóa khoản thu chi');
        return true;
      };

      const navItems = [
        { id: 'dashboard', label: 'Trang chủ', icon: '🏠' },
        { id: 'orders', label: 'Bán hàng', icon: '🧾', badge: analytics.thisM.pendingCount },
        { id: 'products', label: 'Hàng hóa', icon: '📦', badge: analytics.lowStockProducts.length, badgeColor: 'bg-rose-700' },
        { id: 'finance', label: 'Thu chi', icon: '💳' },
        { id: 'bank', label: 'Ngân hàng', icon: '🏦', badge: pendingBankCount, badgeColor: 'bg-rose-700' },
        ...(hasAI ? [{ id: 'ai', label: 'Hỏi AI', icon: '🤖', highlight: true }] : []),
      ];

      const openSpendQuick = () => {
        setFinancePresetMode('expense_other');
        setActiveTab('finance');
      };

      return (
        <div className="h-[100dvh] w-full overflow-hidden flex flex-col md:flex-row">
          {/* THANH TRÊN CÙNG CHO ĐIỆN THOẠI (KHÓA CỐ ĐỊNH 1 KHUNG) */}
          <div className="md:hidden shrink-0 z-30 bg-white/95 backdrop-blur-md border-b border-blue-100 px-3 py-1.5 flex items-center justify-between gap-2">
            <div className="min-w-0 flex items-center gap-1.5">
              <BizFlowLogo size="sm" />
              <span className="text-xs font-bold text-blue-800 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded-lg truncate max-w-[115px]">
                {user.shop_name}
              </span>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <ThemeToggleButton theme={theme} onToggle={onToggleTheme} compact={true} />
              {user.is_demo && (
                <button
                  onClick={() => setConfirmResetOpen(true)}
                  disabled={busy}
                  title="Làm mới dữ liệu mẫu"
                  className="min-h-[38px] px-2.5 rounded-xl bg-blue-50 border-2 border-blue-200 text-blue-800 text-xs font-bold disabled:opacity-50"
                >
                  🔄
                </button>
              )}
              <button
                onClick={onLogout}
                className="min-h-[38px] px-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-900 text-xs font-bold"
              >
                Thoát
              </button>
            </div>
          </div>

          {/* THANH ĐIỀU HƯỚNG TRÁI TRÊN MÁY TÍNH (LUÔN NẰM TRONG 1 KHUNG) */}
          <aside className="hidden md:flex md:w-60 lg:w-64 h-full bg-white border-r border-blue-100 flex-col shrink-0 shadow-sm overflow-hidden">
            <div className="p-3.5 border-b border-blue-100 bg-gradient-to-br from-white to-blue-50/60 shrink-0">
              <BizFlowLogo size="md" />
              <div className="mt-2.5 p-2.5 rounded-xl bg-blue-50 border border-blue-200">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-xs font-bold text-blue-800">Cửa hàng</span>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full shrink-0 ${
                    user.is_demo
                      ? 'bg-sky-100 text-sky-800'
                      : hasAI
                      ? 'bg-blue-700 text-white'
                      : 'bg-slate-200 text-slate-800'
                  }`}>
                    {user.is_demo ? 'Bản mẫu' : hasAI ? 'Gói AI' : 'Miễn phí'}
                  </span>
                </div>
                <div className="text-sm font-extrabold text-slate-900 truncate mt-1">🏪 {user.shop_name}</div>
              </div>
            </div>

            <nav className="flex-1 min-h-0 p-2.5 space-y-1.5 overflow-hidden flex flex-col justify-start">
              {navItems.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full min-h-[44px] flex items-center justify-between px-3.5 py-2 rounded-xl text-sm lg:text-base font-bold transition shrink-0 ${
                      isActive
                        ? 'bg-blue-700 text-white shadow-sm'
                        : item.highlight
                        ? 'text-blue-800 bg-blue-50 border border-blue-200 hover:bg-blue-100'
                        : 'text-slate-800 hover:bg-blue-50'
                    }`}
                  >
                    <span className="flex items-center gap-2.5 min-w-0">
                      <span className="text-lg">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </span>
                    {item.badge > 0 && (
                      <span className={`px-2 py-0.5 text-xs font-extrabold rounded-full text-white shrink-0 ${isActive ? 'bg-white/25' : (item.badgeColor || 'bg-amber-600')}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            <div className="p-2.5 m-2.5 rounded-xl bg-blue-50/70 border border-blue-200 space-y-2 shrink-0">
              {user.is_demo && (
                <button
                  onClick={() => setConfirmResetOpen(true)}
                  disabled={busy}
                  className="w-full min-h-[40px] rounded-xl bg-white border border-blue-200 text-blue-800 text-xs sm:text-sm font-bold hover:bg-blue-50 disabled:opacity-50"
                >
                  🔄 Làm mới dữ liệu mẫu
                </button>
              )}
              <button
                onClick={onLogout}
                className="w-full min-h-[40px] rounded-xl bg-slate-100 border border-slate-300 hover:bg-rose-50 text-slate-900 hover:text-rose-700 text-xs sm:text-sm font-bold transition"
              >
                Đăng xuất
              </button>
            </div>
          </aside>

          {/* NỘI DUNG CHÍNH (CUỘN BÊN TRONG, KHÔNG LÀM TRÔI KHUNG MENU) */}
          <main className="flex-1 min-w-0 min-h-0 flex flex-col bg-business-grid overflow-hidden">
            <header className="hidden md:flex bg-white/95 backdrop-blur-md border-b border-blue-100 px-5 py-2.5 items-center justify-between gap-3 shrink-0">
              <div className="min-w-0">
                <h1 className="text-xl font-extrabold text-slate-900 truncate">
                  {navItems.find(n => n.id === activeTab)?.icon} {navItems.find(n => n.id === activeTab)?.label}
                </h1>
              </div>

              <ThemeToggleButton theme={theme} onToggle={onToggleTheme} />
            </header>

            <div className="flex-1 min-h-0 w-full max-w-5xl mx-auto p-3 sm:p-5 flex flex-col overflow-hidden">
              {activeTab === 'dashboard' && (
                <DashboardView
                  analytics={analytics}
                  setActiveTab={setActiveTab}
                  onOpenSpend={openSpendQuick}
                  productsCount={products.length}
                  ordersCount={orders.length}
                  user={user}
                  hasAI={hasAI}
                />
              )}
              {activeTab === 'orders' && (
                <OrdersView
                  orders={orders}
                  products={products}
                  onCreateOrder={handleCreateOrder}
                  onChangeStatus={handleChangeOrderStatus}
                  goToProducts={() => setActiveTab('products')}
                />
              )}
              {activeTab === 'products' && (
                <ProductsView
                  products={analytics.productInsights}
                  onAddProduct={handleAddProduct}
                  onUpdateProduct={handleUpdateProduct}
                  onDeleteProduct={handleDeleteProduct}
                />
              )}
              {activeTab === 'finance' && (
                <FinanceView
                  expenses={expenses}
                  analytics={analytics}
                  presetMode={financePresetMode}
                  onAddExpense={handleAddExpense}
                  onDeleteExpense={handleDeleteExpense}
                />
              )}
                            {activeTab === 'bank' && (
                <BankInboxView
                  bankTx={bankTx}
                  orders={orders}
                  onClassify={handleClassifyBank}
                  onUnclassify={handleUnclassifyBank}
                />
              )}
              {hasAI && activeTab === 'ai' && (
                <AIIntelligenceView analytics={analytics} />
              )}
            </div>
          </main>
          {bankAlert && (
            <button
              type="button"
              onClick={() => { setActiveTab('bank'); setBankAlert(null); }}
              className={`fixed top-2 left-3 right-3 md:left-auto md:right-5 md:max-w-sm z-50 text-left rounded-2xl p-3 shadow-2xl border-2 text-white ${
                bankAlert.direction === 'in' ? 'bg-emerald-700 border-emerald-300' : 'bg-rose-700 border-rose-300'
              }`}
            >
              <div className="text-sm font-extrabold">
                {bankAlert.direction === 'in' ? '💰 Tiền vừa về' : '💸 Tiền vừa ra'}: {formatTien(bankAlert.amount)}
              </div>
              <div className="text-xs font-bold opacity-90">Chạm để phân loại →</div>
            </button>
          )}
          {/* THÔNG BÁO ĐÃ LƯU + NÚT HOÀN TÁC 10 GIÂY */}
          {toast && (
            <div className="fixed left-3 right-3 bottom-[68px] md:bottom-5 md:left-auto md:right-5 md:max-w-sm z-50">
              <div className="bg-slate-900 text-white border-2 border-emerald-400 rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-2.5">
                <div className="min-w-0">
                  <div className="text-sm font-extrabold text-emerald-300">✅ Đã lưu</div>
                  <div className="text-xs sm:text-sm text-white truncate">{toast.message}</div>
                </div>
                {toast.undoAction && (
                  <button
                    type="button"
                    onClick={async () => {
                      const fn = toast.undoAction;
                      setToast(null);
                      await fn();
                    }}
                    className="min-h-[38px] px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 text-xs sm:text-sm font-extrabold shrink-0 hover:bg-amber-300"
                  >
                    Hoàn tác ({toast.secondsLeft}s)
                  </button>
                )}
              </div>
            </div>
          )}

          {/* THANH ĐIỀU HƯỚNG DƯỚI TRÊN ĐIỆN THOẠI (KHÓA CỨNG 1 KHUNG) */}
          <nav
  style={{ gridTemplateColumns: `repeat(${navItems.length}, minmax(0, 1fr))` }}
  className="md:hidden shrink-0 z-40 bg-white/95 backdrop-blur-md border-t-2 border-blue-100 shadow-[0_-4px_16px_rgba(15,23,42,0.06)] grid px-1 pt-1 pb-[max(0.25rem,env(safe-area-inset-bottom))]"
>
            {navItems.map(item => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`relative min-h-[50px] flex flex-col items-center justify-center py-1 rounded-xl transition ${
                    isActive ? 'text-blue-700 bg-blue-50 font-extrabold' : 'text-slate-700 font-semibold'
                  }`}
                >
                  <span className="text-lg leading-none">{item.icon}</span>
                  <span className="text-[11px] mt-0.5 leading-tight whitespace-nowrap truncate max-w-full px-0.5">
                    {item.label}
                  </span>
                  {item.badge > 0 && (
                    <span className={`absolute top-0.5 right-1.5 min-w-[16px] h-4 px-1 flex items-center justify-center text-[10px] font-extrabold rounded-full text-white ${item.badgeColor || 'bg-amber-600'}`}>
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          <ConfirmModal
            open={confirmResetOpen}
            title="Làm mới dữ liệu mẫu?"
            message="Mọi đơn hàng và số liệu bạn vừa bấm thử sẽ quay lại như lúc ban đầu."
            confirmLabel="Làm mới ngay"
            cancelLabel="Giữ nguyên"
            onConfirm={async () => {
              setConfirmResetOpen(false);
              await onResetSampleData();
            }}
            onCancel={() => setConfirmResetOpen(false)}
          />
        </div>
      );
    }

    // ==========================================
    // 1. TRANG CHỦ (FIT GỌN TRONG 1 MÀN HÌNH)
    // ==========================================
    function DashboardView({ analytics, setActiveTab, onOpenSpend, productsCount, ordersCount, user, hasAI }) {
      const { todayStats, thisM, lastM, lowStockProducts } = analytics;
      const [showReport, setShowReport] = useState(false);

      if (productsCount === 0 && ordersCount === 0) {
        return (
          <div className="h-full flex items-center justify-center">
            <div className="bg-white border-2 border-blue-200 rounded-2xl p-5 sm:p-6 shadow-sm max-w-md w-full text-center space-y-4">
              <div className="text-4xl">🏪</div>
              <h2 className="text-xl font-extrabold text-slate-900">Chào {user.shop_name}!</h2>
              <p className="text-sm sm:text-base text-slate-700 leading-relaxed">
                Sổ của bạn hiện chưa có mặt hàng nào. Thêm vài món hay bán rồi bấm <strong>Bán hàng</strong> là dùng được ngay.
              </p>
              <button
                onClick={() => setActiveTab('products')}
                className="w-full min-h-[46px] px-5 py-2.5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-base font-extrabold shadow-md"
              >
                ➕ Thêm món hàng đầu tiên
              </button>
            </div>
          </div>
        );
      }

      const todayNetProfit = todayStats.netProfit;
      const isTodayProfit = todayNetProfit >= 0;
      const topAlerts = lowStockProducts.slice(0, 3);

      return (
        <div className="h-full overflow-y-auto scrollbar-thin space-y-3 sm:space-y-4 pr-0.5">
          {/* CON SỐ CHÍNH: HÔM NAY LÃI */}
          <section className={`rounded-2xl p-4 sm:p-5 border-2 shadow-sm bg-white ${
            isTodayProfit ? 'border-emerald-300' : 'border-rose-300'
          }`}>
            <div className="text-sm sm:text-base font-bold text-slate-700">Hôm nay lãi</div>
            <div className={`text-3xl sm:text-4xl font-extrabold tracking-tight mt-1 leading-tight ${
              isTodayProfit ? 'text-emerald-700' : 'text-rose-700'
            }`}>
              {formatTien(todayNetProfit)}
            </div>
            <div className="mt-3 pt-2.5 border-t border-slate-200 grid grid-cols-2 gap-2 text-xs sm:text-base text-slate-800">
              <div>Hôm nay bán: <strong className="block sm:inline">{formatTien(todayStats.revenue)}</strong></div>
              <div>Tháng này lãi: <strong className={`block sm:inline ${thisM.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{formatTien(thisM.netProfit)}</strong></div>
            </div>
          </section>

          {/* 3 NÚT HÀNH ĐỘNG NHANH GỌN ĐẸP */}
          <section className={`grid ${hasAI ? 'grid-cols-3' : 'grid-cols-2'} gap-2.5 sm:gap-3`}>
            <button
              onClick={() => setActiveTab('orders')}
              className="min-h-[60px] sm:min-h-[64px] p-2.5 sm:p-4 rounded-2xl bg-blue-700 hover:bg-blue-800 text-white shadow-sm flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2.5 text-xs sm:text-base font-extrabold transition"
            >
              <span className="text-xl">🧾</span>
              <span>Bán hàng</span>
            </button>

            <button
              onClick={onOpenSpend}
              className="min-h-[60px] sm:min-h-[64px] p-2.5 sm:p-4 rounded-2xl bg-white hover:bg-blue-50 text-slate-900 border-2 border-blue-300 shadow-sm flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2.5 text-xs sm:text-base font-extrabold transition"
            >
              <span className="text-xl">💸</span>
              <span>Chi tiền</span>
            </button>

            {hasAI && (
              <button
                onClick={() => setActiveTab('ai')}
                className="min-h-[60px] sm:min-h-[64px] p-2.5 sm:p-4 rounded-2xl bg-blue-50 hover:bg-blue-100 text-blue-900 border-2 border-blue-300 shadow-sm flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2.5 text-xs sm:text-base font-extrabold transition"
              >
                <span className="text-xl">🤖</span>
                <span>Hỏi AI</span>
              </button>
            )}
          </section>

          {/* KHỐI VIỆC CẦN CHÚ Ý */}
          <section className="bg-white rounded-2xl p-3.5 sm:p-4 border-2 border-blue-100 shadow-sm space-y-2">
            <div className="flex items-center justify-between gap-2">
              <h2 className="text-base sm:text-lg font-extrabold text-slate-900">🔔 Việc cần chú ý</h2>
              {lowStockProducts.length > 3 && (
                <button
                  onClick={() => setActiveTab('products')}
                  className="text-xs sm:text-sm font-bold text-blue-700 underline"
                >
                  Xem hết ({lowStockProducts.length})
                </button>
              )}
            </div>

            {topAlerts.length === 0 ? (
              <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-sm font-bold text-emerald-800">
                ✅ Hàng trong kho hiện đang đủ bán.
              </div>
            ) : (
              <div className="space-y-1.5">
                {topAlerts.map(p => (
                  <div
                    key={p.id}
                    className="px-3 py-2 rounded-xl bg-rose-50 border border-rose-200 flex items-center justify-between gap-2 text-sm sm:text-base"
                  >
                    <span className="font-bold text-rose-900 truncate">{p.name}</span>
                    <span className="font-extrabold text-rose-700 shrink-0">Còn {p.stock}</span>
                  </div>
                ))}
              </div>
            )}
          </section>

          {/* MỤC XEM BÁO CÁO THU GỌN */}
          <section className="bg-white rounded-2xl border-2 border-blue-100 shadow-sm overflow-hidden">
            <button
              type="button"
              onClick={() => setShowReport(!showReport)}
              className="w-full min-h-[44px] px-4 py-2.5 flex items-center justify-between gap-2 text-left text-sm sm:text-base font-extrabold text-blue-800 hover:bg-blue-50"
            >
              <span>📊 Xem báo cáo tháng này & tháng trước</span>
              <span>{showReport ? '▲' : '▼'}</span>
            </button>

            {showReport && (
              <div className="p-3.5 pt-2 border-t border-blue-100 grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm sm:text-base">
                <div className="p-3 rounded-xl bg-blue-50 border border-blue-200 space-y-1.5">
                  <div className="font-extrabold text-blue-900">Tháng này ({thisM.monthKey})</div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Tiền bán được:</span>
                    <strong>{formatTien(thisM.revenue)}</strong>
                  </div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Giá vốn hàng bán:</span>
                    <strong>{formatTien(thisM.cogs)}</strong>
                  </div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Chi phí cửa hàng:</span>
                    <strong>{formatTien(thisM.opex)}</strong>
                  </div>
                  <div className="pt-1.5 border-t border-blue-200 font-extrabold flex justify-between gap-2">
                    <span>Tiền lãi:</span>
                    <span className={thisM.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-700'}>{formatTien(thisM.netProfit)}</span>
                  </div>
                </div>

                <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
                  <div className="font-extrabold text-slate-900">Tháng trước ({lastM.monthKey})</div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Tiền bán được:</span>
                    <strong>{formatTien(lastM.revenue)}</strong>
                  </div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Giá vốn hàng bán:</span>
                    <strong>{formatTien(lastM.cogs)}</strong>
                  </div>
                  <div className="text-slate-800 flex justify-between gap-2">
                    <span>Chi phí cửa hàng:</span>
                    <strong>{formatTien(lastM.opex)}</strong>
                  </div>
                  <div className="pt-1.5 border-t border-slate-200 font-extrabold flex justify-between gap-2">
                    <span>Tiền lãi:</span>
                    <span className={lastM.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-700'}>{formatTien(lastM.netProfit)}</span>
                  </div>
                </div>
              </div>
            )}
          </section>
        </div>
      );
    }

    // ==========================================
    // 2. TRANG BÁN HÀNG (DANH SÁCH CUỘN GIỮA, GIỎ GHIM ĐÁY)
    // ==========================================
    function OrdersView({ orders, products, onCreateOrder, onChangeStatus, goToProducts }) {
      const [subTab, setSubTab] = useState('sell');
      const [search, setSearch] = useState('');
      const [cart, setCart] = useState([]);
      const [showOptions, setShowOptions] = useState(false);
      const [customerName, setCustomerName] = useState('');
      const [orderDate, setOrderDate] = useState(todayStr());
      const [status, setStatus] = useState('completed');
      const [saving, setSaving] = useState(false);
      const [friendlyWarn, setFriendlyWarn] = useState('');

      const filteredProducts = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return products;
        return products.filter(p => p.name.toLowerCase().includes(q));
      }, [products, search]);

      const totalAmount = useMemo(() => {
        return cart.reduce((sum, item) => {
          const prod = products.find(p => p.id === item.product_id);
          return sum + (prod ? prod.selling_price * item.quantity : 0);
        }, 0);
      }, [cart, products]);

      const totalQty = useMemo(() => cart.reduce((s, i) => s + i.quantity, 0), [cart]);

      const addOne = (prod) => {
        setFriendlyWarn('');
        const currentQty = cart.find(c => c.product_id === prod.id)?.quantity || 0;
        if (status === 'completed' && currentQty + 1 > prod.stock) {
          setFriendlyWarn(`Món "${prod.name}" chỉ còn ${prod.stock} trong kho, bạn không thể bán thêm được nữa nhé!`);
          return;
        }
        if (currentQty > 0) {
          setCart(cart.map(c => c.product_id === prod.id ? { ...c, quantity: c.quantity + 1 } : c));
        } else {
          setCart([...cart, { product_id: prod.id, quantity: 1 }]);
        }
      };

      const changeCartQty = (productId, delta) => {
        setFriendlyWarn('');
        const prod = products.find(p => p.id === productId);
        const existing = cart.find(c => c.product_id === productId);
        if (!existing) return;
        const nextQty = existing.quantity + delta;
        if (nextQty <= 0) {
          setCart(cart.filter(c => c.product_id !== productId));
          return;
        }
        if (delta > 0 && status === 'completed' && prod && nextQty > prod.stock) {
          setFriendlyWarn(`Món "${prod.name}" chỉ còn ${prod.stock} trong kho thôi bạn nhé!`);
          return;
        }
        setCart(cart.map(c => c.product_id === productId ? { ...c, quantity: nextQty } : c));
      };

      const submitOrder = async () => {
        if (saving || cart.length === 0) return;
        setFriendlyWarn('');

        if (status === 'completed') {
          for (const c of cart) {
            const prod = products.find(p => p.id === c.product_id);
            if (prod && c.quantity > prod.stock) {
              setFriendlyWarn(`Món "${prod.name}" chỉ còn ${prod.stock} trong kho, bạn giảm bớt xuống nhé!`);
              return;
            }
          }
        }

        setSaving(true);
        try {
          const ok = await onCreateOrder({
            customer_name: customerName,
            order_date: orderDate,
            status,
            selectedItems: cart,
            totalAmount
          });
          if (ok) {
            setCart([]);
            setCustomerName('');
            setOrderDate(todayStr());
            setStatus('completed');
            setShowOptions(false);
          }
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-2.5">
          {/* CHỌN VIỆC: BÁN HÀNG HAY XEM ĐƠN ĐÃ BÁN */}
          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-blue-100 shrink-0">
            <button
              type="button"
              onClick={() => setSubTab('sell')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${
                subTab === 'sell' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              🛒 Tính tiền bán
            </button>
            <button
              type="button"
              onClick={() => setSubTab('list')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${
                subTab === 'list' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              📋 Đơn đã ghi ({orders.length})
            </button>
          </div>

          {subTab === 'sell' && (
            <>
              {products.length === 0 ? (
                <div className="bg-white rounded-2xl p-5 border-2 border-blue-100 text-center space-y-3">
                  <div className="text-sm sm:text-base text-slate-700">Bạn chưa có món hàng nào để bán. Hãy thêm món hàng trước nhé!</div>
                  <button
                    onClick={goToProducts}
                    className="min-h-[44px] px-5 py-2 bg-blue-700 text-white rounded-xl text-sm sm:text-base font-extrabold"
                  >
                    ➕ Đi tới Hàng hóa
                  </button>
                </div>
              ) : (
                <>
                  {products.length > 6 && (
                    <input
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="🔍 Gõ tên món để tìm nhanh..."
                      className="w-full min-h-[42px] px-3.5 py-2 bg-white border-2 border-slate-300 rounded-xl text-base focus:outline-none focus:border-blue-700 shrink-0"
                    />
                  )}

                  {friendlyWarn && (
                    <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs sm:text-sm font-bold shrink-0">
                      ⚠️ {friendlyWarn}
                    </div>
                  )}

                  {/* KHU VỰC CUỘN CHỌN MÓN */}
                  <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-2.5 pr-0.5 pt-1">
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5">
                      {filteredProducts.map(p => {
                        const inCartQty = cart.find(c => c.product_id === p.id)?.quantity || 0;
                        const outOfStock = status === 'completed' && p.stock <= 0;
                        return (
                          <button
                            key={p.id}
                            type="button"
                            onClick={() => addOne(p)}
                            className={`relative min-h-[82px] p-3 rounded-2xl border-2 text-left flex flex-col justify-between transition shadow-sm ${
                              outOfStock
                                ? 'bg-slate-100 border-slate-300 opacity-75'
                                : inCartQty > 0
                                ? 'bg-blue-50 border-blue-700 shadow-md'
                                : 'bg-white border-blue-200 hover:border-blue-600'
                            }`}
                          >
                            {inCartQty > 0 && (
                              <span className="absolute -top-2 -right-2 min-w-[24px] h-6 px-1.5 rounded-full bg-blue-700 text-white text-xs font-extrabold flex items-center justify-center shadow">
                                {inCartQty}
                              </span>
                            )}
                            <div className="text-sm sm:text-base font-extrabold text-slate-900 leading-tight line-clamp-2 pr-2">
                              {p.name}
                            </div>
                            <div className="mt-1.5 flex items-end justify-between gap-1.5">
                              <span className="text-sm sm:text-base font-extrabold text-blue-700">{formatTien(p.selling_price)}</span>
                              <span className={`text-xs font-bold ${p.stock <= p.low_stock_threshold ? 'text-rose-700' : 'text-slate-600'}`}>
                                Còn {p.stock}
                              </span>
                            </div>
                          </button>
                        );
                      })}
                    </div>

                    {/* TÙY CHỌN THU GỌN */}
                    <div className="bg-white rounded-xl border border-blue-100 overflow-hidden">
                      <button
                        type="button"
                        onClick={() => setShowOptions(!showOptions)}
                        className="w-full min-h-[40px] px-3.5 py-2 flex items-center justify-between text-xs sm:text-sm font-bold text-blue-800"
                      >
                        <span>⚙️ Tùy chọn (Tên khách, ngày bán, chờ giao)</span>
                        <span>{showOptions ? '▲' : '▼'}</span>
                      </button>
                      {showOptions && (
                        <div className="p-3 pt-1.5 border-t border-blue-100 space-y-2.5">
                          <div>
                            <label className="block text-xs font-bold text-slate-800 mb-1">Tên khách mua (không bắt buộc)</label>
                            <input
                              value={customerName}
                              onChange={e => setCustomerName(e.target.value)}
                              placeholder="Mặc định: Khách lẻ"
                              className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base"
                            />
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div>
                              <label className="block text-xs font-bold text-slate-800 mb-1">Ngày bán</label>
                              <input
                                type="date"
                                value={orderDate}
                                onChange={e => setOrderDate(e.target.value)}
                                className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-800 mb-1">Trạng thái đơn</label>
                              <select
                                value={status}
                                onChange={e => setStatus(e.target.value)}
                                className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-sm font-bold"
                              >
                                <option value="completed">Đã bán (Thu tiền ngay)</option>
                                <option value="pending">Chờ giao (Chưa thu tiền)</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* GIỎ HÀNG GHIM CỐ ĐỊNH Ở ĐÁY KHUNG */}
                  <div className="shrink-0 bg-white border-2 border-blue-700 rounded-2xl p-2.5 sm:p-3 shadow-lg space-y-2">
                    {cart.length === 0 ? (
                      <div className="text-center text-xs sm:text-sm font-bold text-slate-600 py-1">
                        👆 Chạm vào món ở trên để thêm vào đơn
                      </div>
                    ) : (
                      <>
                        <div className="max-h-24 overflow-y-auto scrollbar-thin space-y-1.5 pr-1">
                          {cart.map(item => {
                            const prod = products.find(p => p.id === item.product_id);
                            if (!prod) return null;
                            return (
                              <div key={item.product_id} className="flex items-center justify-between gap-2 bg-blue-50/80 px-2.5 py-1.5 rounded-xl">
                                <div className="min-w-0 flex-1">
                                  <div className="text-xs sm:text-sm font-extrabold text-slate-900 truncate">{prod.name}</div>
                                  <div className="text-xs font-bold text-blue-700">{formatTien(prod.selling_price * item.quantity)}</div>
                                </div>
                                <div className="flex items-center gap-1.5 shrink-0">
                                  <button
                                    type="button"
                                    onClick={() => changeCartQty(item.product_id, -1)}
                                    className="w-8 h-8 rounded-lg bg-white border border-slate-300 text-base font-extrabold text-slate-900 flex items-center justify-center"
                                  >
                                    −
                                  </button>
