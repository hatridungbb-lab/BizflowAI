<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BizFlow AI - Quản lý Bán hàng & Lợi nhuận cho Cửa hàng</title>
  <!-- Favicon SVG giúp không bị lỗi 404 favicon.ico khi bấm F12 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M18 46V18h14c7 0 11 4 11 9.5 0 3.6-2 6.2-5 7.2 4 1 6.5 4 6.5 8.3 0 6-4.8 9-12 9H18z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fbff;
      color: #0f172a;
    }
    button, a, select {
      touch-action: manipulation;
    }
    /* Ngăn iOS/Android tự động zoom-in khi người dùng chạm vào ô nhập trên điện thoại 9:16 */
    @media (max-width: 767px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    /* Họa tiết lưới chấm bi phong cách không gian doanh nghiệp hiện đại */
    .bg-business-grid {
      background-color: #f8fbff;
      background-image:
        radial-gradient(#cbd5e1 1px, transparent 1px),
        radial-gradient(circle at 85% 10%, rgba(37, 99, 235, 0.08), transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(14, 165, 233, 0.08), transparent 40%);
      background-size: 24px 24px, 100% 100%, 100% 100%;
    }
    .bg-business-hero {
      background-color: #ffffff;
      background-image:
        linear-gradient(to right, rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.14), transparent 50%),
        radial-gradient(circle at 15% 80%, rgba(14, 165, 233, 0.12), transparent 45%);
      background-size: 36px 36px, 36px 36px, 100% 100%, 100% 100%;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 3px; }
  </style>
</head>
<body class="bg-business-grid">
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== CẤU HÌNH SUPABASE =====
    const SUPABASE_URL = "https://xofriivockwiycdnnfvx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6ogosVTXKRpzbZwJcyZmw_yKzEwKYO";
    window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Đặt true nếu bạn đã deploy Edge Function "ai-advisor" kèm GEMINI_API_KEY
    // Mặc định false để không phát sinh lỗi mạng 404 khi bấm F12
    window.ENABLE_AI_EDGE_FUNCTION = true;
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // LOGO CHÍNH THỨC BIZFLOW AI (SVG SẮC NÉT)
    // ==========================================
    function BizFlowLogo({ size = 'md', showTagline = false }) {
  const uid = React.useId().replace(/:/g, '');
  const blueId = `bfBlue-${uid}`;
  const arrowId = `bfArrow-${uid}`;
  const iconSizes = { sm: 'w-8 h-8', md: 'w-9 h-9 sm:w-10 sm:h-10', lg: 'w-14 h-14' };
  const textSizes = { sm: 'text-base sm:text-lg', md: 'text-lg sm:text-xl', lg: 'text-2xl sm:text-3xl' };

  return (
    <div className="flex items-center gap-2.5 select-none min-w-0">
      <svg viewBox="0 0 120 110" className={`${iconSizes[size]} shrink-0 drop-shadow-sm`} fill="none">
        <defs>
          <linearGradient id={blueId} x1="15" y1="10" x2="105" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#0ea5e9" />
            <stop offset="50%" stopColor="#2563eb" />
            <stop offset="100%" stopColor="#4338ca" />
          </linearGradient>
          <linearGradient id={arrowId} x1="15" y1="85" x2="112" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#38bdf8" />
            <stop offset="100%" stopColor="#1d4ed8" />
          </linearGradient>
        </defs>
        {/* Khối chữ B cách điệu */}
        <path
          d="M28 14 H66 C85 14 96 24 96 38 C96 47 90 54 81 58 C93 61 100 71 100 83 C100 98 87 104 68 104 H22 L28 14 Z M47 31 L45 48 H64 C71 48 76 44 76 39 C76 34 71 31 64 31 H47 Z"
          fill={`url(#${blueId})`}
        />
        {/* Khoét sáng bên trong tạo đường cong tăng trưởng */}
        <path d="M16 86 C34 62 58 50 86 42 C60 56 38 72 22 96 Z" fill="#ffffff" />
        {/* 3 cột biểu đồ tăng trưởng */}
        <rect x="40" y="76" width="9" height="18" rx="2" fill="#ffffff" />
        <rect x="54" y="68" width="9" height="26" rx="2" fill="#ffffff" />
        <rect x="68" y="59" width="9" height="35" rx="2" fill="#ffffff" />
        {/* Mũi tên đi lên */}
        <path d="M56 54 C74 47 90 36 104 23" stroke={`url(#${arrowId})`} strokeWidth="7" strokeLinecap="round" />
        <path d="M92 20 L111 16 L107 35 Z" fill="#2563eb" />
      </svg>

      <div className="min-w-0">
        <div className={`font-extrabold tracking-tight leading-none truncate ${textSizes[size]}`}>
          <span className="text-slate-900">BizFlow</span>{' '}
          <span className="bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 bg-clip-text text-transparent">AI</span>
        </div>
        {showTagline && (
          <div className="text-[11px] font-medium text-slate-500 mt-0.5 tracking-wide hidden sm:block">
            Biến dữ liệu bán hàng thành quyết định thông minh
          </div>
        )}
      </div>
    </div>
  );
}

    // ==========================================
    // TIỆN ÍCH ĐỊNH DẠNG TIỀN & NGÀY THÁNG
    // ==========================================
    const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Math.round(num || 0));
    const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
    const getMonthKey = (dateStr) => (dateStr || '').slice(0, 7);

    const currentDate = new Date();
    const THIS_MONTH = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const prevDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    const LAST_MONTH = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

    const ORDER_STATUS_LABEL = {
      completed: 'Đã hoàn thành',
      pending: 'Chờ xử lý',
      cancelled: 'Đã hủy'
    };

    // ==========================================
    // ỨNG DỤNG CHÍNH (ĐĂNG NHẬP & QUẢN LÝ)
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState(false);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [expenses, setExpenses] = useState([]);

      // Đọc hồ sơ cửa hàng an toàn (dùng maybeSingle để không lỗi 406)
      const loadProfile = async (authUser) => {
        try {
          let { data: prof, error } = await sb
            .from('profiles')
            .select('*')
            .eq('id', authUser.id)
            .maybeSingle();

          if (!prof || error) {
            const shopName = authUser.user_metadata?.shop_name || 'Cửa hàng của tôi';
            const isDemo = Boolean(authUser.user_metadata?.is_demo || authUser.is_anonymous);
            const { data: ensured, error: ensureErr } = await sb.rpc('ensure_profile', {
              p_shop_name: shopName,
              p_is_demo: isDemo
            });
            if (ensureErr || !ensured) return null;
            prof = ensured;
          }

          return {
            id: authUser.id,
            email: authUser.email || 'Tài khoản dùng thử riêng',
            shop_name: prof.shop_name,
            is_demo: Boolean(prof.is_demo || authUser.is_anonymous)
          };
        } catch {
          return null;
        }
      };

      const loadData = async () => {
        const [p, o, t] = await Promise.all([
          sb.from('products').select('*').order('name'),
          sb.from('orders').select('*, order_items(*)').order('order_date', { ascending: false }).order('created_at', { ascending: false }),
          sb.from('transactions').select('*').order('transaction_date', { ascending: false }),
        ]);

        setProducts((p.data || []).map(x => ({
          ...x,
          selling_price: Number(x.selling_price),
          cost_price: Number(x.cost_price)
        })));
        setOrders((o.data || []).map(x => ({
          ...x,
          items: (x.order_items || []).map(i => ({
            ...i,
            quantity: Number(i.quantity),
            unit_price: Number(i.unit_price),
            unit_cost: Number(i.unit_cost)
          }))
        })));
        setExpenses((t.data || []).map(x => ({
          ...x,
          amount: Number(x.amount),
          expense_date: x.transaction_date
        })));
      };

      const finishLogin = async (authUser) => {
        const u = await loadProfile(authUser);
        setCurrentUser(u);
        if (u) await loadData();
        return u;
      };

      useEffect(() => {
        sb.auth.getSession().then(async ({ data }) => {
          if (data?.session?.user) await finishLogin(data.session.user);
          setLoading(false);
        }).catch(() => setLoading(false));

        const { data: sub } = sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') {
            setCurrentUser(null);
            setProducts([]);
            setOrders([]);
            setExpenses([]);
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      // Đăng ký tài khoản mới -> Bắt đầu với dữ liệu TRẮNG hoàn toàn (tự thêm sản phẩm & đơn hàng)
      const handleRegister = async ({ email, password, shop_name }) => {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { shop_name, is_demo: false } }
        });
        if (error) return { error: error.message };
        if (!data.session) return { error: 'Đã tạo tài khoản. Vui lòng kiểm tra email để xác nhận trước khi đăng nhập.' };
        await finishLogin(data.session.user);
        return { ok: true };
      };

      const handleLogin = async ({ email, password }) => {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return { error: 'Email hoặc mật khẩu chưa chính xác!' };
        await finishLogin(data.user);
        return { ok: true };
      };

      const handleLogout = async () => {
        await sb.auth.signOut();
      };

      // Chỉ dùng cho nút "Xem thử bản mẫu" (tạo phiên riêng biệt không trùng ai)
      const handleQuickDemo = async () => {
        if (busy) return;
        setBusy(true);
        try {
          let authData = null;
          const anonRes = await sb.auth.signInAnonymously({
            options: { data: { shop_name: 'Cửa hàng Trà & Cà Phê Mẫu', is_demo: true } }
          });

          if (!anonRes.error && anonRes.data?.session) {
            authData = anonRes.data;
          } else {
            const randId = Math.random().toString(36).slice(2, 9);
            const signUpRes = await sb.auth.signUp({
              email: `demo.${randId}@demo.bizflowai.vn`,
              password: `Demo#${randId}88`,
              options: { data: { shop_name: `Cửa hàng Mẫu #${randId.toUpperCase()}`, is_demo: true } }
            });
            if (signUpRes.error || !signUpRes.data?.session) {
              alert('Vui lòng bật "Anonymous Sign-Ins" trong Supabase Authentication để dùng chế độ xem thử nhanh.');
              return;
            }
            authData = signUpRes.data;
          }

          await finishLogin(authData.session.user);
          await sb.rpc('seed_sample_data', { p_reset: false });
          await loadData();
        } finally {
          setBusy(false);
        }
      };

      const handleResetSampleData = async () => {
        if (busy) return;
        setBusy(true);
        try {
          const { error } = await sb.rpc('seed_sample_data', { p_reset: true });
          if (error) alert('Không thể làm mới dữ liệu: ' + error.message);
          else await loadData();
        } finally {
          setBusy(false);
        }
      };

      if (loading) {
        return (
          <div className="min-h-[100dvh] flex flex-col items-center justify-center gap-3 bg-business-grid px-4">
            <BizFlowLogo size="md" />
            <div className="text-sm text-blue-700 font-medium">Đang tải dữ liệu cửa hàng...</div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <AuthPage
            onRegister={handleRegister}
            onLogin={handleLogin}
            onQuickDemo={handleQuickDemo}
            demoLoading={busy}
          />
        );
      }

      return (
        <WorkspaceApp
          user={currentUser}
          onLogout={handleLogout}
          products={products}
          orders={orders}
          expenses={expenses}
          busy={busy}
          onResetSampleData={handleResetSampleData}
          onReload={loadData}
        />
      );
    }

    // ==========================================
    // MÀN HÌNH ĐĂNG NHẬP & ĐĂNG KÝ (CỐ ĐỊNH VỪA KHÍT 100% & 110% ZOOM)
    // ==========================================
    function AuthPage({ onRegister, onLogin, onQuickDemo, demoLoading }) {
      const [mode, setMode] = useState('login');
      const [shopName, setShopName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const submitForm = async (e) => {
        e.preventDefault();
        setError('');
        setSubmitting(true);
        try {
          if (mode === 'register') {
            if (!shopName.trim()) return setError('Vui lòng nhập tên cửa hàng của bạn.');
            const res = await onRegister({ email, password, shop_name: shopName });
            if (res.error) setError(res.error);
          } else {
            const res = await onLogin({ email, password });
            if (res.error) setError(res.error);
          }
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="min-h-[100dvh] md:h-screen md:overflow-hidden bg-business-hero flex flex-col relative overflow-x-hidden">
          <div className="pointer-events-none absolute -top-24 -right-24 w-80 h-80 rounded-full bg-blue-100/70 blur-3xl"></div>
          <div className="pointer-events-none absolute -bottom-24 -left-24 w-80 h-80 rounded-full bg-sky-100/70 blur-3xl"></div>

          <header className="relative z-10 w-full border-b border-blue-100 bg-white/85 backdrop-blur-md shrink-0">
            <div className="max-w-6xl w-full mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
              <BizFlowLogo size="md" showTagline={true} />
              <button
                onClick={onQuickDemo}
                disabled={demoLoading}
                className="w-full sm:w-auto px-3.5 py-2 rounded-xl bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition shadow-sm disabled:opacity-50 text-center"
              >
                {demoLoading ? '⏳ Đang mở bản mẫu riêng...' : '👀 Xem thử với dữ liệu mẫu'}
              </button>
            </div>
          </header>

          <main className="relative z-10 flex-1 min-h-0 overflow-y-auto md:overflow-hidden flex items-center">
            <div className="max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-8 items-center">
              {/* FORM ĐĂNG NHẬP / ĐĂNG KÝ */}
              <div className="order-1 lg:order-2 lg:col-span-5 bg-white rounded-2xl p-5 sm:p-6 shadow-xl shadow-blue-900/5 border border-blue-100 min-w-0">
                <div className="flex bg-blue-50/70 p-1 rounded-xl mb-4">
                  <button
                    type="button"
                    onClick={() => { setMode('login'); setError(''); }}
                    className={`flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg transition ${mode === 'login' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                  >
                    Đăng nhập
                  </button>
                  <button
                    type="button"
                    onClick={() => { setMode('register'); setError(''); }}
                    className={`flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg transition ${mode === 'register' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                  >
                    Tạo cửa hàng mới
                  </button>
                </div>

                {error && (
                  <div className="mb-3 p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                    {error}
                  </div>
                )}

                <form onSubmit={submitForm} className="space-y-3 text-sm">
                  {mode === 'register' && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tên cửa hàng của bạn</label>
                      <input
                        required
                        value={shopName}
                        onChange={e => setShopName(e.target.value)}
                        placeholder="VD: Tiệm Trà Sữa Minh Anh"
                        className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Địa chỉ Email</label>
                    <input
                      required
                      type="email"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      placeholder="tenban@gmail.com"
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                    <input
                      required
                      minLength={6}
                      type="password"
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      placeholder="Ít nhất 6 ký tự"
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600"
                    />
                  </div>

                  {mode === 'register' && (
                    <div className="p-2.5 rounded-xl bg-blue-50/80 border border-blue-100 text-[11px] text-blue-800 leading-snug">
                      🔒 Dữ liệu cửa hàng của bạn được tách biệt hoàn toàn. Sau khi tạo tài khoản, bạn sẽ tự thêm sản phẩm và đơn hàng của riêng mình.
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={submitting}
                    className="w-full py-2.5 bg-gradient-to-r from-blue-600 to-sky-600 hover:from-blue-700 hover:to-sky-700 text-white font-bold rounded-xl shadow-md shadow-blue-200 transition disabled:opacity-50"
                  >
                    {submitting ? 'Đang xử lý...' : mode === 'register' ? 'Tạo cửa hàng & Bắt đầu →' : 'Đăng nhập vào cửa hàng'}
                  </button>
                </form>
              </div>

              {/* GIỚI THIỆU */}
              <div className="order-2 lg:order-1 lg:col-span-7 space-y-3.5 min-w-0">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold">
                  <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                  Sổ quản lý kinh doanh thông minh cho chủ cửa hàng
                </div>

                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight">
                  Nắm rõ <span className="text-blue-600">Tiền lãi thực tế</span> và <span className="text-sky-600">Hàng tồn kho</span> chỉ trong vài phút mỗi ngày.
                </h1>

                <p className="text-slate-600 text-xs sm:text-sm leading-relaxed">
                  Không cần biết kế toán phức tạp. BizFlow AI giúp bạn ghi đơn bán hàng, theo dõi hàng sắp hết, ghi chép thu chi hằng ngày và tự động giải thích lý do tăng giảm tiền lãi.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                  <div className="bg-white/90 p-3 rounded-2xl border border-blue-100 shadow-sm">
                    <div className="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-sm mb-1.5">🧾</div>
                    <div className="font-bold text-xs sm:text-sm text-slate-800">Ghi đơn nhanh</div>
                    <div className="text-[11px] text-slate-500 mt-0.5">Tự trừ tồn kho và nhớ sẵn giá nhập lúc bán.</div>
                  </div>
                  <div className="bg-white/90 p-3 rounded-2xl border border-blue-100 shadow-sm">
                    <div className="w-7 h-7 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-sm mb-1.5">💰</div>
                    <div className="font-bold text-xs sm:text-sm text-slate-800">Rõ tiền lời, tiền mặt</div>
                    <div className="text-[11px] text-slate-500 mt-0.5">Phân biệt rạch ròi tiền bán được và tiền còn trong túi.</div>
                  </div>
                  <div className="bg-white/90 p-3 rounded-2xl border border-blue-100 shadow-sm">
                    <div className="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm mb-1.5">🤖</div>
                    <div className="font-bold text-xs sm:text-sm text-slate-800">Hỏi đáp dễ hiểu</div>
                    <div className="text-[11px] text-slate-500 mt-0.5">Trợ lý AI giải thích bằng tiếng Việt đơn giản.</div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // KHÔNG GIAN LÀM VIỆC CHÍNH (CỐ ĐỊNH 1 MÀN HÌNH TRÊN MÁY TÍNH)
    // ==========================================
    function WorkspaceApp({
      user, onLogout, products, orders, expenses,
      busy, onResetSampleData, onReload
    }) {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [showHowItWorks, setShowHowItWorks] = useState(true);

      const analytics = useMemo(() => {
        const calcPeriod = (monthKey) => {
          const completedOrders = orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === monthKey);
          const pendingOrders = orders.filter(o => o.status === 'pending' && getMonthKey(o.order_date) === monthKey);

          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });

          const pendingValue = pendingOrders.reduce((sum, o) => sum + o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0), 0);
          const monthExp = expenses.filter(e => getMonthKey(e.expense_date) === monthKey);
          const opex = monthExp.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const materialCost = monthExp.filter(e => e.type === 'expense' && e.category.includes('Nguyên liệu')).reduce((s, e) => s + e.amount, 0);
          const shippingCost = monthExp.filter(e => e.type === 'expense' && (e.category.includes('giao') || e.category.includes('chuyển'))).reduce((s, e) => s + e.amount, 0);
          const otherIncome = monthExp.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
          const inventoryCashOut = monthExp.filter(e => e.type === 'inventory_purchase').reduce((s, e) => s + e.amount, 0);

          const grossProfit = revenue - cogs;
          const netProfit = grossProfit - opex + otherIncome;
          const netMargin = revenue > 0 ? (netProfit / revenue) * 100 : 0;
          const cashFlow = revenue + otherIncome - opex - inventoryCashOut;

          return {
            monthKey, revenue, cogs, grossProfit, opex, materialCost, shippingCost,
            otherIncome, inventoryCashOut, netProfit, netMargin, cashFlow,
            completedCount: completedOrders.length, pendingCount: pendingOrders.length, pendingValue
          };
        };

        const thisM = calcPeriod(THIS_MONTH);
        const lastM = calcPeriod(LAST_MONTH);

        const productInsights = products.map(p => {
          const margin = p.selling_price > 0 ? ((p.selling_price - p.cost_price) / p.selling_price) * 100 : 0;
          let soldQtyThisMonth = 0;
          orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === THIS_MONTH).forEach(o => {
            o.items.forEach(i => { if (i.product_id === p.id) soldQtyThisMonth += i.quantity; });
          });
          return { ...p, margin, soldQtyThisMonth, isLowStock: p.stock <= p.low_stock_threshold, isLowMargin: margin < 20 };
        });

        return {
          thisM, lastM,
          revChangePct: lastM.revenue > 0 ? ((thisM.revenue - lastM.revenue) / lastM.revenue) * 100 : 0,
          profitChangePct: lastM.netProfit !== 0 ? ((thisM.netProfit - lastM.netProfit) / Math.abs(lastM.netProfit)) * 100 : 0,
          materialDiff: thisM.materialCost - lastM.materialCost,
          shippingDiff: thisM.shippingCost - lastM.shippingCost,
          productInsights,
          lowStockProducts: productInsights.filter(p => p.isLowStock),
          lowMarginProducts: productInsights.filter(p => p.isLowMargin)
        };
      }, [products, orders, expenses]);

      const run = async (fn) => {
        const { error } = await fn();
        if (error) alert('Có lỗi xảy ra: ' + error.message);
        await onReload();
      };

      const handleAddProduct = (p) => run(() => sb.from('products').insert(p));
      const handleUpdateProduct = ({ id, ...rest }) => run(() => sb.from('products').update(rest).eq('id', id));
      const handleDeleteProduct = (id) => run(() => sb.from('products').delete().eq('id', id));
      const handleCreateOrder = ({ customer_name, order_date, status, selectedItems }) => run(() => sb.rpc('create_order', {
        p_customer: customer_name, p_date: order_date, p_status: status,
        p_items: selectedItems.map(i => ({ product_id: i.product_id, quantity: Number(i.quantity) }))
      }));
      const handleChangeOrderStatus = (orderId, newStatus) => run(() => sb.rpc('set_order_status', { p_order_id: orderId, p_status: newStatus }));
      const handleAddExpense = (e) => run(() => sb.from('transactions').insert({
        type: e.type, category: e.category, amount: e.amount, transaction_date: e.expense_date, note: e.note
      }));
      const handleDeleteExpense = (id) => run(() => sb.from('transactions').delete().eq('id', id));

      const navItems = [
        { id: 'dashboard', label: 'Tổng quan', shortLabel: 'Tổng quan', icon: '📊' },
        { id: 'orders', label: 'Đơn hàng', shortLabel: 'Đơn hàng', icon: '🧾', badge: analytics.thisM.pendingCount },
        { id: 'products', label: 'Sản phẩm & Kho', shortLabel: 'Sản phẩm', icon: '📦', badge: analytics.lowStockProducts.length, badgeColor: 'bg-rose-500' },
        { id: 'finance', label: 'Sổ Thu & Chi', shortLabel: 'Thu & Chi', icon: '💳' },
        { id: 'ai', label: 'Trợ lý AI', shortLabel: 'Trợ lý AI', icon: '🤖', highlight: true },
      ];

      return (
        <div className="min-h-[100dvh] md:h-screen flex flex-col md:flex-row md:overflow-hidden">
          {/* HEADER TRÊN ĐIỆN THOẠI (9:16) */}
          <div className="md:hidden sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-blue-100 px-3 py-2 flex items-center justify-between gap-2">
            <div className="min-w-0 flex items-center gap-2">
              <BizFlowLogo size="sm" />
              <span className="text-[11px] font-bold text-blue-700 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-full truncate max-w-[115px]">
                {user.shop_name}
              </span>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              {user.is_demo && (
                <button
                  onClick={() => { if (confirm('Khôi phục lại dữ liệu mẫu ban đầu cho phiên xem thử này?')) onResetSampleData(); }}
                  disabled={busy}
                  title="Làm mới dữ liệu mẫu"
                  className="px-2.5 py-1.5 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold disabled:opacity-50"
                >
                  🔄
                </button>
              )}
              <button
                onClick={onLogout}
                className="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold"
              >
                Thoát
              </button>
            </div>
          </div>

          {/* THANH ĐIỀU HƯỚNG TRÁI TRÊN MÁY TÍNH */}
          <aside className="hidden md:flex md:w-56 lg:w-64 md:h-screen bg-white border-r border-blue-100 flex-col shrink-0 shadow-sm">
            <div className="p-3.5 border-b border-blue-100 bg-gradient-to-br from-white to-blue-50/60 shrink-0">
              <BizFlowLogo size="sm" />
              <div className="mt-2.5 p-2 rounded-xl bg-blue-50 border border-blue-100">
                <div className="text-[10px] font-semibold text-blue-600 uppercase tracking-wider">Cửa hàng đang quản lý</div>
                <div className="text-xs font-bold text-slate-900 truncate mt-0.5">🏪 {user.shop_name}</div>
                <div className="text-[11px] text-slate-500 truncate">{user.email}</div>
              </div>
            </div>

            <nav className="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1">
              {navItems.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs lg:text-sm font-semibold transition ${
                      isActive
                        ? 'bg-gradient-to-r from-blue-600 to-sky-600 text-white shadow-md shadow-blue-200'
                        : item.highlight
                        ? 'text-blue-700 bg-blue-50/70 hover:bg-blue-100/70'
                        : 'text-slate-600 hover:bg-blue-50/60 hover:text-blue-700'
                    }`}
                  >
                    <span className="flex items-center gap-2 min-w-0">
                      <span>{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </span>
                    {item.badge > 0 && (
                      <span className={`px-1.5 py-0.5 text-[11px] rounded-full text-white shrink-0 ${isActive ? 'bg-white/25' : (item.badgeColor || 'bg-amber-500')}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            <div className="p-2.5 m-2 rounded-2xl bg-gradient-to-br from-blue-50 to-white border border-blue-100 text-xs space-y-1.5 shrink-0">
              <div className="text-[11px] text-slate-600 leading-snug">
                {user.is_demo
                  ? '👀 Bạn đang xem bản mẫu riêng. Mọi thao tác không ảnh hưởng người khác.'
                  : '🔒 Dữ liệu được lưu riêng cho tài khoản của bạn.'}
              </div>
              {user.is_demo && (
                <button
                  onClick={() => { if (confirm('Khôi phục lại dữ liệu mẫu ban đầu cho phiên xem thử này?')) onResetSampleData(); }}
                  disabled={busy}
                  className="w-full py-1.5 rounded-lg bg-white border border-blue-200 text-blue-700 font-semibold hover:bg-blue-50 disabled:opacity-50"
                >
                  🔄 Làm mới dữ liệu mẫu
                </button>
              )}
              <button
                onClick={onLogout}
                className="w-full py-1.5 rounded-lg bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 font-semibold transition"
              >
                Đăng xuất
              </button>
            </div>
          </aside>

          {/* NỘI DUNG CHÍNH - CỐ ĐỊNH TRONG 1 MÀN HÌNH TRÊN MÁY TÍNH */}
          <main className="flex-1 min-w-0 flex flex-col md:h-screen md:overflow-hidden bg-business-grid">
            <header className="bg-white/90 backdrop-blur-md border-b border-blue-100 px-4 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
              <div className="min-w-0">
                <h1 className="text-sm sm:text-base font-extrabold text-slate-900 truncate">
                  {navItems.find(n => n.id === activeTab)?.icon} {navItems.find(n => n.id === activeTab)?.label}
                </h1>
                <p className="text-[11px] text-slate-500">
                  Tháng hiện tại: <strong className="text-blue-700">{THIS_MONTH}</strong> • Tháng trước: <strong>{LAST_MONTH}</strong>
                </p>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {activeTab === 'ai' && (
                  <label className="flex items-center gap-1.5 text-[11px] font-semibold bg-blue-50 text-blue-700 px-3 py-1 rounded-full cursor-pointer border border-blue-200">
                    <input type="checkbox" checked={showHowItWorks} onChange={e => setShowHowItWorks(e.target.checked)} className="accent-blue-600" />
                    <span>Hiện cách AI tính</span>
                  </label>
                )}
              </div>
            </header>

            <div className="flex-1 min-w-0 min-h-0 flex flex-col p-3 sm:p-4 pb-24 md:pb-4 overflow-y-auto md:overflow-hidden">
              {activeTab === 'dashboard' && (
                <DashboardView
                  analytics={analytics}
                  setActiveTab={setActiveTab}
                  productsCount={products.length}
                  ordersCount={orders.length}
                  user={user}
                />
              )}
              {activeTab === 'orders' && (
                <OrdersView
                  orders={orders}
                  products={products}
                  onCreateOrder={handleCreateOrder}
                  onChangeStatus={handleChangeOrderStatus}
                  goToProducts={() => setActiveTab('products')}
                />
              )}
              {activeTab === 'products' && (
                <ProductsView
                  products={analytics.productInsights}
                  onAddProduct={handleAddProduct}
                  onUpdateProduct={handleUpdateProduct}
                  onDeleteProduct={handleDeleteProduct}
                />
              )}
              {activeTab === 'finance' && (
                <FinanceView
                  expenses={expenses}
                  analytics={analytics}
                  onAddExpense={handleAddExpense}
                  onDeleteExpense={handleDeleteExpense}
                />
              )}
              {activeTab === 'ai' && (
                <AIIntelligenceView
                  analytics={analytics}
                  showHowItWorks={showHowItWorks}
                  expenses={expenses}
                />
              )}
            </div>
          </main>

          {/* THANH ĐIỀU HƯỚNG CỐ ĐỊNH DƯỚI CÙNG CHO ĐIỆN THOẠI (9:16) */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-blue-100 shadow-[0_-4px_20px_rgba(15,23,42,0.06)] grid grid-cols-5 px-1 pt-1.5 pb-[max(0.4rem,env(safe-area-inset-bottom))]">
            {navItems.map(item => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`relative flex flex-col items-center justify-center py-1 rounded-xl transition ${
                    isActive ? 'text-blue-600 bg-blue-50/80' : 'text-slate-500'
                  }`}
                >
                  <span className="text-lg leading-none">{item.icon}</span>
                  <span className={`text-[10px] mt-1 leading-tight truncate max-w-full px-0.5 ${isActive ? 'font-bold' : 'font-medium'}`}>
                    {item.shortLabel}
                  </span>
                  {item.badge > 0 && (
                    <span className={`absolute top-0.5 right-2 min-w-[16px] h-4 px-1 flex items-center justify-center text-[9px] font-bold rounded-full text-white ${item.badgeColor || 'bg-amber-500'}`}>
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    // ==========================================
    // 1. TRANG TỔNG QUAN (VỪA KHÍT 1 MÀN HÌNH Ở 100% & 110% ZOOM)
    // ==========================================
    function DashboardView({ analytics, setActiveTab, productsCount, ordersCount, user }) {
      const { thisM, lastM, revChangePct, profitChangePct, lowStockProducts, lowMarginProducts } = analytics;
      const maxVal = Math.max(
  thisM.revenue, lastM.revenue,
  thisM.cogs + thisM.opex, lastM.cogs + lastM.opex,
  Math.max(0, thisM.netProfit), Math.max(0, lastM.netProfit),
  1
);

      // Hướng dẫn từng bước cho tài khoản mới đăng ký (chưa có dữ liệu)
      if (productsCount === 0 && ordersCount === 0) {
        return (
          <div className="md:h-full flex items-center justify-center">
            <div className="bg-white border border-blue-100 rounded-2xl p-6 sm:p-8 shadow-sm max-w-3xl w-full text-center space-y-5">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-3xl">🏪</div>
              <div>
                <h2 className="text-lg sm:text-xl font-extrabold text-slate-900">Chào mừng {user.shop_name} đến với BizFlow AI!</h2>
                <p className="text-xs sm:text-sm text-slate-600 mt-2 max-w-lg mx-auto">
                  Cửa hàng mới của bạn hiện đang trống để đảm bảo tách biệt hoàn toàn với các tài khoản khác. Hãy làm theo 2 bước đơn giản sau để bắt đầu:
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
                <div className="p-4 rounded-xl bg-blue-50/70 border border-blue-100 space-y-2">
                  <div className="text-xs font-bold text-blue-700">BƯỚC 1</div>
                  <div className="font-bold text-slate-900 text-sm">Thêm sản phẩm bạn đang bán</div>
                  <p className="text-xs text-slate-600">Nhập tên món, giá bán ra, giá nhập vào và số lượng đang có trong kho.</p>
                  <button onClick={() => setActiveTab('products')} className="mt-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold">
                    + Thêm sản phẩm ngay
                  </button>
                </div>

                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                  <div className="text-xs font-bold text-slate-500">BƯỚC 2</div>
                  <div className="font-bold text-slate-900 text-sm">Tạo đơn hàng đầu tiên</div>
                  <p className="text-xs text-slate-600">Khi có khách mua hàng, ghi đơn mới để hệ thống tự tính tiền lời và trừ kho.</p>
                  <button onClick={() => setActiveTab('orders')} className="mt-1 px-4 py-2 bg-white border border-blue-200 text-blue-700 hover:bg-blue-50 rounded-lg text-xs font-bold">
                    Đi tới mục Đơn hàng →
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:h-full md:min-h-0 gap-3 lg:gap-4">
          {/* 4 THẺ CHỈ SỐ LUÔN TRÊN 1 HÀNG Ở MÁY TÍNH (lg:grid-cols-4) ĐỂ KHÔNG TĂNG CHIỀU CAO KHI ZOOM 110% */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 shrink-0">
            <KpiCard
              title="Tiền bán hàng tháng này"
              sub="Chỉ tính đơn đã hoàn thành"
              value={formatVND(thisM.revenue)}
              trend={`${revChangePct >= 0 ? '▲ Tăng' : '▼ Giảm'} ${Math.abs(revChangePct).toFixed(1)}% so với tháng trước`}
              trendPositive={revChangePct >= 0}
              accent="blue"
            />
            <KpiCard
              title="Tổng vốn & chi phí"
              sub={`Hàng: ${formatVND(thisM.cogs)} | Phí: ${formatVND(thisM.opex)}`}
              value={formatVND(thisM.cogs + thisM.opex)}
              trend={`Giao hàng & Bao bì: ${formatVND(thisM.shippingCost + thisM.materialCost)}`}
              trendPositive={false}
              accent="sky"
            />
            <KpiCard
              title="Tiền lãi thực tế"
              sub={`Bán 100đ lãi ${thisM.netMargin.toFixed(0)}đ`}
              value={formatVND(thisM.netProfit)}
              trend={`${profitChangePct >= 0 ? '▲ Tăng' : '▼ Giảm'} ${Math.abs(profitChangePct).toFixed(1)}% so với tháng trước`}
              trendPositive={profitChangePct >= 0}
              accent={thisM.netProfit >= 0 ? 'emerald' : 'rose'}
            />
            <KpiCard
              title="Tiền mặt thực còn"
              sub={`Đã trừ ${formatVND(thisM.inventoryCashOut)} tiền nhập hàng`}
              value={formatVND(thisM.cashFlow)}
              trend="Số tiền thực còn trong ví/két"
              trendPositive={thisM.cashFlow >= 0}
              accent="indigo"
            />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 lg:gap-4 md:flex-1 md:min-h-0">
            {/* BIỂU ĐỒ SO SÁNH CO GIÃN THEO CHIỀU CAO MÀN HÌNH */}
            <div className="lg:col-span-2 bg-white p-4 rounded-2xl border border-blue-100 shadow-sm min-w-0 flex flex-col md:min-h-0">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-2 shrink-0">
                <div>
                  <h2 className="font-bold text-slate-900 text-sm">So sánh Tháng trước và Tháng này</h2>
                  <p className="text-[11px] text-slate-500">Nhìn nhanh mức bán, chi phí và tiền lãi giữa hai tháng</p>
                </div>
                <div className="flex flex-wrap gap-3 text-[11px] font-medium text-slate-600">
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-blue-600 inline-block"></span> Tiền bán hàng</span>
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-sky-400 inline-block"></span> Tổng chi phí</span>
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-emerald-500 inline-block"></span> Tiền lãi</span>
                </div>
              </div>

              <div className="flex-1 min-h-[165px] grid grid-cols-2 gap-3 sm:gap-8 pt-3 pb-1 px-1 sm:px-4 border-b border-blue-50">
                {[{ label: `Tháng trước (${lastM.monthKey})`, data: lastM }, { label: `Tháng này (${thisM.monthKey})`, data: thisM }].map((col, idx) => (
                  <div key={idx} className="flex flex-col items-center min-w-0 h-full">
                    <div className="flex-1 min-h-0 w-full flex items-end justify-center gap-2 sm:gap-4">
                      <BarItem heightPct={(col.data.revenue / maxVal) * 100} color="bg-blue-600" label={formatVND(col.data.revenue)} />
                      <BarItem heightPct={((col.data.cogs + col.data.opex) / maxVal) * 100} color="bg-sky-400" label={formatVND(col.data.cogs + col.data.opex)} />
                      <BarItem heightPct={(Math.max(0, col.data.netProfit) / maxVal) * 100} color="bg-emerald-500" label={formatVND(col.data.netProfit)} />
                    </div>
                    <span className="mt-2 text-[11px] font-bold text-slate-700 text-center shrink-0">{col.label}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* CẢNH BÁO NHANH */}
            <div className="bg-white p-4 rounded-2xl border border-blue-100 shadow-sm flex flex-col justify-between gap-3 min-w-0 md:min-h-0">
              <div className="flex-1 min-h-0 flex flex-col">
                <h2 className="font-bold text-slate-900 mb-2 text-sm shrink-0">🔔 Việc cần chú ý ngay</h2>
                <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-2.5 text-xs pr-0.5">
                  <div className="p-3 rounded-xl bg-rose-50/80 border border-rose-200">
                    <div className="font-bold text-rose-800">Hàng sắp hết trong kho ({lowStockProducts.length} món)</div>
                    {lowStockProducts.length === 0 ? (
                      <div className="text-rose-700/80 mt-1">Kho hàng hiện đang đủ, chưa cần nhập thêm.</div>
                    ) : (
                      lowStockProducts.map(p => (
                        <div key={p.id} className="text-rose-700 flex justify-between mt-1 gap-2">
                          <span className="truncate">{p.name}</span>
                          <strong className="shrink-0">Còn {p.stock}</strong>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="p-3 rounded-xl bg-blue-50/80 border border-blue-200">
                    <div className="font-bold text-blue-900">Món lãi mỏng dưới 20% ({lowMarginProducts.length} món)</div>
                    {lowMarginProducts.length === 0 ? (
                      <div className="text-blue-700/80 mt-1">Tất cả sản phẩm đều đang có mức lãi tốt.</div>
                    ) : (
                      lowMarginProducts.map(p => (
                        <div key={p.id} className="text-blue-800 flex justify-between mt-1 gap-2">
                          <span className="truncate">{p.name}</span>
                          <strong className="shrink-0">Lãi {p.margin.toFixed(0)}%</strong>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>

              <button
                onClick={() => setActiveTab('ai')}
                className="w-full py-2 rounded-xl bg-gradient-to-r from-blue-600 to-sky-600 hover:from-blue-700 hover:to-sky-700 text-white text-xs sm:text-sm font-bold shadow-sm transition shrink-0"
              >
                Hỏi Trợ lý AI ngay ✨
              </button>
            </div>
          </div>
        </div>
      );
    }

    function KpiCard({ title, sub, value, trend, trendPositive, accent }) {
      const accents = {
        blue: 'border-t-blue-600',
        sky: 'border-t-sky-500',
        emerald: 'border-t-emerald-500',
        rose: 'border-t-rose-500',
        indigo: 'border-t-indigo-600'
      };
      return (
        <div className={`bg-white p-3 lg:p-3.5 rounded-2xl border border-blue-100 border-t-4 ${accents[accent]} shadow-sm min-w-0`}>
          <div className="text-[11px] font-semibold text-slate-500 truncate">{title}</div>
          <div className="text-base lg:text-lg font-extrabold text-slate-900 mt-0.5 truncate">{value}</div>
          <div className="text-[11px] text-slate-500 mt-0.5 truncate" title={sub}>{sub}</div>
          <div className={`text-[11px] font-bold mt-1.5 truncate ${trendPositive ? 'text-emerald-600' : 'text-blue-700'}`} title={trend}>{trend}</div>
        </div>
      );
    }

    function BarItem({ heightPct, color, label }) {
      return (
        <div className="flex flex-col items-center justify-end h-full w-8 sm:w-12 md:w-14 min-w-0">
          <div className="text-[9px] sm:text-[10px] font-bold text-slate-600 mb-1 truncate max-w-full shrink-0">{label.replace('₫', '').trim()}</div>
          <div className={`w-full rounded-t-lg ${color} transition-all`} style={{ height: `${Math.max(4, heightPct * 0.85)}%` }}></div>
        </div>
      );
    }

    // ==========================================
    // 2. TRANG ĐƠN HÀNG (BẢNG CUỘN TRONG KHUNG, KHÔNG TRÀN TRANG)
    // ==========================================
    function OrdersView({ orders, products, onCreateOrder, onChangeStatus, goToProducts }) {
      const [customerName, setCustomerName] = useState('');
      const [orderDate, setOrderDate] = useState(todayStr());
      const [status, setStatus] = useState('completed');
      const [selectedProdId, setSelectedProdId] = useState('');
      const [qty, setQty] = useState(1);
      const [cart, setCart] = useState([]);

      const activeProdId = selectedProdId || products[0]?.id || '';

      const addToCart = () => {
        if (!activeProdId || qty <= 0) return;
        const exist = cart.find(c => c.product_id === activeProdId);
        if (exist) setCart(cart.map(c => c.product_id === activeProdId ? { ...c, quantity: c.quantity + Number(qty) } : c));
        else setCart([...cart, { product_id: activeProdId, quantity: Number(qty) }]);
      };

      const removeCartItem = (pid) => {
        setCart(cart.filter(c => c.product_id !== pid));
      };

      const submitOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return alert('Bạn hãy bấm nút "+ Thêm" món vào đơn trước khi lưu!');
        onCreateOrder({ customer_name: customerName, order_date: orderDate, status, selectedItems: cart });
        setCustomerName('');
        setCart([]);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:h-full md:min-h-0">
          <div className="bg-white p-4 rounded-2xl border border-blue-100 shadow-sm h-fit max-h-full overflow-y-auto scrollbar-thin min-w-0">
            <h2 className="font-bold text-slate-900 mb-2.5 text-sm">➕ Ghi đơn hàng mới</h2>

            {products.length === 0 ? (
              <div className="p-4 rounded-xl bg-blue-50 border border-blue-100 text-xs text-slate-700 space-y-3">
                <p>Cửa hàng của bạn chưa có sản phẩm nào để tạo đơn. Hãy thêm sản phẩm trước nhé!</p>
                <button onClick={goToProducts} className="w-full py-2 bg-blue-600 text-white rounded-lg font-bold">
                  + Thêm sản phẩm ngay
                </button>
              </div>
            ) : (
              <form onSubmit={submitOrder} className="space-y-2.5 text-sm">
                <input
                  value={customerName}
                  onChange={e => setCustomerName(e.target.value)}
                  placeholder="Tên khách mua (để trống = Khách lẻ)"
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-xs sm:text-sm"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="date"
                    value={orderDate}
                    onChange={e => setOrderDate(e.target.value)}
                    className="w-full min-w-0 px-2.5 py-2 border border-slate-200 rounded-xl text-xs sm:text-sm"
                  />
                  <select
                    value={status}
                    onChange={e => setStatus(e.target.value)}
                    className="w-full min-w-0 px-2.5 py-2 border border-slate-200 rounded-xl text-xs sm:text-sm"
                  >
                    <option value="completed">Đã hoàn thành</option>
                    <option value="pending">Chờ xử lý</option>
                  </select>
                </div>

                <div className="flex items-stretch gap-1.5 min-w-0">
                  <select
                    value={activeProdId}
                    onChange={e => setSelectedProdId(e.target.value)}
                    className="flex-1 min-w-0 px-2.5 py-2 border border-slate-200 rounded-xl text-xs"
                  >
                    {products.map(p => (
                      <option key={p.id} value={p.id}>{p.name} (Còn: {p.stock})</option>
                    ))}
                  </select>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={e => setQty(e.target.value)}
                    className="w-14 shrink-0 px-1.5 py-2 border border-slate-200 rounded-xl text-center text-xs sm:text-sm"
                  />
                  <button
                    type="button"
                    onClick={addToCart}
                    className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shrink-0 whitespace-nowrap"
                  >
                    + Thêm
                  </button>
                </div>

                {cart.length > 0 && (
                  <div className="bg-blue-50/70 p-2.5 rounded-xl border border-blue-100 text-xs space-y-1 max-h-32 overflow-y-auto scrollbar-thin">
                    <div className="font-bold text-blue-800">Món trong đơn này:</div>
                    {cart.map(c => {
                      const p = products.find(pr => pr.id === c.product_id);
                      return (
                        <div key={c.product_id} className="flex justify-between items-center gap-2">
                          <span className="truncate">{p?.name} × {c.quantity}</span>
                          <div className="flex items-center gap-2 shrink-0">
                            <strong>{formatVND((p?.selling_price || 0) * c.quantity)}</strong>
                            <button type="button" onClick={() => removeCartItem(c.product_id)} className="text-rose-500 font-bold px-1">✕</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-sm text-xs sm:text-sm">
                  Lưu đơn hàng
                </button>
              </form>
            )}
          </div>

          <div className="lg:col-span-2 bg-white p-4 rounded-2xl border border-blue-100 shadow-sm min-w-0 flex flex-col md:h-full md:min-h-0">
            <h2 className="font-bold text-slate-900 mb-2.5 text-sm shrink-0">Danh sách đơn hàng ({orders.length})</h2>
            {orders.length === 0 ? (
              <div className="text-center py-10 text-xs text-slate-400">Chưa có đơn hàng nào. Hãy tạo đơn đầu tiên ở khung bên trái!</div>
            ) : (
              <div className="flex-1 min-h-0 overflow-auto scrollbar-thin">
                <table className="w-full min-w-[540px] text-left text-xs">
                  <thead className="sticky top-0 z-10 bg-blue-50 text-blue-900 uppercase border-b border-blue-100">
                    <tr>
                      <th className="py-2 px-3">Khách hàng / Ngày</th>
                      <th className="py-2 px-3">Sản phẩm đã chọn</th>
                      <th className="py-2 px-3 text-right">Tổng tiền</th>
                      <th className="py-2 px-3">Trạng thái</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {orders.map(o => {
                      const totalRev = o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0);
                      return (
                        <tr key={o.id} className="hover:bg-blue-50/30">
                          <td className="py-2.5 px-3">
                            <div className="font-bold text-slate-800">{o.customer_name || 'Khách lẻ'}</div>
                            <div className="text-slate-500">{o.order_date}</div>
                          </td>
                          <td className="py-2.5 px-3">
                            {o.items.map((it, i) => (
                              <div key={i}>
                                {it.name} × <strong>{it.quantity}</strong>{' '}
                                <span className="text-slate-400">(Giá nhập: {formatVND(it.unit_cost)})</span>
                              </div>
                            ))}
                          </td>
                          <td className="py-2.5 px-3 text-right font-bold text-slate-900 whitespace-nowrap">
                            {o.status === 'completed' ? formatVND(totalRev) : <span className="line-through text-slate-400">{formatVND(totalRev)}</span>}
                          </td>
                          <td className="py-2.5 px-3">
                            <select
                              value={o.status}
                              onChange={e => onChangeStatus(o.id, e.target.value)}
                              className={`px-2 py-1 border rounded-lg font-semibold ${
                                o.status === 'completed' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' :
                                o.status === 'pending' ? 'bg-amber-50 border-amber-200 text-amber-700' :
                                'bg-slate-100 border-slate-200 text-slate-500'
                              }`}
                            >
                              <option value="completed">{ORDER_STATUS_LABEL.completed}</option>
                              <option value="pending">{ORDER_STATUS_LABEL.pending}</option>
                              <option value="cancelled">{ORDER_STATUS_LABEL.cancelled}</option>
                            </select>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. TRANG SẢN PHẨM & KHO
    // ==========================================
    function ProductsView({ products, onAddProduct, onUpdateProduct, onDeleteProduct }) {
      const [form, setForm] = useState({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 });
      const [editingId, setEditingId] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = {
          name: form.name,
          selling_price: Number(form.selling_price),
          cost_price: Number(form.cost_price),
          stock: Number(form.stock),
          low_stock_threshold: Number(form.low_stock_threshold || 10)
        };
        if (editingId) { onUpdateProduct({ ...payload, id: editingId }); setEditingId(null); }
        else onAddProduct(payload);
        setForm({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 });
      };

      const startEdit = (p) => {
        setEditingId(p.id);
        setForm({
          name: p.name,
          selling_price: p.selling_price,
          cost_price: p.cost_price,
          stock: p.stock,
          low_stock_threshold: p.low_stock_threshold
        });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:h-full md:min-h-0">
          <div className="bg-white p-4 rounded-2xl border border-blue-100 shadow-sm h-fit max-h-full overflow-y-auto scrollbar-thin min-w-0">
            <h2 className="font-bold text-slate-900 mb-2.5 text-sm">{editingId ? '✏️ Sửa thông tin sản phẩm' : '➕ Thêm sản phẩm mới'}</h2>
            <form onSubmit={handleSubmit} className="space-y-2.5 text-sm">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Tên sản phẩm</label>
                <input required placeholder="VD: Trà đào cam sả" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Giá bán cho khách</label>
                  <input required type="number" min="0" placeholder="VD: 35000" value={form.selling_price} onChange={e => setForm({ ...form, selling_price: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Giá nhập / Giá vốn</label>
                  <input required type="number" min="0" placeholder="VD: 15000" value={form.cost_price} onChange={e => setForm({ ...form, cost_price: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Số lượng đang có</label>
                  <input required type="number" min="0" placeholder="VD: 50" value={form.stock} onChange={e => setForm({ ...form, stock: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Báo khi còn dưới</label>
                  <input required type="number" min="0" placeholder="10" value={form.low_stock_threshold} onChange={e => setForm({ ...form, low_stock_threshold: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
                </div>
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs sm:text-sm">
                  {editingId ? 'Lưu thay đổi' : 'Thêm vào kho'}
                </button>
                {editingId && (
                  <button
                    type="button"
                    onClick={() => { setEditingId(null); setForm({ name: '', selling_price: '', cost_price: '', stock: '', low_stock_threshold: 10 }); }}
                    className="px-3 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold shrink-0"
                  >
                    Hủy
                  </button>
                )}
              </div>
            </form>
          </div>

          <div className="lg:col-span-2 bg-white p-4 rounded-2xl border border-blue-100 shadow-sm min-w-0 flex flex-col md:h-full md:min-h-0">
            <h2 className="font-bold text-slate-900 mb-2.5 text-sm shrink-0">Danh sách sản phẩm ({products.length})</h2>
            {products.length === 0 ? (
              <div className="text-center py-10 text-xs text-slate-400">Chưa có sản phẩm nào. Hãy nhập sản phẩm đầu tiên ở khung bên trái!</div>
            ) : (
              <div className="flex-1 min-h-0 overflow-auto scrollbar-thin">
                <table className="w-full min-w-[540px] text-left text-xs">
                  <thead className="sticky top-0 z-10 bg-blue-50 text-blue-900 uppercase border-b border-blue-100">
                    <tr>
                      <th className="py-2 px-3">Tên sản phẩm</th>
                      <th className="py-2 px-3 text-right">Giá bán</th>
                      <th className="py-2 px-3 text-right">Giá nhập</th>
                      <th className="py-2 px-3 text-right">Tỷ lệ lãi</th>
                      <th className="py-2 px-3 text-center">Tồn kho</th>
                      <th className="py-2 px-3 text-right">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {products.map(p => (
                      <tr key={p.id} className={p.isLowStock ? 'bg-rose-50/40' : 'hover:bg-blue-50/30'}>
                        <td className="py-2.5 px-3 font-semibold text-slate-800">
                          {p.name}
                          {p.isLowStock && <span className="ml-1.5 px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded text-[10px] font-bold">SẮP HẾT</span>}
                        </td>
                        <td className="py-2.5 px-3 text-right whitespace-nowrap">{formatVND(p.selling_price)}</td>
                        <td className="py-2.5 px-3 text-right whitespace-nowrap">{formatVND(p.cost_price)}</td>
                        <td className={`py-2.5 px-3 text-right font-bold ${p.isLowMargin ? 'text-amber-600' : 'text-emerald-600'}`}>{p.margin.toFixed(0)}%</td>
                        <td className="py-2.5 px-3 text-center font-bold">{p.stock}</td>
                        <td className="py-2.5 px-3 text-right space-x-2 whitespace-nowrap">
                          <button onClick={() => startEdit(p)} className="text-blue-600 hover:underline font-bold">Sửa</button>
                          <button onClick={() => { if (confirm(`Xóa "${p.name}" khỏi danh sách?`)) onDeleteProduct(p.id); }} className="text-rose-500 hover:underline font-semibold">Xóa</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. TRANG SỔ THU & CHI
    // ==========================================
    function FinanceView({ expenses, analytics, onAddExpense, onDeleteExpense }) {
      const [form, setForm] = useState({ type: 'expense', category: 'Nguyên liệu & Bao bì', amount: '', expense_date: todayStr(), note: '' });
      const submit = (e) => {
        e.preventDefault();
        if (!form.amount) return;
        onAddExpense({ ...form, amount: Number(form.amount) });
        setForm({ ...form, amount: '', note: '' });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:h-full md:min-h-0">
          <div className="bg-white p-4 rounded-2xl border border-blue-100 shadow-sm h-fit max-h-full overflow-y-auto scrollbar-thin min-w-0">
            <h2 className="font-bold text-slate-900 mb-2.5 text-sm">➕ Ghi khoản Thu hoặc Chi</h2>
            <form onSubmit={submit} className="space-y-2.5 text-sm">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Loại giao dịch</label>
                <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm">
                  <option value="expense">Chi phí cửa hàng (Trừ vào tiền lãi)</option>
                  <option value="inventory_purchase">Chi tiền nhập hàng về kho (Chỉ trừ tiền mặt)</option>
                  <option value="income">Khoản thu thêm khác</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Nhóm khoản mục</label>
                <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm">
                  <option value="Nguyên liệu & Bao bì">Nguyên liệu & Bao bì</option>
                  <option value="Phí giao hàng">Phí giao hàng</option>
                  <option value="Thuê mặt bằng">Thuê mặt bằng / Điện nước</option>
                  <option value="Nhập hàng về kho">Nhập hàng về kho</option>
                  <option value="Thu khác">Khoản thu khác</option>
                </select>
              </div>
              <input required type="number" min="1" placeholder="Số tiền (VNĐ)" value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
              <input required type="date" value={form.expense_date} onChange={e => setForm({ ...form, expense_date: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
              <input placeholder="Ghi chú thêm (tùy chọn)" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className="w-full px-3 py-1.5 sm:py-2 border border-slate-200 rounded-xl text-xs sm:text-sm" />
              <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs sm:text-sm">Lưu vào sổ</button>
            </form>
          </div>

          <div className="lg:col-span-2 bg-white p-4 rounded-2xl border border-blue-100 shadow-sm min-w-0 flex flex-col md:h-full md:min-h-0">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5 shrink-0">
              <h2 className="font-bold text-slate-900 text-sm">Sổ Thu & Chi</h2>
              <div className="text-[11px] font-semibold text-blue-800 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">
                Tiền lãi tháng này: <strong>{formatVND(analytics.thisM.netProfit)}</strong> | Tiền mặt thực còn: <strong>{formatVND(analytics.thisM.cashFlow)}</strong>
              </div>
            </div>
            {expenses.length === 0 ? (
              <div className="text-center py-10 text-xs text-slate-400">Chưa có khoản thu chi nào được ghi nhận.</div>
            ) : (
              <div className="flex-1 min-h-0 overflow-auto scrollbar-thin">
                <table className="w-full min-w-[480px] text-left text-xs">
                  <thead className="sticky top-0 z-10 bg-blue-50 text-blue-900 uppercase border-b border-blue-100">
                    <tr>
                      <th className="py-2 px-3">Ngày</th>
                      <th className="py-2 px-3">Khoản mục</th>
                      <th className="py-2 px-3">Ghi chú</th>
                      <th className="py-2 px-3 text-right">Số tiền</th>
                      <th className="py-2 px-3"></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {expenses.map(e => (
                      <tr key={e.id} className="hover:bg-blue-50/30">
                        <td className="py-2 px-3 text-slate-500 whitespace-nowrap">{e.expense_date}</td>
                        <td className="py-2 px-3 font-semibold text-slate-800">{e.category}</td>
                        <td className="py-2 px-3 text-slate-600">{e.note || '-'}</td>
                        <td className={`py-2 px-3 text-right font-bold whitespace-nowrap ${e.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {e.type === 'income' ? '+' : '-'}{formatVND(e.amount)}
                        </td>
                        <td className="py-2 px-3 text-right">
                          <button onClick={() => onDeleteExpense(e.id)} className="text-slate-400 hover:text-rose-500 px-1">✕</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. TRANG TRỢ LÝ AI (TỰ ĐỘNG CUỘN XUỐNG CÂU TRẢ LỜI)
    // ==========================================
    function AIIntelligenceView({ analytics, showHowItWorks, expenses }) {
      const { thisM, lastM, revChangePct, profitChangePct, materialDiff, shippingDiff, lowStockProducts, lowMarginProducts } = analytics;
      const [messages, setMessages] = useState([
        { role: 'ai', text: `Xin chào! Tôi là Trợ lý BizFlow AI. Tôi đã tổng hợp toàn bộ số liệu tháng ${thisM.monthKey} của cửa hàng bạn. Hãy bấm chọn câu hỏi gợi ý bên dưới hoặc nhắn câu hỏi cho tôi!` }
      ]);
      const [input, setInput] = useState('');
      const [thinking, setThinking] = useState(false);

      const chatContainerRef = useRef(null);
      const lastMsgRef = useRef(null);

      // Tự động kéo xuống phần trả lời mỗi khi có tin nhắn mới hoặc đang phân tích
      useEffect(() => {
        const container = chatContainerRef.current;
        if (!container) return;

        requestAnimationFrame(() => {
          const lastMsg = messages[messages.length - 1];
          const lastEl = lastMsgRef.current;
          if (!thinking && lastMsg?.role === 'ai' && lastEl && lastEl.offsetHeight > container.clientHeight * 0.85) {
            container.scrollTo({
              top: Math.max(0, lastEl.offsetTop - 12),
              behavior: 'smooth'
            });
          } else {
            container.scrollTo({
              top: container.scrollHeight,
              behavior: 'smooth'
            });
          }
        });
      }, [messages, thinking]);

      const generateVietnameseAnswer = (q) => {
        const lower = q.toLowerCase();
        if (/^(xin )?chào|^hello|^hi\b/.test(lower)) {
          return '👋 Chào bạn! Bạn có thể hỏi tôi về: tiền lãi tháng này, món hàng nào sắp hết trong kho, hoặc vì sao tiền mặt khác với tiền lãi.';
        }
        if (lower.includes('lãi') && !lower.includes('tiền mặt') && (lower.includes('thay đổi') || lower.includes('vì sao') || lower.includes('tại sao') || lower.includes('tăng') || lower.includes('giảm'))) {
          return `📊 GIẢI THÍCH TIỀN LÃI THÁNG ${thisM.monthKey} SO VỚI THÁNG ${lastM.monthKey}:
• Tiền bán hàng: ${formatVND(thisM.revenue)} (${revChangePct >= 0 ? 'tăng' : 'giảm'} ${Math.abs(revChangePct).toFixed(1)}%)
• Tiền lãi thực tế: ${formatVND(thisM.netProfit)} (${profitChangePct >= 0 ? 'tăng' : 'giảm'} ${Math.abs(profitChangePct).toFixed(1)}%)
• Chi phí nguyên liệu & bao bì: ${materialDiff >= 0 ? 'tăng thêm' : 'giảm được'} ${formatVND(Math.abs(materialDiff))}
• Phí giao hàng: ${shippingDiff >= 0 ? 'tăng thêm' : 'giảm được'} ${formatVND(Math.abs(shippingDiff))}
• Các món có tiền lãi mỏng (dưới 20%): ${lowMarginProducts.map(p => `${p.name} (lãi ${p.margin.toFixed(0)}%)`).join(', ') || 'Không có món nào'}.`;
        }
        if (lower.includes('tồn kho') || lower.includes('hết hàng') || lower.includes('nhập thêm')) {
          return lowStockProducts.length === 0
            ? '✅ Các mặt hàng trong kho hiện tại đều đang đủ số lượng an toàn.'
            : `🔔 CẦN NHẬP THÊM HÀNG SỚM:\n` + lowStockProducts.map(p => `• ${p.name}: Chỉ còn ${p.stock} (Mức báo tối thiểu: ${p.low_stock_threshold})`).join('\n');
        }
        if (lower.includes('tiền mặt') || lower.includes('trong ví') || lower.includes('khác')) {
          return `💵 VÌ SAO TIỀN MẶT KHÁC VỚI TIỀN LÃI?\n• Tiền lãi tính trên đơn đã bán: ${formatVND(thisM.netProfit)}\n• Tiền mặt thực sự còn lại: ${formatVND(thisM.cashFlow)}\n\n👉 Nguyên nhân: Trong tháng bạn đã chi ${formatVND(thisM.inventoryCashOut)} tiền mặt để nhập hàng dự trữ vào kho. Số hàng này vẫn nằm trong kho chưa bán hết nên làm tiền mặt giảm đi tạm thời, nhưng chưa bị trừ vào tiền lãi.`;
        }
        return `📈 TÓM TẮT NHANH THÁNG ${thisM.monthKey}:\n• Tiền bán hàng: ${formatVND(thisM.revenue)}\n• Tiền vốn hàng đã bán: ${formatVND(thisM.cogs)}\n• Chi phí cửa hàng: ${formatVND(thisM.opex)}\n• Tiền lãi thực tế: ${formatVND(thisM.netProfit)}\n• Tiền mặt thực còn: ${formatVND(thisM.cashFlow)}`;
      };

      const sendMessage = async (text) => {
  const q = (text || input).trim();
  if (!q || thinking) return;
  setMessages(prev => [...prev, { role: 'user', text: q }]);
  setInput('');

  // Câu trả lời dự phòng (tính từ số liệu có sẵn, không cần mạng)
  const fallbackReply = () =>
    '💡 Trợ lý AI đang bận nên mình trả lời nhanh từ số liệu của bạn:\n\n' + generateVietnameseAnswer(q);

  if (window.ENABLE_AI_EDGE_FUNCTION) {
    setThinking(true);
    try {
      const { data, error } = await sb.functions.invoke('ai-advisor', {
        body: {
          question: q,
          context: {
            thisM,
            lastM,
            lowStockProducts: lowStockProducts.map(p => ({ name: p.name, stock: p.stock, threshold: p.low_stock_threshold })),
            lowMarginProducts: lowMarginProducts.map(p => ({ name: p.name, margin: Number(p.margin.toFixed(1)) }))
          }
        }
      });

      // Trường hợp 1: AI trả lời bình thường
      if (!error && data?.reply) {
        setMessages(prev => [...prev, { role: 'ai', text: data.reply }]);
        return;
      }

      // Trường hợp 2: function trả về lỗi (chưa deploy, quá tải, hết quota...)
      console.error('AI lỗi:', error, data);
      setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
    } catch (err) {
      // Trường hợp 3: lỗi mạng hoặc lỗi bất ngờ
      console.error('AI lỗi:', err);
      setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
    } finally {
      setThinking(false);
    }
    return;
  }

  // Khi AI thật bị tắt: dùng câu trả lời mẫu
  setMessages(prev => [...prev, { role: 'ai', text: generateVietnameseAnswer(q) }]);
};

      return (
        <div className="flex flex-col flex-1 min-h-0 h-[calc(100dvh-180px)] md:h-full gap-2.5">
          {showHowItWorks && (
            <div className="bg-gradient-to-r from-blue-900 to-blue-800 text-white py-2 px-3 rounded-2xl text-[11px] sm:text-xs grid grid-cols-1 md:grid-cols-3 gap-1.5 md:gap-4 shadow-sm shrink-0">
              <div><strong className="text-sky-300">1. DỮ LIỆU ĐẦU VÀO:</strong> {thisM.completedCount} đơn đã bán, {expenses.length} phiếu thu chi</div>
              <div><strong className="text-sky-300">2. CÁCH TÍNH LÃI:</strong> {formatVND(thisM.revenue)} - {formatVND(thisM.cogs)} - {formatVND(thisM.opex)}</div>
              <div><strong className="text-sky-300">3. GỢI Ý TỰ ĐỘNG:</strong> {lowStockProducts.length} món sắp hết, {lowMarginProducts.length} món lãi mỏng</div>
            </div>
          )}

          <div className="bg-white rounded-2xl border border-blue-100 shadow-sm flex flex-col flex-1 min-h-0 overflow-hidden">
            <div ref={chatContainerRef} className="relative flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 space-y-3 scrollbar-thin">
              {messages.map((m, idx) => {
                const isLast = idx === messages.length - 1;
                return (
                  <div
                    key={idx}
                    ref={isLast ? lastMsgRef : null}
                    className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div className={`max-w-[88%] sm:max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs sm:text-[13px] leading-relaxed whitespace-pre-line ${
                      m.role === 'user'
                        ? 'bg-blue-600 text-white shadow-sm'
                        : 'bg-blue-50/70 text-slate-800 border border-blue-100'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                );
              })}
              {thinking && (
                <div className="flex justify-start">
                  <div className="rounded-2xl px-4 py-2 text-xs bg-blue-50 text-blue-700 border border-blue-100">⏳ Đang phân tích số liệu...</div>
                </div>
              )}
            </div>

            <div className="px-3 py-2 border-t border-blue-50 flex flex-wrap gap-1.5 bg-blue-50/40 shrink-0">
              {[
                'Vì sao tiền lãi tháng này thay đổi?',
                'Sản phẩm nào sắp hết hàng?',
                'Tại sao tiền mặt khác với tiền lãi?'
              ].map((q, i) => (
                <button
                  key={i}
                  type="button"
                  onClick={() => sendMessage(q)}
                  disabled={thinking}
                  className="text-[11px] font-medium px-2.5 py-1 rounded-full bg-white text-blue-700 border border-blue-200 hover:bg-blue-50 transition"
                >
                  {q}
                </button>
              ))}
            </div>

            <form onSubmit={e => { e.preventDefault(); sendMessage(); }} className="p-2.5 border-t border-blue-100 flex gap-2 shrink-0 bg-white">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Hỏi trợ lý bằng tiếng Việt..."
                className="flex-1 min-w-0 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500"
              />
              <button type="submit" disabled={thinking} className="px-4 sm:px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shrink-0">
                Gửi
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
