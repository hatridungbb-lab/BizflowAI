    // ==========================================
    // 2. TRANG BÁN HÀNG
    // ==========================================
    function OrdersView({ orders, products, onCreateOrder, onChangeStatus, goToProducts }) {
      const [subTab, setSubTab] = useState('sell');
      const [search, setSearch] = useState('');
      const [cart, setCart] = useState([]);
      const [showOptions, setShowOptions] = useState(false);
      const [customerName, setCustomerName] = useState('');
      const [orderDate, setOrderDate] = useState(todayStr());
      const [status, setStatus] = useState('completed');
      const [saving, setSaving] = useState(false);
      const [friendlyWarn, setFriendlyWarn] = useState('');

      const filteredProducts = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return products;
        return products.filter(p => p.name.toLowerCase().includes(q));
      }, [products, search]);

      const totalAmount = useMemo(() => {
        return cart.reduce((sum, item) => {
          const prod = products.find(p => p.id === item.product_id);
          return sum + (prod ? prod.selling_price * item.quantity : 0);
        }, 0);
      }, [cart, products]);

      const totalQty = useMemo(() => cart.reduce((s, i) => s + i.quantity, 0), [cart]);

      const addOne = (prod) => {
        setFriendlyWarn('');
        const currentQty = cart.find(c => c.product_id === prod.id)?.quantity || 0;
        if (status === 'completed' && currentQty + 1 > prod.stock) {
          setFriendlyWarn(`Sản phẩm "${prod.name}" hiện chỉ còn ${prod.stock} trong kho.`);
          return;
        }
        if (currentQty > 0) {
          setCart(cart.map(c => c.product_id === prod.id ? { ...c, quantity: c.quantity + 1 } : c));
        } else {
          setCart([...cart, { product_id: prod.id, quantity: 1 }]);
        }
      };

      const changeCartQty = (productId, delta) => {
        setFriendlyWarn('');
        const prod = products.find(p => p.id === productId);
        const existing = cart.find(c => c.product_id === productId);
        if (!existing) return;
        const nextQty = existing.quantity + delta;
        if (nextQty <= 0) {
          setCart(cart.filter(c => c.product_id !== productId));
          return;
        }
        if (delta > 0 && status === 'completed' && prod && nextQty > prod.stock) {
          setFriendlyWarn(`Sản phẩm "${prod.name}" hiện chỉ còn ${prod.stock} trong kho.`);
          return;
        }
        setCart(cart.map(c => c.product_id === productId ? { ...c, quantity: nextQty } : c));
      };

      const submitOrder = async () => {
        if (saving || cart.length === 0) return;
        setFriendlyWarn('');

        if (status === 'completed') {
          for (const c of cart) {
            const prod = products.find(p => p.id === c.product_id);
            if (prod && c.quantity > prod.stock) {
              setFriendlyWarn(`Sản phẩm "${prod.name}" chỉ còn ${prod.stock} trong kho. Vui lòng điều chỉnh số lượng.`);
              return;
            }
          }
        }

        setSaving(true);
        try {
          const ok = await onCreateOrder({
            customer_name: customerName,
            order_date: orderDate,
            status,
            selectedItems: cart,
            totalAmount
          });
          if (ok) {
            setCart([]);
            setCustomerName('');
            setOrderDate(todayStr());
            setStatus('completed');
            setShowOptions(false);
          }
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-3">
          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-slate-200 shrink-0">
            <button
              type="button"
              onClick={() => setSubTab('sell')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${
                subTab === 'sell' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              Lên đơn bán hàng
            </button>
            <button
              type="button"
              onClick={() => setSubTab('list')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${
                subTab === 'list' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              Đơn đã lưu ({orders.length})
            </button>
          </div>

          {subTab === 'sell' && (
            <>
              {products.length === 0 ? (
                <div className="bg-white rounded-2xl p-6 border-2 border-slate-200 text-center space-y-4">
                  <div className="text-base text-slate-700">Chưa có sản phẩm nào để lên đơn. Vui lòng thêm sản phẩm trước.</div>
                  <button
                    onClick={goToProducts}
                    className="min-h-[48px] px-6 py-2.5 bg-blue-700 text-white rounded-xl text-base font-extrabold"
                  >
                    + Thêm hàng hóa ngay
                  </button>
                </div>
              ) : (
                <>
                  {products.length > 6 && (
                    <input
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="Tìm nhanh tên sản phẩm..."
                      className="w-full min-h-[46px] px-4 py-2 bg-white border-2 border-slate-300 rounded-2xl text-base focus:outline-none focus:border-blue-700 shrink-0"
                    />
                  )}

                  {friendlyWarn && (
                    <div className="p-3 rounded-xl bg-red-50 border border-red-300 text-red-700 text-sm sm:text-base font-bold shrink-0">
                      {friendlyWarn}
                    </div>
                  )}

                  <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-3 pr-0.5 pt-1">
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                      {filteredProducts.map(p => {
                        const inCartQty = cart.find(c => c.product_id === p.id)?.quantity || 0;
                        const outOfStock = status === 'completed' && p.stock <= 0;
                        return (
                          <button
                            key={p.id}
                            type="button"
                            onClick={() => addOne(p)}
                            className={`relative min-h-[96px] p-3.5 rounded-2xl border-2 text-left flex flex-col justify-between transition shadow-sm ${
                              outOfStock
                                ? 'bg-slate-100 border-slate-300 opacity-75'
                                : inCartQty > 0
                                ? 'bg-blue-50 border-blue-700 shadow-md'
                                : 'bg-white border-slate-200 hover:border-blue-600'
                            }`}
                          >
                            {inCartQty > 0 && (
                              <span className="absolute -top-2 -right-2 min-w-[28px] h-7 px-2 rounded-full bg-red-600 text-white text-sm font-extrabold flex items-center justify-center shadow">
                                {inCartQty}
                              </span>
                            )}
                            <div className="text-base font-extrabold text-slate-900 leading-snug line-clamp-2 pr-2">
                              {p.name}
                            </div>
                            <div className="mt-2 flex items-end justify-between gap-1.5">
                              <span className="text-base font-extrabold text-blue-700">{formatTien(p.selling_price)}</span>
                              <span className={`text-sm font-bold ${p.stock <= p.low_stock_threshold ? 'text-red-600' : 'text-slate-600'}`}>
                                Còn {p.stock}
                              </span>
                            </div>
                          </button>
                        );
                      })}
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                      <button
                        type="button"
                        onClick={() => setShowOptions(!showOptions)}
                        className="w-full min-h-[46px] px-4 py-2 flex items-center justify-between text-sm sm:text-base font-bold text-blue-800"
                      >
                        <span>Thông tin thêm (Tên khách, ngày bán, chờ giao)</span>
                        <span>{showOptions ? '▲' : '▼'}</span>
                      </button>
                      {showOptions && (
                        <div className="p-4 pt-2 border-t border-slate-200 space-y-3">
                          <div>
                            <label className="block text-sm font-bold text-slate-800 mb-1">Tên khách hàng (không bắt buộc)</label>
                            <input
                              value={customerName}
                              onChange={e => setCustomerName(e.target.value)}
                              placeholder="Mặc định: Khách lẻ"
                              className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base"
                            />
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                              <label className="block text-sm font-bold text-slate-800 mb-1">Ngày bán</label>
                              <input
                                type="date"
                                value={orderDate}
                                onChange={e => setOrderDate(e.target.value)}
                                className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base"
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-bold text-slate-800 mb-1">Trạng thái đơn</label>
                              <select
                                value={status}
                                onChange={e => setStatus(e.target.value)}
                                className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base font-bold"
                              >
                                <option value="completed">Đã hoàn tất (Thu tiền ngay)</option>
                                <option value="pending">Chờ giao hàng (Chưa thu tiền)</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* GIỎ HÀNG GHIM ĐÁY */}
                  <div className="shrink-0 bg-white border-2 border-blue-700 rounded-2xl p-3 sm:p-3.5 shadow-lg space-y-2.5">
                    {cart.length === 0 ? (
                      <div className="text-center text-base font-bold text-slate-600 py-1.5">
                        Chạm vào sản phẩm phía trên để thêm vào đơn hàng
                      </div>
                    ) : (
                      <>
                        <div className="max-h-28 overflow-y-auto scrollbar-thin space-y-2 pr-1">
                          {cart.map(item => {
                            const prod = products.find(p => p.id === item.product_id);
                            if (!prod) return null;
                            return (
                              <div key={item.product_id} className="flex items-center justify-between gap-2 bg-blue-50/80 px-3 py-2 rounded-xl">
                                <div className="min-w-0 flex-1">
                                  <div className="text-sm sm:text-base font-extrabold text-slate-900 truncate">{prod.name}</div>
                                  <div className="text-sm font-bold text-blue-700">{formatTien(prod.selling_price * item.quantity)}</div>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                  <button
                                    type="button"
                                    onClick={() => changeCartQty(item.product_id, -1)}
                                    className="w-10 h-10 rounded-xl bg-white border-2 border-slate-300 text-lg font-extrabold text-slate-900 flex items-center justify-center"
                                  >
                                    −
                                  </button>
                                  <span className="min-w-[24px] text-center text-base font-extrabold text-slate-900">{item.quantity}</span>
                                  <button
                                    type="button"
                                    onClick={() => changeCartQty(item.product_id, 1)}
                                    className="w-10 h-10 rounded-xl bg-blue-700 text-lg font-extrabold text-white flex items-center justify-center"
                                  >
                                    +
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        <button
                          type="button"
                          onClick={submitOrder}
                          disabled={saving}
                          className="w-full min-h-[52px] py-2.5 px-5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-base sm:text-lg font-extrabold shadow-md transition disabled:opacity-50"
                        >
                          {saving
                            ? 'Đang lưu đơn hàng...'
                            : status === 'pending'
                            ? `Lưu đơn chờ giao (${totalQty} món) • ${formatTien(totalAmount)}`
                            : `Hoàn tất • Thu ${formatTien(totalAmount)}`}
                        </button>
                      </>
                    )}
                  </div>
                </>
              )}
            </>
          )}

          {subTab === 'list' && (
            <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-3 pr-0.5">
              {orders.length === 0 ? (
                <div className="bg-white rounded-2xl p-6 border-2 border-slate-200 text-center text-base text-slate-600">
                  Chưa có đơn hàng nào được ghi nhận.
                </div>
              ) : (
                orders.map(o => {
                  const totalRev = o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0);
                  return (
                    <div key={o.id} className="bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm space-y-3">
                      <div className="flex flex-wrap items-start justify-between gap-2">
                        <div>
                          <div className="text-lg font-extrabold text-slate-900">{o.customer_name || 'Khách lẻ'}</div>
                          <div className="text-sm text-slate-600">Ngày: {o.order_date}</div>
                        </div>
                        <div className={`text-xl font-black ${o.status === 'cancelled' ? 'line-through text-slate-500' : 'text-blue-700'}`}>
                          {formatTien(totalRev)}
                        </div>
                      </div>

                      <div className="bg-slate-50 rounded-xl p-3 space-y-1.5">
                        {o.items.map((it, idx) => (
                          <div key={idx} className="text-sm sm:text-base text-slate-800 flex justify-between gap-2">
                            <span>{it.name} × <strong>{it.quantity}</strong></span>
                            <span className="font-bold">{formatTien(it.quantity * it.unit_price)}</span>
                          </div>
                        ))}
                      </div>

                      <div className="flex items-center justify-between gap-2">
                        <span className="text-sm sm:text-base font-bold text-slate-700">Trạng thái:</span>
                        <select
                          value={o.status}
                          onChange={e => onChangeStatus(o.id, e.target.value)}
                          className={`min-h-[44px] px-3.5 py-1.5 border-2 rounded-xl text-sm sm:text-base font-extrabold ${
                            o.status === 'completed' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' :
                            o.status === 'pending' ? 'bg-amber-50 border-amber-300 text-amber-800' :
                            'bg-slate-100 border-slate-300 text-slate-700'
                          }`}
                        >
                          <option value="completed">{ORDER_STATUS_LABEL.completed}</option>
                          <option value="pending">{ORDER_STATUS_LABEL.pending}</option>
                          <option value="cancelled">{ORDER_STATUS_LABEL.cancelled}</option>
                        </select>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. TRANG HÀNG HÓA
    // ==========================================
    function ProductsView({ products, onAddProduct, onUpdateProduct, onDeleteProduct }) {
      const [form, setForm] = useState({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
      const [editingId, setEditingId] = useState(null);
      const [showOptions, setShowOptions] = useState(false);
      const [search, setSearch] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [pendingConfirm, setPendingConfirm] = useState(null);
      const scrollRef = useRef(null);

      const filteredProducts = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return products;
        return products.filter(p => p.name.toLowerCase().includes(q));
      }, [products, search]);

      const formSellNum = parseDigits(form.selling_price);
      const formCostNum = parseDigits(form.cost_price);
      const isFormSellingAtLoss = form.cost_price !== '' && form.selling_price !== '' && formSellNum < formCostNum;

      const commitSave = async (payload) => {
        const ok = editingId
          ? await onUpdateProduct({ ...payload, id: editingId })
          : await onAddProduct(payload);
        if (ok) {
          setEditingId(null);
          setForm({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
          setShowOptions(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const sellNum = parseDigits(form.selling_price);
        const costNum = parseDigits(form.cost_price);
        const stockNum = parseDigits(form.stock);
        const thresholdNum = form.low_stock_threshold === '' ? 10 : parseDigits(form.low_stock_threshold);

        if (!form.name.trim()) return alert('Vui lòng nhập tên sản phẩm.');
        if (!form.cost_price || !form.selling_price) return alert('Vui lòng nhập đầy đủ giá nhập và giá bán.');

        const payload = {
          name: form.name.trim(),
          selling_price: sellNum,
          cost_price: costNum,
          stock: stockNum,
          low_stock_threshold: thresholdNum
        };

        if (sellNum < costNum) {
          setPendingConfirm({
            payload,
            title: 'Lưu ý: Giá bán thấp hơn giá nhập',
            message: `Giá bán (${formatTien(sellNum)}) đang thấp hơn giá nhập (${formatTien(costNum)}). Bán sản phẩm "${payload.name}" sẽ lỗ ${formatTien(costNum - sellNum)} mỗi đơn vị. Quý khách vẫn muốn lưu?`,
            danger: true
          });
          return;
        }

        if (sellNum >= 10000000 || costNum >= 10000000) {
          setPendingConfirm({
            payload,
            title: 'Xác nhận lại mức giá',
            message: `Quý khách đã nhập giá bán ${formatTien(sellNum)} và giá nhập ${formatTien(costNum)}. Thông tin này đã chính xác chưa?`,
            danger: false
          });
          return;
        }
        await commitSave(payload);
      };

      const startEdit = (p) => {
        setEditingId(p.id);
        setForm({
          name: p.name,
          cost_price: String(Math.round(p.cost_price)),
          selling_price: String(Math.round(p.selling_price)),
          stock: String(p.stock),
          low_stock_threshold: String(p.low_stock_threshold)
        });
        scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div ref={scrollRef} className="h-full overflow-y-auto scrollbar-thin space-y-4 pr-0.5">
          {/* FORM THÊM / SỬA HÀNG HÓA */}
          <div className="bg-white p-4 sm:p-5 rounded-2xl border-2 border-slate-200 shadow-sm">
            <h2 className="text-lg font-extrabold text-slate-900 mb-3.5">
              {editingId ? 'Cập nhật thông tin sản phẩm' : 'Thêm sản phẩm mới'}
            </h2>
            <form onSubmit={handleSubmit} className="space-y-3.5">
              <div>
                <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">1. Tên sản phẩm</label>
                <input
                  required
                  placeholder="Ví dụ: Nước suối Aquafina 500ml"
                  value={form.name}
                  onChange={e => setForm({ ...form, name: e.target.value })}
                  className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base focus:outline-none focus:border-blue-700"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">2. Giá nhập</label>
                  <MoneyInput
                    required
                    placeholder="3.500"
                    value={form.cost_price}
                    onChange={val => setForm({ ...form, cost_price: val })}
                  />
                </div>
                <div>
                  <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">3. Giá bán</label>
                  <MoneyInput
                    required
                    placeholder="5.000"
                    value={form.selling_price}
                    onChange={val => setForm({ ...form, selling_price: val })}
                    className={isFormSellingAtLoss ? 'border-red-500 focus:border-red-600' : ''}
                  />
                </div>
              </div>

              {isFormSellingAtLoss && (
                <div className="p-3.5 rounded-xl bg-red-50 border border-red-300 text-red-700 text-sm sm:text-base font-extrabold leading-snug">
                  Lưu ý: Giá bán ({formatTien(formSellNum)}) đang thấp hơn giá nhập ({formatTien(formCostNum)}), chênh lệch lỗ {formatTien(formCostNum - formSellNum)} mỗi sản phẩm.
                </div>
              )}

              <div>
                <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">Số lượng hiện có trong kho</label>
                <input
                  type="text"
                  inputMode="numeric"
                  placeholder="Ví dụ: 24"
                  value={form.stock}
                  onChange={e => setForm({ ...form, stock: e.target.value.replace(/\D/g, '') })}
                  className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-lg font-bold focus:outline-none focus:border-blue-700"
                />
              </div>

              <div className="rounded-2xl border border-slate-200 bg-slate-50 overflow-hidden">
                <button
                  type="button"
                  onClick={() => setShowOptions(!showOptions)}
                  className="w-full min-h-[46px] px-4 py-2 flex items-center justify-between text-sm sm:text-base font-bold text-blue-800"
                >
                  <span>Tùy chọn nâng cao (Mức cảnh báo sắp hết)</span>
                  <span>{showOptions ? '▲' : '▼'}</span>
                </button>
                {showOptions && (
                  <div className="p-4 pt-2 border-t border-slate-200">
                    <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">
                      Cảnh báo khi tồn kho dưới (mặc định 10)
                    </label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={form.low_stock_threshold}
                      onChange={e => setForm({ ...form, low_stock_threshold: e.target.value.replace(/\D/g, '') })}
                      className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base font-bold bg-white"
                    />
                  </div>
                )}
              </div>

              <div className="flex flex-col sm:flex-row gap-2.5 pt-1">
                <button
                  type="submit"
                  className="flex-1 min-h-[50px] py-2.5 px-5 bg-blue-700 hover:bg-blue-800 text-white rounded-2xl text-base font-extrabold shadow-md"
                >
                  {editingId ? 'Lưu cập nhật' : 'Lưu sản phẩm'}
                </button>
                {editingId && (
                  <button
                    type="button"
                    onClick={() => {
                      setEditingId(null);
                      setForm({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
                    }}
                    className="min-h-[50px] px-5 py-2.5 border-2 border-slate-300 bg-slate-100 text-slate-900 rounded-2xl text-base font-bold"
                  >
                    Hủy bỏ
                  </button>
                )}
              </div>
            </form>
          </div>

          {/* DANH SÁCH HÀNG HÓA */}
          <div className="bg-white p-4 sm:p-5 rounded-2xl border-2 border-slate-200 shadow-sm space-y-3.5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <h2 className="text-lg font-extrabold text-slate-900">Danh mục hàng hóa ({products.length})</h2>
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Tìm tên sản phẩm..."
                className="w-full sm:w-64 min-h-[46px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base focus:outline-none focus:border-blue-700"
              />
            </div>

            {filteredProducts.length === 0 ? (
              <div className="text-center py-6 text-base text-slate-600">
                {products.length === 0 ? 'Chưa có sản phẩm nào trong kho.' : 'Không tìm thấy sản phẩm phù hợp.'}
              </div>
            ) : (
              <div className="space-y-3">
                {filteredProducts.map(p => (
                  <div
                    key={p.id}
                    className={`p-4 rounded-2xl border-2 space-y-3 ${
                      p.isSellingAtLoss || p.isLowStock ? 'bg-red-50/60 border-red-300' : 'bg-slate-50/70 border-slate-200'
                    }`}
                  >
                    <div className="flex flex-wrap items-start justify-between gap-2">
                      <div>
                        <div className="text-lg font-extrabold text-slate-900">{p.name}</div>
                        {p.isSellingAtLoss ? (
                          <div className="text-sm font-extrabold text-red-700 mt-0.5">
                            Giá bán thấp hơn giá nhập (Lỗ {formatTien(p.cost_price - p.selling_price)}/sản phẩm)
                          </div>
                        ) : (
                          <div className="text-sm font-bold text-emerald-700 mt-0.5">
                            Lợi nhuận {formatTien(p.unitProfit)} / sản phẩm
                          </div>
                        )}
                      </div>
                      <span className={`px-3 py-1 rounded-xl text-sm font-extrabold ${
                        p.isLowStock ? 'bg-red-600 text-white' : 'bg-white border border-slate-300 text-slate-900'
                      }`}>
                        Tồn: {p.stock}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 text-base">
                      <div className="bg-white p-3 rounded-xl border border-slate-200">
                        <div className="text-xs sm:text-sm text-slate-600">Giá nhập</div>
                        <div className="text-base font-extrabold text-slate-900">{formatTien(p.cost_price)}</div>
                      </div>
                      <div className="bg-white p-3 rounded-xl border border-slate-200">
                        <div className="text-xs sm:text-sm text-slate-600">Giá bán</div>
                        <div className={`text-base font-extrabold ${p.isSellingAtLoss ? 'text-red-600' : 'text-blue-700'}`}>
                          {formatTien(p.selling_price)}
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => startEdit(p)}
                        className="min-h-[46px] px-4 py-2 rounded-xl bg-white border-2 border-blue-300 text-blue-800 text-base font-extrabold hover:bg-blue-50"
                      >
                        Chỉnh sửa
                      </button>
                      <button
                        type="button"
                        onClick={() => setDeleteTarget(p)}
                        className="min-h-[46px] px-4 py-2 rounded-xl bg-white border-2 border-red-300 text-red-700 text-base font-extrabold hover:bg-red-50"
                      >
                        Xóa bỏ
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <ConfirmModal
            open={Boolean(deleteTarget)}
            title="Xác nhận xóa sản phẩm"
            message={deleteTarget ? `Quý khách chắc chắn muốn xóa "${deleteTarget.name}" khỏi danh mục?` : ''}
            confirmLabel="Xóa sản phẩm"
            cancelLabel="Giữ lại"
            danger={true}
            onConfirm={async () => {
              const target = deleteTarget;
              setDeleteTarget(null);
              if (target) await onDeleteProduct(target);
            }}
            onCancel={() => setDeleteTarget(null)}
          />

          <ConfirmModal
            open={Boolean(pendingConfirm)}
            title={pendingConfirm?.title || ''}
            message={pendingConfirm?.message || ''}
            confirmLabel="Xác nhận lưu"
            cancelLabel="Kiểm tra lại"
            danger={Boolean(pendingConfirm?.danger)}
            onConfirm={async () => {
              const payload = pendingConfirm?.payload;
              setPendingConfirm(null);
              if (payload) await commitSave(payload);
            }}
            onCancel={() => setPendingConfirm(null)}
          />
        </div>
      );
    }

    // ==========================================
    // 4. TRANG THU CHI
    // ==========================================
    const FINANCE_CHOICES = [
      { id: 'inventory', label: 'Nhập hàng', icon: '📦', type: 'inventory_purchase', category: 'Nhập hàng về kho' },
      { id: 'expense_electricity', label: 'Điện nước', icon: '⚡', type: 'expense', category: 'Tiền điện nước' },
      { id: 'expense_rent', label: 'Thuê mặt bằng', icon: '🏠', type: 'expense', category: 'Thuê mặt bằng' },
      { id: 'expense_ship', label: 'Vận chuyển', icon: '🚚', type: 'expense', category: 'Phí giao hàng' },
      { id: 'expense_other', label: 'Chi phí khác', icon: '📝', type: 'expense', category: 'Chi phí khác' },
      { id: 'income_other', label: 'Khoản thu khác', icon: '💵', type: 'income', category: 'Thu khác' },
    ];

    const QUICK_AMOUNTS = [50000, 100000, 200000, 500000];

    function FinanceView({ expenses, analytics, presetMode, onAddExpense, onDeleteExpense }) {
      const [subTab, setSubTab] = useState('add');
      const [selectedId, setSelectedId] = useState(presetMode || 'inventory');
      const [amount, setAmount] = useState('');
      const [expenseDate, setExpenseDate] = useState(todayStr());
      const [note, setNote] = useState('');
      const [showOptions, setShowOptions] = useState(false);
      const [saving, setSaving] = useState(false);
      const [confirmBigAmount, setConfirmBigAmount] = useState(null);
      const [deleteTx, setDeleteTx] = useState(null);

      useEffect(() => {
        if (presetMode) setSelectedId(presetMode);
      }, [presetMode]);

      const activeChoice = FINANCE_CHOICES.find(c => c.id === selectedId) || FINANCE_CHOICES[0];

      const isUnusuallyLarge = (num) => {
        if (num >= 10000000) return true;
        if (expenses.length >= 3) {
          const avg = expenses.reduce((s, e) => s + e.amount, 0) / expenses.length;
          if (avg > 0 && num >= avg * 10 && num >= 1000000) return true;
        }
        return false;
      };

      const commitSave = async (numAmount) => {
        setSaving(true);
        try {
          const ok = await onAddExpense({
            type: activeChoice.type,
            category: activeChoice.category,
            amount: numAmount,
            expense_date: expenseDate,
            note: note.trim()
          });
          if (ok) {
            setAmount('');
            setNote('');
            setExpenseDate(todayStr());
            setShowOptions(false);
          }
        } finally {
          setSaving(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (saving) return;
        const num = parseDigits(amount);
        if (num <= 0) {
          alert('Vui lòng nhập số tiền lớn hơn 0.');
          return;
        }
        if (isUnusuallyLarge(num)) {
          setConfirmBigAmount(num);
          return;
        }
        await commitSave(num);
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-3">
          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-slate-200 shrink-0">
            <button
              type="button"
              onClick={() => setSubTab('add')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${
                subTab === 'add' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              Ghi khoản mới
            </button>
            <button
              type="button"
              onClick={() => setSubTab('history')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${
                subTab === 'history' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              Lịch sử ({expenses.length})
            </button>
          </div>

          {subTab === 'add' && (
            <form onSubmit={handleSubmit} className="flex-1 min-h-0 overflow-y-auto scrollbar-thin bg-white p-4 sm:p-5 rounded-2xl border-2 border-slate-200 shadow-sm space-y-4">
              <div>
                <h2 className="text-base sm:text-lg font-extrabold text-slate-900 mb-2.5">1. Chọn hạng mục</h2>
                <div className="grid grid-cols-3 gap-2.5">
                  {FINANCE_CHOICES.map(choice => {
                    const isSelected = selectedId === choice.id;
                    return (
                      <button
                        key={choice.id}
                        type="button"
                        onClick={() => setSelectedId(choice.id)}
                        className={`min-h-[72px] p-2.5 rounded-2xl border-2 flex flex-col items-center justify-center gap-1.5 text-center transition ${
                          isSelected
                            ? 'border-blue-700 bg-blue-700 text-white shadow-md'
                            : 'border-slate-300 bg-white text-slate-900 hover:border-blue-400'
                        }`}
                      >
                        <span className="text-xl leading-none">{choice.icon}</span>
                        <span className="text-xs sm:text-sm font-extrabold leading-tight">{choice.label}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="mt-2.5 text-sm sm:text-base font-medium text-slate-700">
                  {activeChoice.type === 'inventory_purchase'
                    ? 'Tiền nhập hàng chỉ giảm tiền mặt hiện có, không tính vào chi phí lỗ của đơn bán.'
                    : activeChoice.type === 'income'
                    ? 'Khoản thu này sẽ được cộng trực tiếp vào lợi nhuận tháng.'
                    : 'Khoản chi này sẽ được khấu trừ khi tính lợi nhuận thực tế.'}
                </div>
              </div>

              <div>
                <h2 className="text-base sm:text-lg font-extrabold text-slate-900 mb-2">2. Nhập số tiền</h2>
                <MoneyInput
                  required
                  placeholder="Ví dụ: 100.000"
                  value={amount}
                  onChange={setAmount}
                />
                <div className="grid grid-cols-4 gap-2 mt-2.5">
                  {QUICK_AMOUNTS.map(val => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => setAmount(String(val))}
                      className="min-h-[44px] px-2 py-1.5 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm font-extrabold hover:bg-blue-100"
                    >
                      {val.toLocaleString('vi-VN')}
                    </button>
                  ))}
                </div>
              </div>

              <div className="rounded-2xl border border-slate-200 bg-slate-50 overflow-hidden">
                <button
                  type="button"
                  onClick={() => setShowOptions(!showOptions)}
                  className="w-full min-h-[46px] px-4 py-2 flex items-center justify-between text-sm sm:text-base font-bold text-blue-800"
                >
                  <span>Thông tin thêm (Ngày ghi, ghi chú)</span>
                  <span>{showOptions ? '▲' : '▼'}</span>
                </button>
                {showOptions && (
                  <div className="p-4 pt-2 border-t border-slate-200 space-y-3">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1">Ngày phát sinh</label>
                      <input
                        type="date"
                        value={expenseDate}
                        onChange={e => setExpenseDate(e.target.value)}
                        className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1">Ghi chú (không bắt buộc)</label>
                      <input
                        value={note}
                        onChange={e => setNote(e.target.value)}
                        placeholder="Ví dụ: Thanh toán hóa đơn điện tháng này"
                        className="w-full min-h-[46px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base bg-white"
                      />
                    </div>
                  </div>
                )}
              </div>

              <button
                type="submit"
                disabled={saving}
                className="w-full min-h-[52px] py-3 px-5 bg-blue-700 hover:bg-blue-800 text-white rounded-2xl text-base sm:text-lg font-extrabold shadow-md disabled:opacity-50"
              >
                {saving ? 'Đang lưu...' : `Lưu khoản ${activeChoice.label.toLowerCase()}`}
              </button>
            </form>
          )}

          {subTab === 'history' && (
            <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-3 pr-0.5">
              <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 flex flex-wrap items-center justify-between gap-2 text-base">
                <span>Lợi nhuận tháng: <strong className="text-emerald-700">{formatTien(analytics.thisM.netProfit)}</strong></span>
                <span>Tiền mặt thực có: <strong className="text-blue-700">{formatTien(analytics.thisM.cashFlow)}</strong></span>
              </div>

              {expenses.length === 0 ? (
                <div className="bg-white p-6 rounded-2xl border-2 border-slate-200 text-center text-base text-slate-600">
                  Chưa có khoản thu chi nào được ghi nhận.
                </div>
              ) : (
                <div className="space-y-2.5">
                  {expenses.map(e => (
                    <div key={e.id} className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <div className="text-base font-extrabold text-slate-900">{e.category}</div>
                        <div className="text-sm text-slate-600">
                          {e.expense_date}{e.note ? ` • ${e.note}` : ''}
                        </div>
                      </div>
                      <div className="flex items-center gap-2.5 shrink-0">
                        <span className={`text-base font-extrabold ${e.type === 'income' ? 'text-emerald-700' : 'text-red-600'}`}>
                          {e.type === 'income' ? '+' : '-'}{formatTien(e.amount)}
                        </span>
                        <button
                          type="button"
                          onClick={() => setDeleteTx(e)}
                          className="min-h-[42px] px-3 rounded-xl border border-red-200 text-red-700 text-sm font-bold hover:bg-red-50"
                        >
                          Xóa
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <ConfirmModal
            open={confirmBigAmount !== null}
            title="Xác nhận số tiền lớn"
            message={confirmBigAmount !== null ? `Quý khách đã nhập ${formatTien(confirmBigAmount)}. Số tiền này đã chính xác chưa?` : ''}
            confirmLabel="Chính xác, lưu ngay"
            cancelLabel="Nhập lại"
            onConfirm={async () => {
              const num = confirmBigAmount;
              setConfirmBigAmount(null);
              if (num) await commitSave(num);
            }}
            onCancel={() => setConfirmBigAmount(null)}
          />

          <ConfirmModal
            open={Boolean(deleteTx)}
            title="Xác nhận xóa giao dịch"
            message={deleteTx ? `Quý khách muốn xóa "${deleteTx.category} (${formatTien(deleteTx.amount)})"?` : ''}
            confirmLabel="Xóa giao dịch"
            cancelLabel="Giữ lại"
            danger={true}
            onConfirm={async () => {
              const tx = deleteTx;
              setDeleteTx(null);
              if (tx) await onDeleteExpense(tx.id);
            }}
            onCancel={() => setDeleteTx(null)}
          />
        </div>
      );
    }

    // ==========================================
    // 4B. TRANG NGÂN HÀNG
    // ==========================================
    const BANK_BTN_IN = [
      { action: 'sale', label: 'Tiền bán hàng', icon: '🛒' },
      { action: 'income_other', label: 'Thu khác', icon: '💵' },
    ];
    const BANK_BTN_OUT = [
      { action: 'inventory', label: 'Nhập hàng', icon: '📦' },
      { action: 'electricity', label: 'Điện nước', icon: '⚡' },
      { action: 'rent', label: 'Mặt bằng', icon: '🏠' },
      { action: 'ship', label: 'Vận chuyển', icon: '🚚' },
      { action: 'expense_other', label: 'Chi khác', icon: '📝' },
    ];

    function BankLinkBox() {
      const [linked, setLinked] = useState(null);
      const [claim, setClaim] = useState(null);
      const [acc, setAcc] = useState('');
      const [bank, setBank] = useState('');
      const [saving, setSaving] = useState(false);
      const [copied, setCopied] = useState(false);

      const checkLinked = async () => {
        const { data } = await sb.from('bank_links').select('account_number');
        const ok = (data || []).length > 0;
        setLinked(ok);
        return ok;
      };

      useEffect(() => {
        (async () => {
          const ok = await checkLinked();
          if (ok) return;
          const { data } = await sb
            .from('bank_link_claims')
            .select('code, account_number')
            .eq('status', 'pending')
            .gt('expires_at', new Date().toISOString())
            .order('created_at', { ascending: false })
            .limit(1);
          if (data && data[0]) setClaim(data[0]);
        })();
      }, []);

      useEffect(() => {
        if (!claim || linked) return;
        const t = setInterval(checkLinked, 5000);
        return () => clearInterval(t);
      }, [claim, linked]);

      if (linked === null || linked) return null;

      const start = async (e) => {
        e.preventDefault();
        if (saving) return;
        setSaving(true);
        const { data, error } = await sb.rpc('start_bank_link', { p_account: acc, p_bank: bank });
        setSaving(false);
        if (error) { alert(error.message || 'Không thể tạo mã xác minh. Vui lòng thử lại.'); return; }
        setClaim({ code: data.code, account_number: acc });
      };

      const copyCode = async () => {
        try { await navigator.clipboard.writeText(claim.code); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch {}
      };

      if (claim) {
        return (
          <div className="bg-white p-4 rounded-2xl border-2 border-amber-300 space-y-3 shrink-0">
            <div className="text-base font-extrabold text-slate-900">
              Xác minh tài khoản {claim.account_number}
            </div>
            <div className="text-sm sm:text-base text-slate-700 leading-relaxed">
              Vui lòng chuyển <strong>1.000đ từ chính tài khoản này</strong> sang tài khoản bất kỳ với nội dung chuyển khoản chỉ ghi đúng mã dưới đây:
            </div>
            <button
              type="button"
              onClick={copyCode}
              className="w-full min-h-[56px] rounded-xl bg-amber-50 border-2 border-amber-300 text-2xl font-extrabold tracking-widest text-amber-800"
            >
              {claim.code}
            </button>
            <div className="text-sm font-bold text-slate-600 text-center">
              {copied ? 'Đã sao chép mã' : 'Chạm vào mã để sao chép'} • Đang chờ ngân hàng xác nhận...
            </div>
            <button
              type="button"
              onClick={() => setClaim(null)}
              className="w-full min-h-[44px] rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 text-sm sm:text-base font-bold"
            >
              ← Đổi số tài khoản khác
            </button>
          </div>
        );
      }

      return (
        <form onSubmit={start} className="bg-white p-4 rounded-2xl border-2 border-blue-200 space-y-3 shrink-0">
          <div className="text-base font-extrabold text-slate-900">Liên kết tài khoản ngân hàng</div>
          <input
            required
            inputMode="numeric"
            value={acc}
            onChange={e => setAcc(e.target.value.replace(/\D/g, ''))}
            placeholder="Số tài khoản ngân hàng"
            className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base font-bold"
          />
          <input
            value={bank}
            onChange={e => setBank(e.target.value)}
            placeholder="Tên ngân hàng (ví dụ: MBBank)"
            className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base"
          />
          <button
            type="submit"
            disabled={saving}
            className="w-full min-h-[48px] bg-blue-700 hover:bg-blue-800 text-white rounded-2xl text-base font-extrabold disabled:opacity-50"
          >
            {saving ? 'Đang tạo mã...' : 'Lấy mã xác minh'}
          </button>
        </form>
      );
    }

    function BankInboxView({ bankTx, orders, onClassify, onUnclassify }) {
      const [tab, setTab] = useState('pending');
      const [busyId, setBusyId] = useState(null);

      const pending = bankTx.filter(t => t.status === 'pending');
      const done = bankTx.filter(t => t.status !== 'pending');
      const list = tab === 'pending' ? pending : done;

      const fmtTime = (iso) => new Date(iso).toLocaleString('vi-VN', {
        hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
      });

      const act = async (id, action) => {
        if (busyId) return;
        setBusyId(id);
        try { await onClassify(id, action); } finally { setBusyId(null); }
      };

      const doneLabel = (t) => {
        if (t.status === 'matched_order') return 'Đã đối soát đơn hàng';
        if (t.status === 'ignored') return 'Đã bỏ qua';
        if (t.status === 'recorded') return `${t.category || 'Đã ghi nhận tự động'}`;
        return `${t.category || 'Đã phân loại'}`;
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-3">
          <BankLinkBox />

          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-slate-200 shrink-0">
            <button type="button" onClick={() => setTab('pending')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${tab === 'pending' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'}`}>
              Chờ phân loại ({pending.length})
            </button>
            <button type="button" onClick={() => setTab('done')}
              className={`min-h-[48px] rounded-xl text-base font-extrabold transition ${tab === 'done' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'}`}>
              Đã xử lý ({done.length})
            </button>
          </div>

          <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-3 pr-0.5">
            {list.length === 0 ? (
              <div className="bg-white rounded-2xl p-6 border-2 border-slate-200 text-center text-base text-slate-600">
                {tab === 'pending' ? 'Hiện không còn giao dịch nào chờ phân loại.' : 'Chưa có giao dịch nào.'}
              </div>
            ) : list.map(t => {
              const isIn = t.direction === 'in';
              const matchedOrder = t.linked_order_id ? orders.find(o => o.id === t.linked_order_id) : null;
              const buttons = isIn ? BANK_BTN_IN : BANK_BTN_OUT;
              return (
                <div key={t.id} className={`bg-white rounded-2xl p-4 border-2 shadow-sm space-y-3 ${isIn ? 'border-emerald-300' : 'border-red-300'}`}>
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="text-sm font-bold text-slate-600">
                        {isIn ? 'Tiền vào' : 'Tiền ra'} • {fmtTime(t.occurred_at)}
                      </div>
                      <div className="text-sm sm:text-base text-slate-800 mt-0.5 break-words">
                        {t.content || '(Không có nội dung chuyển khoản)'}
                      </div>
                    </div>
                    <div className={`text-xl font-black shrink-0 ${isIn ? 'text-emerald-700' : 'text-red-600'}`}>
                      {isIn ? '+' : '-'}{formatTien(t.amount)}
                    </div>
                  </div>

                  {t.status === 'pending' ? (
                    <>
                      {isIn && matchedOrder && (
                        <button type="button" disabled={busyId === t.id} onClick={() => act(t.id, 'order')}
                          className="w-full min-h-[50px] rounded-xl bg-amber-100 border-2 border-amber-300 text-amber-900 text-sm sm:text-base font-extrabold disabled:opacity-50 px-3">
                          Khách thanh toán cho đơn "{matchedOrder.customer_name || 'Khách lẻ'}"
                        </button>
                      )}
                      <div className="grid grid-cols-3 gap-2">
                        {buttons.map(b => (
                          <button key={b.action} type="button" disabled={busyId === t.id} onClick={() => act(t.id, b.action)}
                            className="min-h-[64px] p-2 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-900 flex flex-col items-center justify-center gap-1 hover:bg-blue-100 disabled:opacity-50">
                            <span className="text-xl leading-none">{b.icon}</span>
                            <span className="text-xs sm:text-sm font-extrabold leading-tight">{b.label}</span>
                          </button>
                        ))}
                        <button type="button" disabled={busyId === t.id} onClick={() => act(t.id, 'ignore')}
                          className="min-h-[64px] p-2 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 flex flex-col items-center justify-center gap-1 disabled:opacity-50">
                          <span className="text-xl leading-none">🚫</span>
                          <span className="text-xs sm:text-sm font-extrabold leading-tight">Bỏ qua</span>
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-sm sm:text-base font-bold text-slate-700">{doneLabel(t)}</span>
                      {t.status !== 'recorded' && (
                        <button type="button" onClick={() => onUnclassify(t.id)}
                          className="min-h-[42px] px-3.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-sm font-bold">
                          Hoàn tác
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. TRANG TRỢ LÝ AI
    // ==========================================
    function AIIntelligenceView({ analytics }) {
      const { todayStats, thisM, lastM, lowStockProducts, lowMarginProducts } = analytics;
      const [messages, setMessages] = useState([
        {
          role: 'ai',
          text: `Kính chào quý khách. Số liệu tháng ${thisM.monthKey} cho thấy lợi nhuận hôm nay đạt ${formatTien(todayStats.netProfit)} và lợi nhuận tích lũy tháng này đạt ${formatTien(thisM.netProfit)}. Quý khách có thể chọn nhanh một câu hỏi gợi ý bên dưới để xem phân tích chi tiết.`
        }
      ]);
      const [input, setInput] = useState('');
      const [thinking, setThinking] = useState(false);

      const chatContainerRef = useRef(null);
      const lastMsgRef = useRef(null);

      useEffect(() => {
        const container = chatContainerRef.current;
        if (!container) return;

        requestAnimationFrame(() => {
          const lastMsg = messages[messages.length - 1];
          const lastEl = lastMsgRef.current;
          if (!thinking && lastMsg?.role === 'ai' && lastEl && lastEl.offsetHeight > container.clientHeight * 0.85) {
            container.scrollTo({
              top: Math.max(0, lastEl.offsetTop - 12),
              behavior: 'smooth'
            });
          } else {
            container.scrollTo({
              top: container.scrollHeight,
              behavior: 'smooth'
            });
          }
        });
      }, [messages, thinking]);

      const generateSimpleAnswer = (q) => {
        const lower = q.toLowerCase();

        if (/^(xin )?chào|^hello|^hi\b/.test(lower)) {
          return 'Kính chào quý khách. Tôi là trợ lý phân tích kinh doanh của cửa hàng. Quý khách có thể hỏi về tình hình lợi nhuận, lượng hàng sắp hết hoặc dòng tiền mặt hiện có.';
        }

        if (lower.includes('tiền mặt') || lower.includes('trong ví') || lower.includes('trong két') || lower.includes('khác')) {
          return `Tháng này lợi nhuận đạt ${formatTien(thisM.netProfit)}, trong khi tiền mặt thực có là ${formatTien(thisM.cashFlow)}. Nguyên nhân là cửa hàng đã chi ${formatTien(thisM.inventoryCashOut)} để nhập thêm hàng vào kho; lượng hàng này chưa bán ra nên chưa tính vào chi phí lỗ. Đề xuất: Quý khách theo dõi nhóm hàng mới nhập trong mục Hàng hóa để đẩy nhanh vòng quay tiền mặt.`;
        }

        if (lower.includes('tồn') || lower.includes('hết hàng') || lower.includes('nhập thêm') || lower.includes('sắp hết')) {
          if (lowStockProducts.length === 0) {
            return 'Toàn bộ sản phẩm trong kho hiện đều ở mức an toàn, chưa có mặt hàng nào cần nhập gấp trong hôm nay.';
          }
          const topNames = lowStockProducts.slice(0, 3).map(p => `${p.name} (còn ${p.stock})`).join(', ');
          return `Hiện có ${lowStockProducts.length} mặt hàng dưới mức tồn kho tối thiểu, gồm: ${topNames}. Đề xuất: Quý khách mở mục Hàng hóa để lên kế hoạch nhập bổ sung kịp thời, tránh gián đoạn bán hàng.`;
        }

        if (lower.includes('lãi') || lower.includes('lời') || lower.includes('thay đổi') || lower.includes('tăng') || lower.includes('giảm')) {
          const diff = thisM.netProfit - lastM.netProfit;
          const direction = diff >= 0 ? `cao hơn tháng trước ${formatTien(diff)}` : `thấp hơn tháng trước ${formatTien(Math.abs(diff))}`;
          const thinNote = lowMarginProducts.length > 0
            ? `Đáng chú ý, sản phẩm ${lowMarginProducts[0].name} đang có mức lãi khá mỏng.`
            : `Tổng chi phí vận hành tháng này là ${formatTien(thisM.opex)}.`;
          return `Tháng này cửa hàng đạt doanh thu ${formatTien(thisM.revenue)} và lợi nhuận ${formatTien(thisM.netProfit)}, ${direction}. ${thinNote} Đề xuất: Quý khách rà soát lại các khoản chi trong mục Thu chi để tối ưu lợi nhuận.`;
        }

        return `Tổng hợp tháng này: Doanh thu ${formatTien(thisM.revenue)}, lợi nhuận thực tế ${formatTien(thisM.netProfit)} và tiền mặt còn ${formatTien(thisM.cashFlow)}. Hiện có ${lowStockProducts.length} mặt hàng sắp hết trong kho.`;
      };

      const sendMessage = async (text) => {
        const q = (text || input).trim();
        if (!q || thinking) return;
        setMessages(prev => [...prev, { role: 'user', text: q }]);
        setInput('');

        const fallbackReply = () => generateSimpleAnswer(q);

        if (window.ENABLE_AI_EDGE_FUNCTION) {
          setThinking(true);
          try {
            const { data, error } = await sb.functions.invoke('ai-advisor', {
              body: {
                question: `${q} (Trả lời tối đa 3 câu súc tích, lịch sự, dễ hiểu cho người lớn tuổi, tránh thuật ngữ chuyên môn phức tạp, kết thúc bằng 1 gợi ý hành động cụ thể.)`,
                context: {
                  todayStats,
                  thisM,
                  lastM,
                  lowStockProducts: lowStockProducts.map(p => ({ name: p.name, stock: p.stock, threshold: p.low_stock_threshold })),
                  lowMarginProducts: lowMarginProducts.map(p => ({ name: p.name, profitPer100: p.profitPer100 }))
                }
              }
            });

            if (!error && data?.reply) {
              setMessages(prev => [...prev, { role: 'ai', text: data.reply }]);
              return;
            }

            console.error('Lỗi gọi trợ lý AI:', error, data);
            setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
          } catch (err) {
            console.error('Lỗi gọi trợ lý AI:', err);
            setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
          } finally {
            setThinking(false);
          }
          return;
        }

        setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
      };

      const quickQuestions = [
        'Vì sao lợi nhuận tháng này thay đổi?',
        'Những mặt hàng nào sắp hết?',
        'Vì sao tiền mặt khác với lợi nhuận?'
      ];

      return (
        <div className="h-full flex flex-col min-h-0">
          <div className="flex-1 min-h-0 bg-white rounded-2xl border-2 border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <div ref={chatContainerRef} className="flex-1 min-h-0 overflow-y-auto p-4 space-y-3.5 scrollbar-thin">
              {messages.map((m, idx) => {
                const isLast = idx === messages.length - 1;
                return (
                  <div
                    key={idx}
                    ref={isLast ? lastMsgRef : null}
                    className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div className={`max-w-[92%] sm:max-w-[85%] rounded-2xl px-4 py-3 text-base leading-relaxed whitespace-pre-line ${
                      m.role === 'user'
                        ? 'bg-blue-700 text-white font-bold shadow-sm'
                        : 'bg-blue-50 text-slate-900 border border-blue-200'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                );
              })}
              {thinking && (
                <div className="flex justify-start">
                  <div className="rounded-2xl px-4 py-2.5 text-base font-bold bg-blue-50 text-blue-800 border border-blue-200">
                    Đang phân tích dữ liệu cửa hàng...
                  </div>
                </div>
              )}
            </div>

            <div className="shrink-0 p-3 border-t border-slate-200 bg-slate-50 space-y-2">
              <div className="text-sm font-extrabold text-slate-800">Câu hỏi gợi ý:</div>
              <div className="flex flex-col sm:flex-row flex-wrap gap-2">
                {quickQuestions.map((q, i) => (
                  <button
                    key={i}
                    type="button"
                    onClick={() => sendMessage(q)}
                    disabled={thinking}
                    className="text-left px-3.5 py-2 rounded-xl bg-white text-blue-900 border border-blue-300 hover:bg-blue-50 text-sm sm:text-base font-bold transition disabled:opacity-50"
                  >
                    {q}
                  </button>
                ))}
              </div>
            </div>

            <form onSubmit={e => { e.preventDefault(); sendMessage(); }} className="shrink-0 p-3 border-t border-slate-200 flex gap-2 bg-white">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Nhập câu hỏi tại đây..."
                className="flex-1 min-w-0 min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base focus:outline-none focus:border-blue-700"
              />
              <button
                type="submit"
                disabled={thinking}
                className="min-h-[48px] px-5 py-2 brand-gradient-btn text-white rounded-2xl text-base font-extrabold shrink-0 disabled:opacity-50"
              >
                Gửi
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
