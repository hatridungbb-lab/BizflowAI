                                  <span className="min-w-[20px] text-center text-sm font-extrabold text-slate-900">{item.quantity}</span>
                                  <button
                                    type="button"
                                    onClick={() => changeCartQty(item.product_id, 1)}
                                    className="w-8 h-8 rounded-lg bg-blue-700 text-base font-extrabold text-white flex items-center justify-center"
                                  >
                                    +
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        <button
                          type="button"
                          onClick={submitOrder}
                          disabled={saving}
                          className="w-full min-h-[46px] py-2 px-4 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm sm:text-base font-extrabold shadow-md transition disabled:opacity-50"
                        >
                          {saving
                            ? 'Đang lưu đơn...'
                            : status === 'pending'
                            ? `Lưu đơn chờ giao (${totalQty} món) - ${formatTien(totalAmount)}`
                            : `Xong - Thu ${formatTien(totalAmount)}`}
                        </button>
                      </>
                    )}
                  </div>
                </>
              )}
            </>
          )}

          {subTab === 'list' && (
            <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-2.5 pr-0.5">
              {orders.length === 0 ? (
                <div className="bg-white rounded-2xl p-6 border-2 border-blue-100 text-center text-sm sm:text-base text-slate-600">
                  Chưa có đơn hàng nào được ghi.
                </div>
              ) : (
                orders.map(o => {
                  const totalRev = o.items.reduce((s, i) => s + i.quantity * i.unit_price, 0);
                  return (
                    <div key={o.id} className="bg-white rounded-2xl p-3.5 sm:p-4 border-2 border-blue-100 shadow-sm space-y-2.5">
                      <div className="flex flex-wrap items-start justify-between gap-2">
                        <div>
                          <div className="text-base sm:text-lg font-extrabold text-slate-900">{o.customer_name || 'Khách lẻ'}</div>
                          <div className="text-xs sm:text-sm text-slate-600">Ngày: {o.order_date}</div>
                        </div>
                        <div className={`text-lg sm:text-xl font-extrabold ${o.status === 'cancelled' ? 'line-through text-slate-500' : 'text-blue-700'}`}>
                          {formatTien(totalRev)}
                        </div>
                      </div>

                      <div className="bg-blue-50/70 rounded-xl p-2.5 space-y-1">
                        {o.items.map((it, idx) => (
                          <div key={idx} className="text-xs sm:text-sm text-slate-800 flex justify-between gap-2">
                            <span>{it.name} × <strong>{it.quantity}</strong></span>
                            <span className="font-bold">{formatTien(it.quantity * it.unit_price)}</span>
                          </div>
                        ))}
                      </div>

                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs sm:text-sm font-bold text-slate-700">Trạng thái:</span>
                        <select
                          value={o.status}
                          onChange={e => onChangeStatus(o.id, e.target.value)}
                          className={`min-h-[40px] px-3 py-1.5 border-2 rounded-xl text-xs sm:text-sm font-extrabold ${
                            o.status === 'completed' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' :
                            o.status === 'pending' ? 'bg-amber-50 border-amber-300 text-amber-800' :
                            'bg-slate-100 border-slate-300 text-slate-700'
                          }`}
                        >
                          <option value="completed">{ORDER_STATUS_LABEL.completed}</option>
                          <option value="pending">{ORDER_STATUS_LABEL.pending}</option>
                          <option value="cancelled">{ORDER_STATUS_LABEL.cancelled}</option>
                        </select>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. TRANG HÀNG HÓA (GỌN ĐẸP + CẢNH BÁO GIÁ BÁN < GIÁ NHẬP)
    // ==========================================
    function ProductsView({ products, onAddProduct, onUpdateProduct, onDeleteProduct }) {
      const [form, setForm] = useState({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
      const [editingId, setEditingId] = useState(null);
      const [showOptions, setShowOptions] = useState(false);
      const [search, setSearch] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [pendingConfirm, setPendingConfirm] = useState(null);
      const scrollRef = useRef(null);

      const filteredProducts = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return products;
        return products.filter(p => p.name.toLowerCase().includes(q));
      }, [products, search]);

      const formSellNum = parseDigits(form.selling_price);
      const formCostNum = parseDigits(form.cost_price);
      const isFormSellingAtLoss = form.cost_price !== '' && form.selling_price !== '' && formSellNum < formCostNum;

      const commitSave = async (payload) => {
        const ok = editingId
          ? await onUpdateProduct({ ...payload, id: editingId })
          : await onAddProduct(payload);
        if (ok) {
          setEditingId(null);
          setForm({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
          setShowOptions(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const sellNum = parseDigits(form.selling_price);
        const costNum = parseDigits(form.cost_price);
        const stockNum = parseDigits(form.stock);
        const thresholdNum = form.low_stock_threshold === '' ? 10 : parseDigits(form.low_stock_threshold);

        if (!form.name.trim()) return alert('Bạn hãy nhập tên món hàng nhé.');
        if (!form.cost_price || !form.selling_price) return alert('Bạn hãy nhập đủ giá nhập và giá bán nhé.');

        const payload = {
          name: form.name.trim(),
          selling_price: sellNum,
          cost_price: costNum,
          stock: stockNum,
          low_stock_threshold: thresholdNum
        };

        if (sellNum < costNum) {
          setPendingConfirm({
            payload,
            title: '⚠️ Giá bán thấp hơn giá nhập!',
            message: `Bạn đang nhập giá bán (${formatTien(sellNum)}) thấp hơn giá nhập (${formatTien(costNum)}). Bán món "${payload.name}" sẽ bị lỗ ${formatTien(costNum - sellNum)} mỗi món. Bạn vẫn muốn lưu chứ?`,
            danger: true
          });
          return;
        }

        if (sellNum >= 10000000 || costNum >= 10000000) {
          setPendingConfirm({
            payload,
            title: 'Kiểm tra lại giá tiền',
            message: `Bạn nhập giá bán ${formatTien(sellNum)} và giá nhập ${formatTien(costNum)}, đúng không?`,
            danger: false
          });
          return;
        }
        await commitSave(payload);
      };

      const startEdit = (p) => {
        setEditingId(p.id);
        setForm({
          name: p.name,
          cost_price: String(Math.round(p.cost_price)),
          selling_price: String(Math.round(p.selling_price)),
          stock: String(p.stock),
          low_stock_threshold: String(p.low_stock_threshold)
        });
        scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div ref={scrollRef} className="h-full overflow-y-auto scrollbar-thin space-y-4 pr-0.5">
          {/* FORM THÊM / SỬA HÀNG HÓA */}
          <div className="bg-white p-4 sm:p-5 rounded-2xl border-2 border-blue-100 shadow-sm">
            <h2 className="text-base sm:text-lg font-extrabold text-slate-900 mb-3">
              {editingId ? '✏️ Sửa món hàng' : '➕ Thêm món hàng mới'}
            </h2>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">1. Tên món hàng (bắt buộc)</label>
                <input
                  required
                  placeholder="Ví dụ: Nước suối Aquafina"
                  value={form.name}
                  onChange={e => setForm({ ...form, name: e.target.value })}
                  className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base focus:outline-none focus:border-blue-700"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">2. Giá nhập</label>
                  <MoneyInput
                    required
                    placeholder="3.500"
                    value={form.cost_price}
                    onChange={val => setForm({ ...form, cost_price: val })}
                  />
                </div>
                <div>
                  <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">3. Giá bán</label>
                  <MoneyInput
                    required
                    placeholder="5.000"
                    value={form.selling_price}
                    onChange={val => setForm({ ...form, selling_price: val })}
                    className={isFormSellingAtLoss ? 'border-rose-500 focus:border-rose-600' : ''}
                  />
                </div>
              </div>

              {isFormSellingAtLoss && (
                <div className="p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs sm:text-sm font-extrabold leading-snug">
                  ⚠️ Cảnh báo: Giá bán ({formatTien(formSellNum)}) đang thấp hơn giá nhập ({formatTien(formCostNum)}). Bán giá này sẽ bị lỗ {formatTien(formCostNum - formSellNum)} mỗi món!
                </div>
              )}

              <div>
                <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">Đang có trong kho (cái / chai / gói)</label>
                <input
                  type="text"
                  inputMode="numeric"
                  placeholder="Ví dụ: 24"
                  value={form.stock}
                  onChange={e => setForm({ ...form, stock: e.target.value.replace(/\D/g, '') })}
                  className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-blue-700"
                />
              </div>

              {/* NGƯỠNG BÁO SẮP HẾT TRONG TÙY CHỌN */}
              <div className="rounded-xl border border-blue-200 bg-blue-50/50 overflow-hidden">
                <button
                  type="button"
                  onClick={() => setShowOptions(!showOptions)}
                  className="w-full min-h-[40px] px-3.5 py-2 flex items-center justify-between text-xs sm:text-sm font-bold text-blue-800"
                >
                  <span>⚙️ Tùy chọn (Mức báo sắp hết hàng)</span>
                  <span>{showOptions ? '▲' : '▼'}</span>
                </button>
                {showOptions && (
                  <div className="p-3 pt-1.5 border-t border-blue-100">
                    <label className="block text-xs sm:text-sm font-bold text-slate-800 mb-1">
                      Nhắc khi kho còn ít hơn (mặc định 10)
                    </label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={form.low_stock_threshold}
                      onChange={e => setForm({ ...form, low_stock_threshold: e.target.value.replace(/\D/g, '') })}
                      className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base font-bold bg-white"
                    />
                  </div>
                )}
              </div>

              <div className="flex flex-col sm:flex-row gap-2.5 pt-1">
                <button
                  type="submit"
                  className="flex-1 min-h-[46px] py-2.5 px-5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-sm sm:text-base font-extrabold shadow-md"
                >
                  {editingId ? 'Lưu lại thay đổi' : 'Lưu món hàng này'}
                </button>
                {editingId && (
                  <button
                    type="button"
                    onClick={() => {
                      setEditingId(null);
                      setForm({ name: '', cost_price: '', selling_price: '', stock: '', low_stock_threshold: '10' });
                    }}
                    className="min-h-[46px] px-5 py-2.5 border-2 border-slate-300 bg-slate-100 text-slate-900 rounded-xl text-sm sm:text-base font-bold"
                  >
                    Hủy sửa
                  </button>
                )}
              </div>
            </form>
          </div>

          {/* Ô TÌM KIẾM NHANH & DANH SÁCH HÀNG HÓA */}
          <div className="bg-white p-4 sm:p-5 rounded-2xl border-2 border-blue-100 shadow-sm space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <h2 className="text-base sm:text-lg font-extrabold text-slate-900">Danh sách hàng ({products.length})</h2>
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="🔍 Tìm tên hàng..."
                className="w-full sm:w-64 min-h-[42px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base focus:outline-none focus:border-blue-700"
              />
            </div>

            {filteredProducts.length === 0 ? (
              <div className="text-center py-6 text-sm sm:text-base text-slate-600">
                {products.length === 0 ? 'Bạn chưa thêm món hàng nào.' : 'Không tìm thấy món hàng nào phù hợp.'}
              </div>
            ) : (
              <div className="space-y-2.5">
                {filteredProducts.map(p => (
                  <div
                    key={p.id}
                    className={`p-3.5 rounded-2xl border-2 space-y-2.5 ${
                      p.isSellingAtLoss || p.isLowStock ? 'bg-rose-50/70 border-rose-300' : 'bg-blue-50/40 border-blue-100'
                    }`}
                  >
                    <div className="flex flex-wrap items-start justify-between gap-2">
                      <div>
                        <div className="text-base sm:text-lg font-extrabold text-slate-900">{p.name}</div>
                        {p.isSellingAtLoss ? (
                          <div className="text-xs sm:text-sm font-extrabold text-rose-700 mt-0.5">
                            ⚠️ Giá bán thấp hơn giá nhập (Lỗ {formatTien(p.cost_price - p.selling_price)}/món)
                          </div>
                        ) : (
                          <div className="text-xs sm:text-sm font-bold text-emerald-700 mt-0.5">
                            Bán 100đ lãi {p.profitPer100}đ
                          </div>
                        )}
                      </div>
                      <span className={`px-2.5 py-1 rounded-lg text-xs sm:text-sm font-extrabold ${
                        p.isLowStock ? 'bg-rose-700 text-white' : 'bg-white border border-blue-200 text-slate-900'
                      }`}>
                        Còn {p.stock}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5 text-sm">
                      <div className="bg-white p-2.5 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-600">Giá nhập</div>
                        <div className="text-sm sm:text-base font-extrabold text-slate-900">{formatTien(p.cost_price)}</div>
                      </div>
                      <div className="bg-white p-2.5 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-600">Giá bán</div>
                        <div className={`text-sm sm:text-base font-extrabold ${p.isSellingAtLoss ? 'text-rose-700' : 'text-blue-700'}`}>
                          {formatTien(p.selling_price)}
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <button
                        type="button"
                        onClick={() => startEdit(p)}
                        className="min-h-[42px] px-3 py-1.5 rounded-xl bg-white border-2 border-blue-300 text-blue-800 text-sm font-extrabold hover:bg-blue-50"
                      >
                        ✏️ Sửa
                      </button>
                      <button
                        type="button"
                        onClick={() => setDeleteTarget(p)}
                        className="min-h-[42px] px-3 py-1.5 rounded-xl bg-white border-2 border-rose-300 text-rose-700 text-sm font-extrabold hover:bg-rose-50"
                      >
                        🗑️ Xóa
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <ConfirmModal
            open={Boolean(deleteTarget)}
            title="Bạn muốn xóa món này?"
            message={deleteTarget ? `Xóa "${deleteTarget.name}" khỏi danh sách hàng hóa?` : ''}
            confirmLabel="Có, xóa đi"
            cancelLabel="Không, giữ lại"
            danger={true}
            onConfirm={async () => {
              const target = deleteTarget;
              setDeleteTarget(null);
              if (target) await onDeleteProduct(target);
            }}
            onCancel={() => setDeleteTarget(null)}
          />

          <ConfirmModal
            open={Boolean(pendingConfirm)}
            title={pendingConfirm?.title || ''}
            message={pendingConfirm?.message || ''}
            confirmLabel="Đúng, lưu luôn"
            cancelLabel="Nhập lại"
            danger={Boolean(pendingConfirm?.danger)}
            onConfirm={async () => {
              const payload = pendingConfirm?.payload;
              setPendingConfirm(null);
              if (payload) await commitSave(payload);
            }}
            onCancel={() => setPendingConfirm(null)}
          />
        </div>
      );
    }

    // ==========================================
    // 4. TRANG THU CHI (6 NÚT GỌN + CHỌN NHANH TIỀN)
    // ==========================================
    const FINANCE_CHOICES = [
      { id: 'inventory', label: 'Nhập hàng', icon: '📦', type: 'inventory_purchase', category: 'Nhập hàng về kho' },
      { id: 'expense_electricity', label: 'Điện nước', icon: '⚡', type: 'expense', category: 'Tiền điện nước' },
      { id: 'expense_rent', label: 'Thuê nhà', icon: '🏠', type: 'expense', category: 'Thuê mặt bằng' },
      { id: 'expense_ship', label: 'Tiền ship', icon: '🚚', type: 'expense', category: 'Phí giao hàng' },
      { id: 'expense_other', label: 'Chi khác', icon: '📝', type: 'expense', category: 'Chi phí khác' },
      { id: 'income_other', label: 'Thu thêm', icon: '💵', type: 'income', category: 'Thu khác' },
    ];

    const QUICK_AMOUNTS = [50000, 100000, 200000, 500000];

    function FinanceView({ expenses, analytics, presetMode, onAddExpense, onDeleteExpense }) {
      const [subTab, setSubTab] = useState('add');
      const [selectedId, setSelectedId] = useState(presetMode || 'inventory');
      const [amount, setAmount] = useState('');
      const [expenseDate, setExpenseDate] = useState(todayStr());
      const [note, setNote] = useState('');
      const [showOptions, setShowOptions] = useState(false);
      const [saving, setSaving] = useState(false);
      const [confirmBigAmount, setConfirmBigAmount] = useState(null);
      const [deleteTx, setDeleteTx] = useState(null);

      useEffect(() => {
        if (presetMode) setSelectedId(presetMode);
      }, [presetMode]);

      const activeChoice = FINANCE_CHOICES.find(c => c.id === selectedId) || FINANCE_CHOICES[0];

      const isUnusuallyLarge = (num) => {
        if (num >= 10000000) return true;
        if (expenses.length >= 3) {
          const avg = expenses.reduce((s, e) => s + e.amount, 0) / expenses.length;
          if (avg > 0 && num >= avg * 10 && num >= 1000000) return true;
        }
        return false;
      };

      const commitSave = async (numAmount) => {
        setSaving(true);
        try {
          const ok = await onAddExpense({
            type: activeChoice.type,
            category: activeChoice.category,
            amount: numAmount,
            expense_date: expenseDate,
            note: note.trim()
          });
          if (ok) {
            setAmount('');
            setNote('');
            setExpenseDate(todayStr());
            setShowOptions(false);
          }
        } finally {
          setSaving(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (saving) return;
        const num = parseDigits(amount);
        if (num <= 0) {
          alert('Bạn hãy nhập số tiền lớn hơn 0 nhé.');
          return;
        }
        if (isUnusuallyLarge(num)) {
          setConfirmBigAmount(num);
          return;
        }
        await commitSave(num);
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-2.5">
          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-blue-100 shrink-0">
            <button
              type="button"
              onClick={() => setSubTab('add')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${
                subTab === 'add' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              ➕ Ghi khoản mới
            </button>
            <button
              type="button"
              onClick={() => setSubTab('history')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${
                subTab === 'history' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'
              }`}
            >
              📖 Đã ghi ({expenses.length})
            </button>
          </div>

          {subTab === 'add' && (
            <form onSubmit={handleSubmit} className="flex-1 min-h-0 overflow-y-auto scrollbar-thin bg-white p-4 sm:p-5 rounded-2xl border-2 border-blue-100 shadow-sm space-y-3.5">
              <div>
                <h2 className="text-sm sm:text-base font-extrabold text-slate-900 mb-2">1. Chọn loại khoản tiền</h2>
                <div className="grid grid-cols-3 gap-2 sm:gap-2.5">
                  {FINANCE_CHOICES.map(choice => {
                    const isSelected = selectedId === choice.id;
                    return (
                      <button
                        key={choice.id}
                        type="button"
                        onClick={() => setSelectedId(choice.id)}
                        className={`min-h-[62px] p-2 rounded-xl border-2 flex flex-col items-center justify-center gap-1 text-center transition ${
                          isSelected
                            ? 'border-blue-700 bg-blue-700 text-white shadow-md'
                            : 'border-slate-300 bg-white text-slate-900 hover:border-blue-400'
                        }`}
                      >
                        <span className="text-lg sm:text-xl leading-none">{choice.icon}</span>
                        <span className="text-xs sm:text-sm font-extrabold leading-tight">{choice.label}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="mt-2 text-xs sm:text-sm font-medium text-slate-700">
                  {activeChoice.type === 'inventory_purchase'
                    ? '💡 Tiền nhập hàng chỉ trừ vào tiền mặt, không trừ vào tiền lãi bán hàng.'
                    : activeChoice.type === 'income'
                    ? '💡 Khoản thu thêm này sẽ được cộng vào tiền lãi.'
                    : '💡 Khoản chi này sẽ được trừ khi tính tiền lãi.'}
                </div>
              </div>

              <div>
                <h2 className="text-sm sm:text-base font-extrabold text-slate-900 mb-2">2. Nhập số tiền</h2>
                <MoneyInput
                  required
                  placeholder="Ví dụ: 100.000"
                  value={amount}
                  onChange={setAmount}
                />
                <div className="grid grid-cols-4 gap-1.5 sm:gap-2.5 mt-2">
                  {QUICK_AMOUNTS.map(val => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => setAmount(String(val))}
                      className="min-h-[38px] px-1.5 py-1.5 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-xs sm:text-sm font-extrabold hover:bg-blue-100"
                    >
                      {val.toLocaleString('vi-VN')}
                    </button>
                  ))}
                </div>
              </div>

              <div className="rounded-xl border border-blue-200 bg-blue-50/50 overflow-hidden">
                <button
                  type="button"
                  onClick={() => setShowOptions(!showOptions)}
                  className="w-full min-h-[40px] px-3.5 py-2 flex items-center justify-between text-xs sm:text-sm font-bold text-blue-800"
                >
                  <span>⚙️ Tùy chọn (Đổi ngày, ghi chú)</span>
                  <span>{showOptions ? '▲' : '▼'}</span>
                </button>
                {showOptions && (
                  <div className="p-3 pt-1.5 border-t border-blue-100 space-y-2.5">
                    <div>
                      <label className="block text-xs font-bold text-slate-800 mb-1">Ngày ghi</label>
                      <input
                        type="date"
                        value={expenseDate}
                        onChange={e => setExpenseDate(e.target.value)}
                        className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-800 mb-1">Ghi chú thêm (không bắt buộc)</label>
                      <input
                        value={note}
                        onChange={e => setNote(e.target.value)}
                        placeholder="Ví dụ: Trả tiền điện tháng này"
                        className="w-full min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base bg-white"
                      />
                    </div>
                  </div>
                )}
              </div>

              <button
                type="submit"
                disabled={saving}
                className="w-full min-h-[46px] py-2.5 px-5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-sm sm:text-base font-extrabold shadow-md disabled:opacity-50"
              >
                {saving ? 'Đang lưu...' : `Lưu khoản ${activeChoice.label.toLowerCase()}`}
              </button>
            </form>
          )}

          {subTab === 'history' && (
            <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-2.5 pr-0.5">
              <div className="bg-white p-3.5 rounded-2xl border-2 border-blue-100 flex flex-wrap items-center justify-between gap-2 text-sm sm:text-base">
                <span>Tháng này lãi: <strong className="text-emerald-700">{formatTien(analytics.thisM.netProfit)}</strong></span>
                <span>Tiền mặt còn: <strong className="text-blue-700">{formatTien(analytics.thisM.cashFlow)}</strong></span>
              </div>

              {expenses.length === 0 ? (
                <div className="bg-white p-6 rounded-2xl border-2 border-blue-100 text-center text-sm sm:text-base text-slate-600">
                  Chưa có khoản thu chi nào được ghi.
                </div>
              ) : (
                <div className="space-y-2">
                  {expenses.map(e => (
                    <div key={e.id} className="bg-white p-3.5 rounded-2xl border-2 border-blue-100 shadow-sm flex items-center justify-between gap-2.5">
                      <div className="min-w-0">
                        <div className="text-sm sm:text-base font-extrabold text-slate-900">{e.category}</div>
                        <div className="text-xs sm:text-sm text-slate-600">
                          {e.expense_date}{e.note ? ` • ${e.note}` : ''}
                        </div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <span className={`text-sm sm:text-base font-extrabold ${e.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}`}>
                          {e.type === 'income' ? '+' : '-'}{formatTien(e.amount)}
                        </span>
                        <button
                          type="button"
                          onClick={() => setDeleteTx(e)}
                          className="min-h-[38px] px-2.5 rounded-xl border border-rose-200 text-rose-700 text-xs sm:text-sm font-bold hover:bg-rose-50"
                        >
                          Xóa
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <ConfirmModal
            open={confirmBigAmount !== null}
            title="Kiểm tra lại số tiền"
            message={confirmBigAmount !== null ? `Bạn nhập ${formatTien(confirmBigAmount)}, đúng không?` : ''}
            confirmLabel="Đúng, lưu luôn"
            cancelLabel="Nhập lại"
            onConfirm={async () => {
              const num = confirmBigAmount;
              setConfirmBigAmount(null);
              if (num) await commitSave(num);
            }}
            onCancel={() => setConfirmBigAmount(null)}
          />

          <ConfirmModal
            open={Boolean(deleteTx)}
            title="Xóa khoản này?"
            message={deleteTx ? `Bạn muốn xóa "${deleteTx.category} (${formatTien(deleteTx.amount)})"?` : ''}
            confirmLabel="Có, xóa đi"
            cancelLabel="Giữ lại"
            danger={true}
            onConfirm={async () => {
              const tx = deleteTx;
              setDeleteTx(null);
              if (tx) await onDeleteExpense(tx.id);
            }}
            onCancel={() => setDeleteTx(null)}
          />
        </div>
      );
    }
    // ==========================================
    // 4B. TRANG NGÂN HÀNG (PHÂN LOẠI GIAO DỊCH SEPAY)
    // ==========================================
    const BANK_BTN_IN = [
      { action: 'sale', label: 'Bán hàng', icon: '🛒' },
      { action: 'income_other', label: 'Thu khác', icon: '💵' },
    ];
    const BANK_BTN_OUT = [
      { action: 'inventory', label: 'Nhập hàng', icon: '📦' },
      { action: 'electricity', label: 'Điện nước', icon: '⚡' },
      { action: 'rent', label: 'Thuê nhà', icon: '🏠' },
      { action: 'ship', label: 'Tiền ship', icon: '🚚' },
      { action: 'expense_other', label: 'Chi khác', icon: '📝' },
    ];

    function BankLinkBox() {
      const [linked, setLinked] = useState(null);
      const [claim, setClaim] = useState(null);
      const [acc, setAcc] = useState('');
      const [bank, setBank] = useState('');
      const [saving, setSaving] = useState(false);
      const [copied, setCopied] = useState(false);

      const checkLinked = async () => {
        const { data } = await sb.from('bank_links').select('account_number');
        const ok = (data || []).length > 0;
        setLinked(ok);
        return ok;
      };

      useEffect(() => {
        (async () => {
          const ok = await checkLinked();
          if (ok) return;
          const { data } = await sb
            .from('bank_link_claims')
            .select('code, account_number')
            .eq('status', 'pending')
            .gt('expires_at', new Date().toISOString())
            .order('created_at', { ascending: false })
            .limit(1);
          if (data && data[0]) setClaim(data[0]);
        })();
      }, []);

      useEffect(() => {
        if (!claim || linked) return;
        const t = setInterval(checkLinked, 5000);
        return () => clearInterval(t);
      }, [claim, linked]);

      if (linked === null || linked) return null;

      const start = async (e) => {
        e.preventDefault();
        if (saving) return;
        setSaving(true);
        const { data, error } = await sb.rpc('start_bank_link', { p_account: acc, p_bank: bank });
        setSaving(false);
        if (error) { alert(error.message || 'Chưa tạo được mã, bạn thử lại nhé.'); return; }
        setClaim({ code: data.code, account_number: acc });
      };

      const copyCode = async () => {
        try { await navigator.clipboard.writeText(claim.code); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch {}
      };

      if (claim) {
        return (
          <div className="bg-white p-3.5 rounded-2xl border-2 border-amber-300 space-y-2.5 shrink-0">
            <div className="text-sm sm:text-base font-extrabold text-slate-900">
              🔐 Xác minh tài khoản {claim.account_number}
            </div>
            <div className="text-xs sm:text-sm text-slate-700 leading-relaxed">
              Mở app ngân hàng, chuyển <strong>1.000đ từ chính tài khoản này</strong> sang tài khoản nào cũng được
              (kể cả tài khoản của bạn). Nội dung chuyển khoản chỉ ghi đúng mã sau:
            </div>
            <button
              type="button"
              onClick={copyCode}
              className="w-full min-h-[52px] rounded-xl bg-amber-50 border-2 border-amber-300 text-2xl font-extrabold tracking-widest text-amber-800"
            >
              {claim.code}
            </button>
            <div className="text-xs font-bold text-slate-600 text-center">
              {copied ? '✅ Đã chép mã' : 'Chạm vào mã để chép'} • ⏳ Đang chờ ngân hàng báo về...
            </div>
            <button
              type="button"
              onClick={() => setClaim(null)}
              className="w-full min-h-[40px] rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 text-xs sm:text-sm font-bold"
            >
              ← Đổi số tài khoản khác
            </button>
          </div>
        );
      }

      return (
        <form onSubmit={start} className="bg-white p-3.5 rounded-2xl border-2 border-blue-200 space-y-2.5 shrink-0">
          <div className="text-sm sm:text-base font-extrabold text-slate-900">🏦 Liên kết tài khoản ngân hàng</div>
          <input
            required
            inputMode="numeric"
            value={acc}
            onChange={e => setAcc(e.target.value.replace(/\D/g, ''))}
            placeholder="Số tài khoản"
            className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base font-bold"
          />
          <input
            value={bank}
            onChange={e => setBank(e.target.value)}
            placeholder="Tên ngân hàng (ví dụ: MBBank)"
            className="w-full min-h-[44px] px-3.5 py-2 border-2 border-slate-300 rounded-xl text-base"
          />
          <button
            type="submit"
            disabled={saving}
            className="w-full min-h-[46px] bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-sm sm:text-base font-extrabold disabled:opacity-50"
          >
            {saving ? 'Đang tạo mã...' : 'Lấy mã xác minh'}
          </button>
        </form>
      );
    }

    function BankInboxView({ bankTx, orders, onClassify, onUnclassify }) {
      const [tab, setTab] = useState('pending');
      const [busyId, setBusyId] = useState(null);

      const pending = bankTx.filter(t => t.status === 'pending');
      const done = bankTx.filter(t => t.status !== 'pending');
      const list = tab === 'pending' ? pending : done;

      const fmtTime = (iso) => new Date(iso).toLocaleString('vi-VN', {
        hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
      });

      const act = async (id, action) => {
        if (busyId) return;
        setBusyId(id);
        try { await onClassify(id, action); } finally { setBusyId(null); }
      };

      const doneLabel = (t) => {
        if (t.status === 'matched_order') return '✅ Đã thu cho đơn hàng';
        if (t.status === 'ignored') return '🚫 Đã bỏ qua';
        if (t.status === 'recorded') return `✅ ${t.category || 'Đã ghi tự động'}`;
        return `✅ ${t.category || 'Đã phân loại'}`;
      };

      return (
        <div className="h-full flex flex-col min-h-0 gap-2.5">
          <BankLinkBox />

          <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border-2 border-blue-100 shrink-0">
            <button type="button" onClick={() => setTab('pending')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${tab === 'pending' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'}`}>
              🔔 Chờ phân loại ({pending.length})
            </button>
            <button type="button" onClick={() => setTab('done')}
              className={`min-h-[42px] rounded-xl text-sm sm:text-base font-extrabold transition ${tab === 'done' ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-700 hover:bg-blue-50'}`}>
              📖 Đã xử lý ({done.length})
            </button>
          </div>

          <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin space-y-2.5 pr-0.5">
            {list.length === 0 ? (
              <div className="bg-white rounded-2xl p-6 border-2 border-blue-100 text-center text-sm sm:text-base text-slate-600">
                {tab === 'pending' ? '🎉 Không còn giao dịch nào cần phân loại.' : 'Chưa có giao dịch nào.'}
              </div>
            ) : list.map(t => {
              const isIn = t.direction === 'in';
              const matchedOrder = t.linked_order_id ? orders.find(o => o.id === t.linked_order_id) : null;
              const buttons = isIn ? BANK_BTN_IN : BANK_BTN_OUT;
              return (
                <div key={t.id} className={`bg-white rounded-2xl p-3.5 border-2 shadow-sm space-y-2.5 ${isIn ? 'border-emerald-300' : 'border-rose-300'}`}>
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="text-xs sm:text-sm font-bold text-slate-600">
                        {isIn ? '💰 Tiền vào' : '💸 Tiền ra'} • {fmtTime(t.occurred_at)}
                      </div>
                      <div className="text-xs sm:text-sm text-slate-700 mt-0.5 break-words">
                        {t.content || '(không có nội dung)'}
                      </div>
                    </div>
                    <div className={`text-lg sm:text-xl font-extrabold shrink-0 ${isIn ? 'text-emerald-700' : 'text-rose-700'}`}>
                      {isIn ? '+' : '-'}{formatTien(t.amount)}
                    </div>
                  </div>

                  {t.status === 'pending' ? (
                    <>
                      {isIn && matchedOrder && (
                        <button type="button" disabled={busyId === t.id} onClick={() => act(t.id, 'order')}
                          className="w-full min-h-[46px] rounded-xl bg-amber-100 border-2 border-amber-300 text-amber-800 text-sm font-extrabold disabled:opacity-50">
                          🧾 Khách trả cho đơn "{matchedOrder.customer_name || 'Khách lẻ'}" (không tính thêm doanh thu)
                        </button>
                      )}
                      <div className="grid grid-cols-3 gap-2">
                        {buttons.map(b => (
                          <button key={b.action} type="button" disabled={busyId === t.id} onClick={() => act(t.id, b.action)}
                            className="min-h-[56px] p-1.5 rounded-xl border-2 border-blue-300 bg-blue-50 text-blue-900 flex flex-col items-center justify-center gap-0.5 hover:bg-blue-100 disabled:opacity-50">
                            <span className="text-lg leading-none">{b.icon}</span>
                            <span className="text-xs sm:text-sm font-extrabold leading-tight">{b.label}</span>
                          </button>
                        ))}
                        <button type="button" disabled={busyId === t.id} onClick={() => act(t.id, 'ignore')}
                          className="min-h-[56px] p-1.5 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 flex flex-col items-center justify-center gap-0.5 disabled:opacity-50">
                          <span className="text-lg leading-none">🚫</span>
                          <span className="text-xs sm:text-sm font-extrabold leading-tight">Bỏ qua</span>
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs sm:text-sm font-bold text-slate-700">{doneLabel(t)}</span>
                      {t.status !== 'recorded' && (
                        <button type="button" onClick={() => onUnclassify(t.id)}
                          className="min-h-[38px] px-3 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-xs sm:text-sm font-bold">
                          ↩️ Hoàn tác
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    // ==========================================
    // 5. TRANG HỎI AI (CHỈ CUỘN TIN NHẮN, Ô HỎI GHIM ĐÁY)
    // ==========================================
    function AIIntelligenceView({ analytics }) {
      const { todayStats, thisM, lastM, lowStockProducts, lowMarginProducts } = analytics;
      const [messages, setMessages] = useState([
        {
          role: 'ai',
          text: `Chào bạn, tôi đã xem sổ tháng ${thisM.monthKey} của cửa hàng bạn. Hôm nay bạn lãi ${formatTien(todayStats.netProfit)} và tháng này đang lãi ${formatTien(thisM.netProfit)}. Việc cần làm: Hãy bấm một câu hỏi bên dưới để tôi trả lời ngay cho bạn.`
        }
      ]);
      const [input, setInput] = useState('');
      const [thinking, setThinking] = useState(false);

      const chatContainerRef = useRef(null);
      const lastMsgRef = useRef(null);

      useEffect(() => {
        const container = chatContainerRef.current;
        if (!container) return;

        requestAnimationFrame(() => {
          const lastMsg = messages[messages.length - 1];
          const lastEl = lastMsgRef.current;
          if (!thinking && lastMsg?.role === 'ai' && lastEl && lastEl.offsetHeight > container.clientHeight * 0.85) {
            container.scrollTo({
              top: Math.max(0, lastEl.offsetTop - 12),
              behavior: 'smooth'
            });
          } else {
            container.scrollTo({
              top: container.scrollHeight,
              behavior: 'smooth'
            });
          }
        });
      }, [messages, thinking]);

      const generateSimpleAnswer = (q) => {
        const lower = q.toLowerCase();

        if (/^(xin )?chào|^hello|^hi\b/.test(lower)) {
          return 'Chào bạn, tôi là trợ lý giúp xem tiền lãi và hàng hóa cho cửa hàng. Bạn có thể hỏi về tiền lãi tháng này, món sắp hết hoặc tiền mặt còn lại. Việc cần làm: Bấm chọn một câu hỏi gợi ý bên dưới nhé.';
        }

        if (lower.includes('tiền mặt') || lower.includes('trong ví') || lower.includes('trong két') || lower.includes('khác')) {
          return `Tháng này bạn lãi ${formatTien(thisM.netProfit)}, nhưng tiền mặt thực còn ${formatTien(thisM.cashFlow)}. Lý do là bạn đã chi ${formatTien(thisM.inventoryCashOut)} tiền mặt để nhập hàng về kho, số hàng này chưa bán hết nên chưa trừ vào tiền lãi. Việc cần làm: Kiểm tra lại hàng đã nhập trong mục Hàng hóa để đẩy bán sớm thu tiền mặt về.`;
        }

        if (lower.includes('tồn') || lower.includes('hết hàng') || lower.includes('nhập thêm') || lower.includes('sắp hết')) {
          if (lowStockProducts.length === 0) {
            return 'Tất cả mặt hàng trong kho của bạn hiện đều đang còn đủ bán. Bạn chưa cần nhập thêm gấp hôm nay. Việc cần làm: Tiếp tục ghi đơn mỗi khi bán để hệ thống tự đếm hàng còn lại.';
          }
          const topNames = lowStockProducts.slice(0, 3).map(p => `${p.name} (còn ${p.stock})`).join(', ');
          return `Hiện có ${lowStockProducts.length} món sắp hết hàng, gồm: ${topNames}. Nếu không nhập sớm sẽ dễ bị lỡ khách mua. Việc cần làm: Mở mục Hàng hóa để xem lại và nhập thêm các món này.`;
        }

        if (lower.includes('lãi') || lower.includes('lời') || lower.includes('thay đổi') || lower.includes('tăng') || lower.includes('giảm')) {
          const diff = thisM.netProfit - lastM.netProfit;
          const direction = diff >= 0 ? `nhiều hơn tháng trước ${formatTien(diff)}` : `ít hơn tháng trước ${formatTien(Math.abs(diff))}`;
          const thinNote = lowMarginProducts.length > 0
            ? `Ngoài ra có ${lowMarginProducts[0].name} đang lãi khá mỏng (bán 100đ lãi ${lowMarginProducts[0].profitPer100}đ).`
            : `Chi phí cửa hàng tháng này là ${formatTien(thisM.opex)}.`;
          return `Tháng này cửa hàng bạn bán được ${formatTien(thisM.revenue)} và lãi ${formatTien(thisM.netProfit)}, ${direction}. ${thinNote} Việc cần làm: Xem lại các khoản chi trong mục Thu chi để cắt bớt khoản chưa cần thiết.`;
        }

        return `Tháng này bạn bán được ${formatTien(thisM.revenue)}, lãi thực tế ${formatTien(thisM.netProfit)} và còn ${formatTien(thisM.cashFlow)} tiền mặt. Hiện có ${lowStockProducts.length} món đang sắp hết trong kho. Việc cần làm: Vào mục Bán hàng hoặc Thu chi để cập nhật đầy đủ số liệu hôm nay.`;
      };

      const sendMessage = async (text) => {
        const q = (text || input).trim();
        if (!q || thinking) return;
        setMessages(prev => [...prev, { role: 'user', text: q }]);
        setInput('');

        const fallbackReply = () => generateSimpleAnswer(q);

        if (window.ENABLE_AI_EDGE_FUNCTION) {
          setThinking(true);
          try {
            const { data, error } = await sb.functions.invoke('ai-advisor', {
              body: {
                question: `${q} (Hãy trả lời tối đa 3 câu ngắn gọn bằng tiếng Việt đơn giản cho người lớn tuổi, không dùng ký hiệu phần trăm hay từ chuyên môn, và kết thúc bằng 1 việc cần làm cụ thể.)`,
                context: {
                  todayStats,
                  thisM,
                  lastM,
                  lowStockProducts: lowStockProducts.map(p => ({ name: p.name, stock: p.stock, threshold: p.low_stock_threshold })),
                  lowMarginProducts: lowMarginProducts.map(p => ({ name: p.name, profitPer100: p.profitPer100 }))
                }
              }
            });

            if (!error && data?.reply) {
              setMessages(prev => [...prev, { role: 'ai', text: data.reply }]);
              return;
            }

            console.error('Lỗi gọi trợ lý AI:', error, data);
            setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
          } catch (err) {
            console.error('Lỗi gọi trợ lý AI:', err);
            setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
          } finally {
            setThinking(false);
          }
          return;
        }

        setMessages(prev => [...prev, { role: 'ai', text: fallbackReply() }]);
      };

      const quickQuestions = [
        'Vì sao tiền lãi tháng này thay đổi?',
        'Món nào sắp hết hàng?',
        'Tại sao tiền mặt khác với tiền lãi?'
      ];

      return (
        <div className="h-full flex flex-col min-h-0">
          <div className="flex-1 min-h-0 bg-white rounded-2xl border-2 border-blue-100 shadow-sm flex flex-col overflow-hidden">
            <div ref={chatContainerRef} className="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 space-y-3 scrollbar-thin">
              {messages.map((m, idx) => {
                const isLast = idx === messages.length - 1;
                return (
                  <div
                    key={idx}
                    ref={isLast ? lastMsgRef : null}
                    className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div className={`max-w-[92%] sm:max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm sm:text-base leading-relaxed whitespace-pre-line ${
                      m.role === 'user'
                        ? 'bg-blue-700 text-white font-bold shadow-sm'
                        : 'bg-blue-50 text-slate-900 border border-blue-200'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                );
              })}
              {thinking && (
                <div className="flex justify-start">
                  <div className="rounded-2xl px-3.5 py-2 text-sm sm:text-base font-bold bg-blue-50 text-blue-800 border border-blue-200">
                    ⏳ Đang xem lại sổ giúp bạn...
                  </div>
                </div>
              )}
            </div>

            <div className="shrink-0 p-2.5 sm:p-3 border-t border-blue-100 bg-blue-50/50 space-y-1.5">
              <div className="text-xs font-extrabold text-slate-800">Bấm nhanh câu hỏi:</div>
              <div className="flex flex-col sm:flex-row flex-wrap gap-1.5">
                {quickQuestions.map((q, i) => (
                  <button
                    key={i}
                    type="button"
                    onClick={() => sendMessage(q)}
                    disabled={thinking}
                    className="text-left px-3 py-1.5 rounded-xl bg-white text-blue-900 border border-blue-300 hover:bg-blue-50 text-xs sm:text-sm font-bold transition disabled:opacity-50"
                  >
                    💬 {q}
                  </button>
                ))}
              </div>
            </div>

            <form onSubmit={e => { e.preventDefault(); sendMessage(); }} className="shrink-0 p-2.5 sm:p-3 border-t border-blue-100 flex gap-2 bg-white">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Gõ câu hỏi của bạn..."
                className="flex-1 min-w-0 min-h-[42px] px-3 py-1.5 border-2 border-slate-300 rounded-xl text-base focus:outline-none focus:border-blue-700"
              />
              <button
                type="submit"
                disabled={thinking}
                className="min-h-[42px] px-4 py-1.5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-sm sm:text-base font-extrabold shrink-0 disabled:opacity-50"
              >
                Gửi
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
