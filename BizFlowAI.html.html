<body class="bg-business-grid">
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== CẤU HÌNH SUPABASE =====
    const SUPABASE_URL = "https://xofriivockwiycdnnfvx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6ogosVTXKRpzbZwJcyZmw_yKzEwKYO";
    window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.ENABLE_AI_EDGE_FUNCTION = true;
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // CẤU HÌNH GÓI DỊCH VỤ
    // ==========================================
    const PLAN_INFO = {
      free: {
        id: 'free',
        name: 'Gói Cơ bản',
        priceLabel: '0đ / tháng',
        shortBadge: 'Cơ bản 0đ',
        mobileBadge: '0đ',
        hasAI: false
      },
      ai_199k: {
        id: 'ai_199k',
        name: 'Gói AI Thông minh',
        priceLabel: '199.000đ / tháng',
        shortBadge: 'Gói AI 199k',
        mobileBadge: 'AI 199k',
        hasAI: true
      }
    };

    // ==========================================
    // TIỆN ÍCH ĐỊNH DẠNG TIỀN, SĐT & NGÀY THÁNG
    // ==========================================
    const formatTien = (num) => {
      const rounded = Math.round(num || 0);
      const sign = rounded < 0 ? '-' : '';
      return `${sign}${Math.abs(rounded).toLocaleString('vi-VN')}đ`;
    };

    const formatNumberInput = (val) => {
      const digits = String(val ?? '').replace(/\D/g, '');
      if (!digits) return '';
      return Number(digits).toLocaleString('vi-VN');
    };

    const parseDigits = (val) => {
      const digits = String(val ?? '').replace(/\D/g, '');
      return digits ? parseInt(digits, 10) : 0;
    };

    const normalizePhone = (raw) => {
      const cleaned = String(raw || '').replace(/[\s.\-()]/g, '');
      if (!cleaned) return '';
      if (cleaned.startsWith('0')) return `+84${cleaned.slice(1)}`;
      if (cleaned.startsWith('84')) return `+${cleaned}`;
      if (cleaned.startsWith('+')) return cleaned;
      return `+84${cleaned}`;
    };

    const isValidPhone = (e164) => /^\+\d{9,15}$/.test(e164);

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const getMonthKey = (dateStr) => (dateStr || '').slice(0, 7);

    const formatDateVi = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString('vi-VN');
    };

    const currentDate = new Date();
    const THIS_MONTH = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const prevDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    const LAST_MONTH = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

    const ORDER_STATUS_LABEL = {
      completed: 'Đã hoàn tất',
      pending: 'Chờ giao hàng',
      cancelled: 'Đã hủy'
    };

    // ==========================================
    // Ô NHẬP TIỀN CHỮ TO, DỄ NHÌN
    // ==========================================
    function MoneyInput({ value, onChange, placeholder = 'Nhập số tiền', required = false, className = '' }) {
      const handleChange = (e) => {
        const digits = e.target.value.replace(/\D/g, '');
        onChange(digits ? String(parseInt(digits, 10)) : '');
      };

      return (
        <div className="relative">
          <input
            type="text"
            inputMode="numeric"
            required={required}
            value={formatNumberInput(value)}
            onChange={handleChange}
            placeholder={placeholder}
            className={`w-full min-h-[50px] px-4 py-2.5 pr-10 border-2 border-slate-300 rounded-2xl text-lg font-bold focus:outline-none focus:border-blue-700 bg-white ${className}`}
          />
          <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-base font-bold text-slate-500">đ</span>
        </div>
      );
    }

    // ==========================================
    // HỘP THOẠI XÁC NHẬN
    // ==========================================
    function ConfirmModal({ open, title, message, confirmLabel = 'Xác nhận', cancelLabel = 'Quay lại', danger = false, onConfirm, onCancel }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border-2 border-blue-200 rounded-2xl p-5 max-w-md w-full shadow-2xl space-y-4">
            <h3 className="text-xl font-extrabold text-slate-900 leading-snug">{title}</h3>
            <p className="text-base text-slate-700 leading-relaxed">{message}</p>
            <div className="grid grid-cols-2 gap-3 pt-1">
              <button
                type="button"
                onClick={onCancel}
                className="min-h-[48px] px-4 py-2.5 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-900 text-base font-bold"
              >
                {cancelLabel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className={`min-h-[48px] px-4 py-2.5 rounded-xl text-white text-base font-bold shadow-md ${
                  danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-700 hover:bg-blue-800'
                }`}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // HỘP THOẠI XEM & NÂNG CẤP GÓI DỊCH VỤ
    // ==========================================
    function PlanModal({ open, user, onClose, onRefreshPlan }) {
      const [checking, setChecking] = useState(false);
      const [upgradeRequested, setUpgradeRequested] = useState(false);
      if (!open || !user) return null;

      const hasAI = Boolean(user.has_ai);
      const isDemo = Boolean(user.is_demo);

      const handleCheck = async () => {
        if (checking || !onRefreshPlan) return;
        setChecking(true);
        try {
          await onRefreshPlan();
        } finally {
          setChecking(false);
        }
      };

      const handleRequestUpgrade = async () => {
        setUpgradeRequested(true);
        try {
          await sb.auth.updateUser({ data: { requested_plan: 'ai_199k' } });
        } catch {}
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border-2 border-blue-200 rounded-2xl p-5 max-w-lg w-full shadow-2xl space-y-4 max-h-[90dvh] overflow-y-auto scrollbar-thin">
            <div className="flex items-center justify-between gap-2">
              <h3 className="text-xl font-extrabold text-slate-900">Gói dịch vụ BizFlow AI</h3>
              <button
                type="button"
                onClick={onClose}
                className="min-h-[42px] px-4 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 text-base font-bold"
              >
                Đóng
              </button>
            </div>

            {isDemo ? (
              <div className="p-4 rounded-2xl bg-sky-100 border border-blue-200 text-base font-semibold text-slate-900 leading-relaxed">
                Quý khách đang sử dụng <strong>Tài khoản Trải nghiệm</strong> với đầy đủ tính năng và Trợ lý AI.
              </div>
            ) : (
              <div className={`p-4 rounded-2xl border-2 text-base ${
                hasAI ? 'bg-blue-50 border-blue-300 text-blue-900' : 'bg-slate-50 border-slate-300 text-slate-900'
              }`}>
                <div className="font-extrabold text-lg">
                  Đang sử dụng: {hasAI ? 'Gói AI Thông minh (199.000đ / tháng)' : 'Gói Cơ bản (Miễn phí 0đ)'}
                </div>
                {hasAI && user.plan_expires_at && (
                  <div className="text-sm sm:text-base font-bold mt-1">
                    Thời hạn sử dụng đến: {formatDateVi(user.plan_expires_at)}
                  </div>
                )}
                {!hasAI && user.is_plan_expired && (
                  <div className="text-sm sm:text-base font-bold text-red-600 mt-1">
                    Gói AI đã hết hạn. Quý khách vui lòng gia hạn để tiếp tục sử dụng Trợ lý AI.
                  </div>
                )}
                {!hasAI && !user.is_plan_expired && (
                  <div className="text-sm sm:text-base text-slate-700 mt-1">
                    Gói Cơ bản bao gồm đầy đủ nghiệp vụ bán hàng, kho và thu chi. Nâng cấp lên Gói AI để có trợ lý phân tích lợi nhuận tự động.
                  </div>
                )}
              </div>
            )}

            <div className="space-y-3">
              {/* GÓI CƠ BẢN 0Đ */}
              <div className={`p-4 rounded-2xl border-2 ${
                !isDemo && !hasAI ? 'border-blue-700 bg-blue-50/50' : 'border-slate-200 bg-white'
              }`}>
                <div className="flex items-center justify-between gap-2">
                  <div className="font-extrabold text-lg text-slate-900">Gói Cơ bản</div>
                  <div className="text-base font-extrabold text-emerald-700">0đ / tháng</div>
                </div>
                <ul className="mt-2 text-base text-slate-700 space-y-1.5">
                  <li>✓ Ghi nhận đơn hàng, quản lý kho, sổ thu chi &amp; ngân hàng</li>
                  <li>— Chưa bao gồm Trợ lý AI phân tích chuyên sâu</li>
                </ul>
                {!isDemo && !hasAI && (
                  <div className="mt-2.5 inline-block px-3 py-1 rounded-lg bg-slate-200 text-slate-900 text-sm font-extrabold">
                    Gói hiện tại
                  </div>
                )}
              </div>

              {/* GÓI AI 199K / THÁNG */}
              <div className={`p-4 rounded-2xl border-2 ${
                !isDemo && hasAI ? 'border-blue-700 bg-blue-50' : 'border-red-300 bg-red-50/30'
              }`}>
                <div className="flex items-center justify-between gap-2">
                  <div className="font-extrabold text-lg text-slate-900 flex items-center gap-2">
                    <span>Gói AI Thông minh</span>
                  </div>
                  <div className="text-base font-extrabold text-red-600">199.000đ / tháng</div>
                </div>
                <ul className="mt-2 text-base text-slate-700 space-y-1.5">
                  <li>✓ Toàn bộ tính năng của Gói Cơ bản</li>
                  <li>✓ Mở khóa <strong>Trợ lý AI</strong>: phân tích lãi lỗ, cảnh báo tồn kho &amp; dòng tiền</li>
                </ul>
                {!isDemo && hasAI && (
                  <div className="mt-2.5 inline-block px-3 py-1 rounded-lg bg-blue-700 text-white text-sm font-extrabold">
                    Đang kích hoạt
                  </div>
                )}
              </div>
            </div>

            {!isDemo && (
              <div className="space-y-2.5 pt-1">
                {!hasAI && (
                  <>
                    {!upgradeRequested ? (
                      <button
                        type="button"
                        onClick={handleRequestUpgrade}
                        className="w-full min-h-[50px] px-4 py-2.5 rounded-xl brand-gradient-btn text-white text-base font-extrabold shadow-md"
                      >
                        Nâng cấp lên Gói AI (199.000đ/tháng) →
                      </button>
                    ) : (
                      <div className="p-3.5 rounded-xl bg-amber-50 border-2 border-amber-300 text-sm sm:text-base text-amber-900 leading-relaxed">
                        Đã ghi nhận yêu cầu nâng cấp cho số <strong>{user.phone}</strong>. Sau khi hoàn tất thanh toán với bộ phận hỗ trợ, quý khách bấm nút bên dưới để kích hoạt ngay.
                      </div>
                    )}
                  </>
                )}
                <button
                  type="button"
                  onClick={handleCheck}
                  disabled={checking}
                  className="w-full min-h-[48px] px-4 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-base font-extrabold disabled:opacity-50"
                >
                  {checking ? 'Đang kiểm tra trạng thái...' : 'Cập nhật trạng thái gói'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // NÚT CHUYỂN NỀN SÁNG / TỐI
    // ==========================================
    function ThemeToggleButton({ theme, onToggle, compact = false }) {
      const isDark = theme === 'dark';
      return (
        <button
          type="button"
          onClick={onToggle}
          title={isDark ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'}
          className={`min-h-[42px] sm:min-h-[44px] inline-flex items-center justify-center gap-1.5 rounded-xl border-2 text-sm font-bold transition shrink-0 ${
            compact ? 'px-3 py-1.5' : 'px-3.5 py-1.5'
          } ${
            isDark
              ? 'bg-slate-800 border-slate-600 text-sky-400 hover:bg-slate-700'
              : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100'
          }`}
        >
          <span>{isDark ? '☀️' : '🌙'}</span>
          {!compact && <span>{isDark ? 'Nền sáng' : 'Nền tối'}</span>}
        </button>
      );
    }

    // ==========================================
    // LOGO BIZFLOW AI (ĐỒNG BỘ THEO ẢNH MẪU ĐỎ - TÍM - XANH)
    // ==========================================

      const bar1 = `bfBar1-${uid}`;
      const bar2 = `bfBar2-${uid}`;
      const bar3 = `bfBar3-${uid}`;
      const aiGrad = `bfAi-${uid}`;

      const iconSizes = { sm: 'w-9 h-8', md: 'w-11 h-10', lg: 'w-14 h-12' };

      return (
        <div className="flex items-center gap-2.5 select-none min-w-0">
          <svg viewBox="0 0 140 115" className={`${iconSizes[size]} shrink-0 drop-shadow-sm`} fill="none">
            <defs>
              <linearGradient id={mainGrad} x1="18" y1="12" x2="112" y2="102" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#ef4444" />

              <linearGradient id={bar2} x1="0" y1="100" x2="0" y2="56" gradientUnits="userSpaceOnUse">

              <linearGradient id={bar3} x1="0" y1="100" x2="0" y2="45" gradientUnits="userSpaceOnUse">

            />

            {/* Khoảng cắt trắng tạo đường lượn & nền cho 3 cột */}

              d="M16 92 C36 58 64 46 96 42 C72 58 58 76 54 106 H18 Z"
              fill="#ffffff"
              fillOpacity="0.96"
            />
            <path
              d="M46 66 C66 56 84 62 84 82 C84 95 75 103 60 106 H42 Z"
              fill="#ffffff"
              fillOpacity="0.96"
            />

            {/* 3 cột biểu đồ tăng trưởng (Đỏ - Tím - Xanh) */}
            <rect x="44" y="74" width="11" height="28" rx="2" fill={`url(#${bar1})`} />
            <rect x="60" y="62" width="11" height="40" rx="2" fill={`url(#${bar2})`} />
            <rect x="76" y="49" width="11" height="53" rx="2" fill={`url(#${bar3})`} />

            {/* Phần bụng dưới bên phải của chữ B */}
            <path
              d="M91 56 C104 60 110 70 108 83 C106 96 96 104 82 106 L87 56 Z"
              fill="#0284c7"
            />

            {/* Mũi tên đỏ vươn lên */}
            <path
              d="M58 56 C80 51 98 41 114 24"
              stroke="#dc2626"
              strokeWidth="8"

          <div className="min-w-0">

              <span className="text-slate-900">BizFlow</span>{' '}

                style={{
                  background: 'linear-gradient(90deg, #ef4444 0%, #6366f1 55%, #0ea5e9 100%)',
                  WebkitBackgroundClip: 'text',
                  WebkitTextFillColor: 'transparent'
                }}
              >
                AI
              </span>

            {showTagline && (
              <div className="hidden sm:flex items-center gap-2 mt-1">
                <span className="w-5 h-0.5 bg-red-500 rounded-full"></span>

    // ==========================================
    // ỨNG DỤNG CHÍNH
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState(false);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [expenses, setExpenses] = useState([]);

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('bizflow_theme') || 'light'; } catch { return 'light'; }
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        try { localStorage.setItem('bizflow_theme', theme); } catch {}
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      const loadProfile = async (authUser) => {
        try {
          let { data: prof, error } = await sb
            .from('profiles')
            .select('*')
            .eq('id', authUser.id)
            .maybeSingle();

          if (!prof || error) {
            const shopName = authUser.user_metadata?.shop_name || 'Cửa hàng của quý khách';
            const isDemo = Boolean(authUser.user_metadata?.is_demo || authUser.is_anonymous);
            const { data: ensured, error: ensureErr } = await sb.rpc('ensure_profile', {
              p_shop_name: shopName,
              p_is_demo: isDemo
            });
            if (ensureErr || !ensured) return null;
            prof = ensured;
          }

          const isDemo = Boolean(prof.is_demo || authUser.is_anonymous || authUser.user_metadata?.is_demo);
          const rawPlan = isDemo ? 'ai_199k' : (prof.plan || authUser.user_metadata?.plan || 'free');
          const planExpiresAt = isDemo
            ? null
            : (prof.plan_expires_at || prof.ai_expires_at || authUser.user_metadata?.plan_expires_at || null);
          const isPlanExpired = !isDemo && rawPlan === 'ai_199k' && planExpiresAt
            ? new Date(planExpiresAt).getTime() <= Date.now()
            : false;
          const plan = isPlanExpired ? 'free' : rawPlan;
          const hasAI = isDemo || plan === 'ai_199k';

          return {
            id: authUser.id,
            phone: authUser.phone || authUser.email || 'Tài khoản trải nghiệm',
            shop_name: prof.shop_name,
            is_demo: isDemo,
            plan,
            plan_expires_at: planExpiresAt,
            is_plan_expired: isPlanExpired,
            has_ai: hasAI
          };
        } catch (err) {
          console.error('Lỗi tải hồ sơ:', err);
          return null;
        }
      };

      const refreshPlan = async () => {
        const { data } = await sb.auth.getUser();
        if (data?.user) {
          const u = await loadProfile(data.user);
          if (u) setCurrentUser(u);
        }
      };

      const loadData = async () => {
        try {
          const [p, o, t] = await Promise.all([
            sb.from('products').select('*').order('name'),
            sb.from('orders').select('*, order_items(*)').order('order_date', { ascending: false }).order('created_at', { ascending: false }),
            sb.from('transactions').select('*').order('transaction_date', { ascending: false }).order('created_at', { ascending: false }),
          ]);

          if (p.error) console.error('Lỗi tải hàng hóa:', p.error);
          if (o.error) console.error('Lỗi tải đơn hàng:', o.error);
          if (t.error) console.error('Lỗi tải thu chi:', t.error);

          setProducts((p.data || []).map(x => ({
            ...x,
            selling_price: Number(x.selling_price),
            cost_price: Number(x.cost_price)
          })));
          setOrders((o.data || []).map(x => ({
            ...x,
            items: (x.order_items || []).map(i => ({
              ...i,
              quantity: Number(i.quantity),
              unit_price: Number(i.unit_price),
              unit_cost: Number(i.unit_cost)
            }))
          })));
          setExpenses((t.data || []).map(x => ({
            ...x,
            amount: Number(x.amount),
            expense_date: x.transaction_date
          })));
        } catch (err) {
          console.error('Lỗi tải dữ liệu:', err);
        }
      };

      const finishLogin = async (authUser) => {
        const u = await loadProfile(authUser);
        setCurrentUser(u);
        if (u) await loadData();
        return u;
      };

      useEffect(() => {
        sb.auth.getSession().then(async ({ data }) => {
          if (data?.session?.user) await finishLogin(data.session.user);
          setLoading(false);
        }).catch((err) => {
          console.error('Lỗi kiểm tra đăng nhập:', err);
          setLoading(false);
        });

        const { data: sub } = sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') {
            setCurrentUser(null);
            setProducts([]);
            setOrders([]);
            setExpenses([]);
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      const handleSendOtp = async ({ phone, shop_name, isRegister, selectedPlan }) => {
        const chosenPlan = selectedPlan === 'ai_199k' ? 'ai_199k' : 'free';
        const options = isRegister
          ? { shouldCreateUser: true, data: { shop_name, is_demo: false, plan: chosenPlan } }
          : { shouldCreateUser: false };

        const { error } = await sb.auth.signInWithOtp({ phone, options });
        if (error) {
          console.error('Lỗi gửi OTP:', error);
          const msg = (error.message || '').toLowerCase();
          if (!isRegister && (msg.includes('signups not allowed') || msg.includes('not found') || msg.includes('user'))) {
            return { error: 'Số điện thoại này chưa được đăng ký. Vui lòng chọn mục "Tạo tài khoản mới".' };
          }
          if (msg.includes('rate') || msg.includes('limit') || msg.includes('seconds')) {
            return { error: 'Mã xác nhận vừa được gửi. Vui lòng chờ ít phút trước khi yêu cầu lại.' };
          }
          return { error: 'Không thể gửi mã OTP. Vui lòng kiểm tra lại số điện thoại.' };
        }
        return { ok: true };
      };

      const handleVerifyOtp = async ({ phone, token, shop_name, isRegister, selectedPlan }) => {
        const chosenPlan = selectedPlan === 'ai_199k' ? 'ai_199k' : 'free';
        const { data, error } = await sb.auth.verifyOtp({
          phone,
          token,
          type: 'sms'
        });
        if (error) {
          console.error('Lỗi xác nhận OTP:', error);
          return { error: 'Mã OTP chưa chính xác hoặc đã hết hạn. Vui lòng kiểm tra lại.' };
        }
        const authUser = data?.session?.user || data?.user;
        if (!authUser) {
          return { error: 'Đăng nhập chưa thành công. Vui lòng gửi lại mã OTP.' };
        }
        if (isRegister && shop_name) {
          await sb.auth.updateUser({
            data: { shop_name, is_demo: false, plan: chosenPlan }
          }).catch(() => {});
        }
        await finishLogin(authUser);
        return { ok: true };
      };

      const handleLogout = async () => {
        await sb.auth.signOut();
      };

      const handleQuickDemo = async () => {
        if (busy) return;
        setBusy(true);
        try {
          let authData = null;
          const anonRes = await sb.auth.signInAnonymously({
            options: { data: { shop_name: 'Cửa Hàng Trải Nghiệm', is_demo: true, plan: 'ai_199k' } }
          });

          if (!anonRes.error && anonRes.data?.session) {
            authData = anonRes.data;
          } else {
            const randId = Math.random().toString(36).slice(2, 9);
            const signUpRes = await sb.auth.signUp({
              email: `demo.${randId}@demo.bizflowai.vn`,
              password: `Demo#${randId}88`,
              options: { data: { shop_name: `Cửa Hàng Mẫu #${randId.toUpperCase()}`, is_demo: true, plan: 'ai_199k' } }
            });
            if (signUpRes.error || !signUpRes.data?.session) {
              console.error('Lỗi mở bản mẫu:', anonRes.error, signUpRes.error);
              alert('Không thể mở bản trải nghiệm lúc này. Vui lòng thử lại.');
              return;
            }
            authData = signUpRes.data;
          }

          await finishLogin(authData.session.user);
          await sb.rpc('seed_sample_data', { p_reset: false });
          await loadData();
        } catch (err) {
          console.error('Lỗi bản mẫu:', err);
          alert('Không thể mở bản trải nghiệm lúc này. Vui lòng thử lại.');
        } finally {
          setBusy(false);
        }
      };

      const handleResetSampleData = async () => {
        if (busy) return;
        setBusy(true);
        try {
          const { error } = await sb.rpc('seed_sample_data', { p_reset: true });
          if (error) {
            console.error('Lỗi làm mới dữ liệu mẫu:', error);
            alert('Không thể khôi phục dữ liệu mẫu. Vui lòng thử lại.');
          } else {
            await loadData();
          }
        } finally {
          setBusy(false);
        }
      };

      if (loading) {
        return (
          <div className="h-[100dvh] flex flex-col items-center justify-center gap-4 bg-business-grid px-4">
            <BizFlowLogo size="lg" />
            <div className="text-lg text-slate-800 font-bold">Đang tải dữ liệu cửa hàng...</div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <AuthPage
            onSendOtp={handleSendOtp}
            onVerifyOtp={handleVerifyOtp}
            onQuickDemo={handleQuickDemo}
            demoLoading={busy}
            theme={theme}
            onToggleTheme={toggleTheme}
          />
        );
      }

      return (
        <WorkspaceApp
          user={currentUser}
          onLogout={handleLogout}
          products={products}
          orders={orders}
          expenses={expenses}
          busy={busy}
          onResetSampleData={handleResetSampleData}
          onReload={loadData}
          onRefreshPlan={refreshPlan}
          theme={theme}
          onToggleTheme={toggleTheme}
        />
      );
    }

    // ==========================================
    // MÀN HÌNH ĐĂNG NHẬP & TẠO TÀI KHOẢN (CÓ CHỌN GÓI CƠ BẢN / GÓI AI)
    // ==========================================
    function AuthPage({ onSendOtp, onVerifyOtp, onQuickDemo, demoLoading, theme, onToggleTheme }) {
      const [mode, setMode] = useState('login');
      const [step, setStep] = useState('phone');
      const [shopName, setShopName] = useState('');
      const [selectedPlan, setSelectedPlan] = useState('free');
      const [phoneInput, setPhoneInput] = useState('');
      const [normalizedPhone, setNormalizedPhone] = useState('');
      const [otp, setOtp] = useState('');
      const [countdown, setCountdown] = useState(0);
      const [error, setError] = useState('');
      const [info, setInfo] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (countdown <= 0) return;
        const t = setTimeout(() => setCountdown(c => c - 1), 1000);
        return () => clearTimeout(t);
      }, [countdown]);

      const switchMode = (nextMode) => {
        setMode(nextMode);
        setStep('phone');
        setOtp('');
        setError('');
        setInfo('');
      };

      const sendOtpSubmit = async (e) => {
        if (e) e.preventDefault();
        setError('');
        setInfo('');

        if (mode === 'register' && !shopName.trim()) {
          setError('Vui lòng nhập tên cửa hàng.');
          return;
        }

        const formatted = normalizePhone(phoneInput);
        if (!isValidPhone(formatted)) {
          setError('Số điện thoại chưa hợp lệ. Vui lòng nhập lại (ví dụ: 0912 345 678).');
          return;
        }

        setSubmitting(true);
        try {
          const res = await onSendOtp({
            phone: formatted,
            shop_name: shopName.trim(),
            isRegister: mode === 'register',
            selectedPlan
          });
          if (res.error) {
            setError(res.error);
          } else {
            setNormalizedPhone(formatted);
            setStep('otp');
            setOtp('');
            setCountdown(60);
            setInfo(`Mã xác nhận đã được gửi qua SMS tới số ${phoneInput.trim()}.`);
          }
        } finally {
          setSubmitting(false);
        }
      };

      const verifyOtpSubmit = async (e) => {
        e.preventDefault();
        setError('');

        const cleanOtp = otp.replace(/\D/g, '');
        if (cleanOtp.length < 4) {
          setError('Vui lòng nhập đầy đủ mã OTP trong tin nhắn.');
          return;
        }

        setSubmitting(true);
        try {
          const res = await onVerifyOtp({
            phone: normalizedPhone,
            token: cleanOtp,
            shop_name: shopName.trim(),
            isRegister: mode === 'register',
            selectedPlan
          });
          if (res.error) setError(res.error);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="h-[100dvh] w-full bg-business-hero flex flex-col overflow-hidden">
          <div className="h-1 w-full brand-accent-bar shrink-0"></div>

          <header className="w-full border-b border-slate-200 bg-white/95 backdrop-blur-md shrink-0 z-10">
            <div className="max-w-5xl w-full mx-auto px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2">
              <BizFlowLogo size="sm" showTagline={true} />
              <div className="flex items-center gap-2 shrink-0">
                <ThemeToggleButton theme={theme} onToggle={onToggleTheme} compact={true} />
                <button
                  onClick={onQuickDemo}
                  disabled={demoLoading}
                  className="min-h-[42px] px-3.5 py-1.5 rounded-xl bg-blue-50 text-blue-800 border-2 border-blue-200 text-sm sm:text-base font-bold hover:bg-blue-100 transition disabled:opacity-50 whitespace-nowrap"
                >
                  {demoLoading ? 'Đang mở...' : 'Dùng thử ngay'}
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 min-h-0 overflow-y-auto flex items-center py-3 sm:py-6">
            <div className="max-w-5xl w-full mx-auto px-3 sm:px-5 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-7 items-center my-auto">
              <div className="lg:hidden text-center space-y-1">
                <h1 className="text-xl font-black text-slate-900 leading-snug">
                  Quản lý bán hàng &amp; <span className="text-red-600">lợi nhuận mỗi ngày</span>
                </h1>
                <p className="text-sm text-slate-600">
                  Giao diện tối giản • Dễ thao tác • Chữ lớn rõ ràng
                </p>
              </div>

              {/* KHUNG ĐĂNG NHẬP / TẠO TÀI KHOẢN */}
              <div className="lg:order-2 lg:col-span-6 bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-2 border-slate-200 min-w-0">
                <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1.5 rounded-2xl mb-4">
                  <button
                    type="button"
                    onClick={() => switchMode('login')}
                    className={`min-h-[44px] py-2 text-base font-extrabold rounded-xl transition ${mode === 'login' ? 'bg-white text-blue-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    Đăng nhập
                  </button>
                  <button
                    type="button"
                    onClick={() => switchMode('register')}
                    className={`min-h-[44px] py-2 text-base font-extrabold rounded-xl transition ${mode === 'register' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-600'}`}
                  >
                    Tạo tài khoản
                  </button>
                </div>

                {error && (
                  <div className="mb-3 p-3 rounded-xl bg-red-50 border border-red-300 text-red-700 text-sm sm:text-base font-bold">
                    {error}
                  </div>
                )}

                {info && (
                  <div className="mb-3 p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-800 text-sm sm:text-base font-bold">
                    {info}
                  </div>
                )}

                {step === 'phone' ? (
                  <form onSubmit={sendOtpSubmit} className="space-y-3.5">
                    {mode === 'register' && (
                      <>
                        <div>
                          <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">
                            Tên cửa hàng
                          </label>
                          <input
                            required
                            value={shopName}
                            onChange={e => setShopName(e.target.value)}
                            placeholder="Ví dụ: Cửa Hàng Minh Tâm"
                            className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-base focus:outline-none focus:border-blue-700"
                          />
                        </div>

                        {/* CHỌN GÓI CƠ BẢN HOẶC GÓI AI KHI TẠO TÀI KHOẢN */}
                        <div>
                          <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">
                            Chọn gói sử dụng
                          </label>
                          <div className="grid grid-cols-2 gap-2.5">
                            <button
                              type="button"
                              onClick={() => setSelectedPlan('free')}
                              className={`p-3 rounded-2xl border-2 text-left transition ${
                                selectedPlan === 'free'
                                  ? 'border-blue-700 bg-blue-50 shadow-sm'
                                  : 'border-slate-300 bg-white hover:border-blue-400'
                              }`}
                            >
                              <div className="text-sm sm:text-base font-extrabold text-slate-900">Gói Cơ bản</div>
                              <div className="text-sm font-extrabold text-emerald-700 mt-0.5">0đ / tháng</div>
                              <div className="text-xs sm:text-sm text-slate-600 mt-1 leading-snug">
                                Bán hàng, kho &amp; thu chi
                              </div>
                            </button>

                            <button
                              type="button"
                              onClick={() => setSelectedPlan('ai_199k')}
                              className={`p-3 rounded-2xl border-2 text-left transition ${
                                selectedPlan === 'ai_199k'
                                  ? 'border-red-600 bg-red-50/70 shadow-sm'
                                  : 'border-slate-300 bg-white hover:border-red-400'
                              }`}
                            >
                              <div className="text-sm sm:text-base font-extrabold text-slate-900">Gói AI</div>
                              <div className="text-sm font-extrabold text-red-600 mt-0.5">199.000đ / tháng</div>
                              <div className="text-xs sm:text-sm text-slate-600 mt-1 leading-snug">
                                Đầy đủ + Trợ lý AI
                              </div>
                            </button>
                          </div>
                        </div>
                      </>
                    )}

                    <div>
                      <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">
                        Số điện thoại
                      </label>
                      <input
                        required
                        type="tel"
                        inputMode="tel"
                        value={phoneInput}
                        onChange={e => setPhoneInput(e.target.value)}
                        placeholder="Ví dụ: 0912 345 678"
                        className="w-full min-h-[48px] px-4 py-2 border-2 border-slate-300 rounded-2xl text-lg font-bold focus:outline-none focus:border-blue-700"
                      />
                    </div>

                    <div className="p-3 rounded-xl bg-blue-50 border border-blue-200 text-sm text-slate-800 leading-relaxed">
                      {mode === 'register'
                        ? selectedPlan === 'ai_199k'
                          ? 'Gói AI mở khóa Trợ lý phân tích lợi nhuận và cảnh báo tồn kho thông minh.'
                          : 'Gói Cơ bản hoàn toàn miễn phí. Quý khách có thể nâng cấp Gói AI bất kỳ lúc nào.'
                        : 'Đăng nhập nhanh bằng mã OTP qua tin nhắn điện thoại, không cần nhớ mật khẩu.'}
                    </div>

                    <button
                      type="submit"
                      disabled={submitting}
                      className="w-full min-h-[52px] py-3 brand-gradient-btn text-white text-base sm:text-lg font-extrabold rounded-2xl shadow-md transition disabled:opacity-50"
                    >
                      {submitting ? 'Đang gửi mã xác nhận...' : 'Nhận mã OTP →'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={verifyOtpSubmit} className="space-y-3.5">
                    <div>
                      <label className="block text-sm sm:text-base font-bold text-slate-800 mb-1.5">
                        Nhập mã OTP đã gửi tới {phoneInput}
                      </label>
                      <input
                        required
                        type="text"
                        inputMode="numeric"
                        maxLength={6}
                        autoFocus
                        value={otp}
                        onChange={e => setOtp(e.target.value.replace(/\D/g, ''))}
                        placeholder="Nhập 6 chữ số"
                        className="w-full min-h-[54px] px-4 py-2 border-2 border-blue-600 rounded-2xl text-2xl font-extrabold tracking-widest text-center focus:outline-none focus:border-blue-800"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={submitting}
                      className="w-full min-h-[52px] py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-base sm:text-lg font-extrabold rounded-2xl shadow-md transition disabled:opacity-50"
                    >
                      {submitting
                        ? 'Đang xác thực...'
                        : mode === 'register'
                        ? 'Hoàn tất tạo tài khoản →'
                        : 'Xác nhận đăng nhập →'}
                    </button>

                    <div className="grid grid-cols-2 gap-2.5">
                      <button
                        type="button"
                        onClick={() => sendOtpSubmit()}
                        disabled={submitting || countdown > 0}
                        className="min-h-[46px] px-3 py-2 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-800 text-sm sm:text-base font-bold disabled:opacity-50"
                      >
                        {countdown > 0 ? `Gửi lại (${countdown}s)` : 'Gửi lại mã'}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setStep('phone');
                          setOtp('');
                          setError('');
                          setInfo('');
                        }}
                        className="min-h-[46px] px-3 py-2 rounded-xl border-2 border-slate-300 bg-slate-100 text-slate-800 text-sm sm:text-base font-bold"
                      >
                        ← Đổi số khác
                      </button>
                    </div>
                  </form>
                )}
              </div>

              {/* PHẦN GIỚI THIỆU SÚC TÍCH */}
              <div className="lg:order-1 lg:col-span-6 space-y-4 min-w-0">
                <div className="hidden lg:block space-y-3">
                  <h1 className="text-3xl xl:text-4xl font-black text-slate-900 leading-tight">
                    Nắm trọn <span className="text-red-600">lợi nhuận thực tế</span> chỉ với vài thao tác.
                  </h1>
                  <p className="text-lg text-slate-700 leading-relaxed">
                    Thiết kế tối giản, chữ lớn dễ đọc. Gói Cơ bản <strong>0đ</strong> đáp ứng trọn vẹn nhu cầu bán hàng; <strong>Gói AI</strong> đồng hành phân tích dữ liệu kinh doanh thông minh.
                  </p>
                </div>

                <div className="grid grid-cols-3 lg:grid-cols-1 gap-2.5 sm:gap-3">
                  <div className="bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-2 lg:gap-3.5">
                    <span className="text-2xl shrink-0">🧾</span>
                    <div>
                      <div className="font-extrabold text-xs sm:text-base lg:text-lg text-slate-900 leading-tight">Lên đơn nhanh</div>
                      <div className="hidden lg:block text-base text-slate-700 mt-0.5">Chọn sản phẩm, hệ thống tự động tính tiền và trừ tồn kho.</div>
                    </div>
                  </div>
                  <div className="bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-2 lg:gap-3.5">
                    <span className="text-2xl shrink-0">📊</span>
                    <div>
                      <div className="font-extrabold text-xs sm:text-base lg:text-lg text-slate-900 leading-tight">Minh bạch lãi lỗ</div>
                      <div className="hidden lg:block text-base text-slate-700 mt-0.5">Theo dõi chính xác doanh thu, chi phí và lợi nhuận từng ngày.</div>
                    </div>
                  </div>
                  <div className="bg-white p-3 sm:p-4 rounded-2xl border-2 border-slate-200 flex flex-col lg:flex-row items-center lg:items-start text-center lg:text-left gap-2 lg:gap-3.5">
                    <span className="text-2xl shrink-0">📦</span>
                    <div>
                      <div className="font-extrabold text-xs sm:text-base lg:text-lg text-slate-900 leading-tight">Cảnh báo tồn kho</div>
                      <div className="hidden lg:block text-base text-slate-700 mt-0.5">Nhắc nhở kịp thời các mặt hàng sắp hết để chủ động nhập hàng.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ==========================================
    // KHÔNG GIAN LÀM VIỆC CHÍNH
    // ==========================================
    function WorkspaceApp({
      user, onLogout, products, orders, expenses,
      busy, onResetSampleData, onReload, onRefreshPlan, theme, onToggleTheme
    }) {
      const hasAI = Boolean(user?.has_ai);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [financePresetMode, setFinancePresetMode] = useState('expense_other');
      const [toast, setToast] = useState(null);
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);
      const [planModalOpen, setPlanModalOpen] = useState(false);
      const [bankTx, setBankTx] = useState([]);
      const [bankAlert, setBankAlert] = useState(null);

      const loadBank = async () => {
        const { data, error } = await sb
          .from('bank_transactions')
          .select('*')
          .order('occurred_at', { ascending: false })
          .limit(100);
        if (!error) setBankTx((data || []).map(x => ({ ...x, amount: Number(x.amount) })));
      };

      useEffect(() => {
        loadBank();
        const ch = sb.channel('bank-tx-' + user.id)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'bank_transactions', filter: `user_id=eq.${user.id}` },
            (payload) => {
              loadBank();
              if (payload.eventType === 'INSERT' && payload.new?.status === 'pending') {
                setBankAlert({ direction: payload.new.direction, amount: Number(payload.new.amount) });
                try { navigator.vibrate && navigator.vibrate(200); } catch {}
              }
            })
          .subscribe();
        const poll = setInterval(loadBank, 30000);
        return () => { sb.removeChannel(ch); clearInterval(poll); };
      }, [user.id]);

      useEffect(() => {
        if (!bankAlert) return;
        const t = setTimeout(() => setBankAlert(null), 10000);
        return () => clearTimeout(t);
      }, [bankAlert]);

      const pendingBankCount = bankTx.filter(t => t.status === 'pending').length;

      const handleClassifyBank = async (id, action) => {
        const { error } = await sb.rpc('classify_bank_transaction', { p_id: id, p_action: action });
        if (error) {
          console.error(error);
          alert(error.message || 'Không thể phân loại giao dịch. Vui lòng thử lại.');
          return false;
        }
        await Promise.all([loadBank(), onReload()]);
        showSaveToast('Đã phân loại giao dịch ngân hàng', async () => {
          await sb.rpc('unclassify_bank_transaction', { p_id: id });
          await Promise.all([loadBank(), onReload()]);
          showSaveToast('Đã hoàn tác giao dịch');
        });
        return true;
      };

      const handleUnclassifyBank = async (id) => {
        const { error } = await sb.rpc('unclassify_bank_transaction', { p_id: id });
        if (error) { alert('Không thể hoàn tác giao dịch. Vui lòng thử lại.'); return; }
        await Promise.all([loadBank(), onReload()]);
      };

      useEffect(() => {
        if (!hasAI && activeTab === 'ai') {
          setActiveTab('dashboard');
        }
      }, [hasAI, activeTab]);

      useEffect(() => {
        if (!toast || toast.secondsLeft <= 0) return;
        const timer = setInterval(() => {
          setToast(prev => {
            if (!prev) return null;
            if (prev.secondsLeft <= 1) return null;
            return { ...prev, secondsLeft: prev.secondsLeft - 1 };
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [toast?.id]);

      const showSaveToast = (message, undoAction = null) => {
        setToast({
          id: Date.now(),
          message,
          undoAction,
          secondsLeft: 10
        });
      };

      const analytics = useMemo(() => {
        const TODAY = todayStr();

        const calcDay = (dateStr) => {
          const completedOrders = orders.filter(
            o => o.status === 'completed' && String(o.order_date || '').slice(0, 10) === dateStr
          );
          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });
          const dayTrans = expenses.filter(
            e => String(e.expense_date || '').slice(0, 10) === dateStr
          );
          const opex = dayTrans.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const bankSales = dayTrans.filter(e => e.type === 'income' && e.category === 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
          const otherIncome = dayTrans.filter(e => e.type === 'income' && e.category !== 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
          revenue += bankSales;
          const netProfit = revenue - cogs - opex + otherIncome;
          return { revenue, cogs, opex, otherIncome, netProfit, profit: netProfit, completedCount: completedOrders.length };
        };

        const calcPeriod = (monthKey) => {
          const completedOrders = orders.filter(o => o.status === 'completed' && getMonthKey(o.order_date) === monthKey);
          const pendingOrders = orders.filter(o => o.status === 'pending' && getMonthKey(o.order_date) === monthKey);

          let revenue = 0;
          let cogs = 0;
          completedOrders.forEach(o => {
            o.items.forEach(item => {
              revenue += item.quantity * item.unit_price;
              cogs += item.quantity * item.unit_cost;
            });
          });

          const monthExp = expenses.filter(e => getMonthKey(e.expense_date) === monthKey);
          const opex = monthExp.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
          const materialCost = monthExp.filter(e => e.type === 'expense' && (e.category.includes('Nguyên liệu') || e.category.includes('điện'))).reduce((s, e) => s + e.amount, 0);
          const shippingCost = monthExp.filter(e => e.type === 'expense' && (e.category.includes('giao') || e.category.includes('chuyển'))).reduce((s, e) => s + e.amount, 0);
          const bankSales = monthExp.filter(e => e.type === 'income' && e.category === 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
          const otherIncome = monthExp.filter(e => e.type === 'income' && e.category !== 'Bán hàng (ngân hàng)').reduce((s, e) => s + e.amount, 0);
          revenue += bankSales;
          const inventoryCashOut = monthExp.filter(e => e.type === 'inventory_purchase').reduce((s, e) => s + e.amount, 0);

          const grossProfit = revenue - cogs;
          const netProfit = grossProfit - opex + otherIncome;
          const cashFlow = revenue + otherIncome - opex - inventoryCashOut;

          return {
            monthKey, revenue, cogs, grossProfit, opex, materialCost, shippingCost,
            otherIncome, inventoryCashOut, netProfit, cashFlow,
            completedCount: completedOrders.length, pendingCount: pendingOrders.length
          };
        };

        const todayStats = calcDay(TODAY);
        const thisM = calcPeriod(THIS_MONTH);
        const lastM = calcPeriod(LAST_MONTH);

        const productInsights = products.map(p => {
          const profitPer100 = p.selling_price > 0 ? Math.round(((p.selling_price - p.cost_price) / p.selling_price) * 100) : 0;
          const unitProfit = p.selling_price - p.cost_price;
          return {
            ...p,
            profitPer100,
            unitProfit,
            isLowStock: p.stock <= p.low_stock_threshold,
            isLowMargin: profitPer100 < 20,
            isSellingAtLoss: p.selling_price < p.cost_price
          };
        });

        const lowStockProducts = productInsights
          .filter(p => p.isLowStock)
          .sort((a, b) => a.stock - b.stock);

        return {
          todayStats,
          thisM,
          lastM,
          productInsights,
          lowStockProducts,
          lowMarginProducts: productInsights.filter(p => p.isLowMargin)
        };
      }, [products, orders, expenses]);

      const handleAddProduct = async (p) => {
        const { error } = await sb.from('products').insert(p);
        if (error) {
          console.error('Lỗi thêm hàng:', error);
          alert('Không thể lưu sản phẩm. Vui lòng thử lại.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã thêm "${p.name}" vào danh mục`);
        return true;
      };

      const handleUpdateProduct = async ({ id, ...rest }) => {
        const { error } = await sb.from('products').update(rest).eq('id', id);
        if (error) {
          console.error('Lỗi sửa hàng:', error);
          alert('Không thể cập nhật sản phẩm. Vui lòng thử lại.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã cập nhật "${rest.name}"`);
        return true;
      };

      const handleDeleteProduct = async (p) => {
        const { error } = await sb.from('products').delete().eq('id', p.id);
        if (error) {
          console.error('Lỗi xóa hàng:', error);
          alert('Không thể xóa sản phẩm này. Vui lòng thử lại.');
          return false;
        }
        await onReload();
        showSaveToast(`Đã xóa "${p.name}"`);
        return true;
      };

      const handleCreateOrder = async ({ customer_name, order_date, status, selectedItems, totalAmount }) => {
        const { data: orderId, error } = await sb.rpc('create_order', {
          p_customer: customer_name,
          p_date: order_date,
          p_status: status,
          p_items: selectedItems.map(i => ({ product_id: i.product_id, quantity: Number(i.quantity) }))
        });
        if (error) {
          console.error('Lỗi tạo đơn hàng:', error);
          if (error.message && (error.message.includes('chỉ còn') || error.message.includes('không đủ'))) {
            alert(error.message);
          } else {
            alert('Không thể lưu đơn hàng. Vui lòng thử lại.');
          }
          return false;
        }
        await onReload();
        showSaveToast(
          `Đã ghi nhận đơn hàng ${formatTien(totalAmount)}`,
          orderId ? async () => {
            const { error: undoErr } = await sb.rpc('set_order_status', { p_order_id: orderId, p_status: 'cancelled' });
            if (undoErr) {
              console.error('Lỗi hoàn tác đơn:', undoErr);
              alert('Không thể hoàn tác đơn hàng. Vui lòng thử lại.');
              return;
            }
            await onReload();
            showSaveToast('Đã hoàn tác đơn hàng vừa tạo');
          } : null
        );
        return true;
      };

      const handleChangeOrderStatus = async (orderId, newStatus) => {
        const { error } = await sb.rpc('set_order_status', { p_order_id: orderId, p_status: newStatus });
        if (error) {
          console.error('Lỗi đổi trạng thái đơn:', error);
          if (error.message && error.message.includes('không đủ')) {
            alert('Số lượng tồn kho hiện không đủ để hoàn tất đơn hàng này.');
          } else {
            alert('Không thể cập nhật trạng thái đơn. Vui lòng thử lại.');
          }
          return false;
        }
        await onReload();
        showSaveToast(`Đã chuyển trạng thái sang "${ORDER_STATUS_LABEL[newStatus]}"`);
        return true;
      };

      const handleAddExpense = async (e) => {
        const { data: inserted, error } = await sb
          .from('transactions')
          .insert({
            type: e.type,
            category: e.category,
            amount: e.amount,
            transaction_date: e.expense_date,
            note: e.note
          })
          .select('id')
          .single();

        if (error) {
          console.error('Lỗi lưu thu chi:', error);
          alert('Không thể lưu giao dịch. Vui lòng thử lại.');
          return false;
        }
        await onReload();
        showSaveToast(
          `Đã ghi ${e.category}: ${formatTien(e.amount)}`,
          inserted?.id ? async () => {
            const { error: undoErr } = await sb.from('transactions').delete().eq('id', inserted.id);
            if (undoErr) {
              console.error('Lỗi hoàn tác thu chi:', undoErr);
              alert('Không thể hoàn tác giao dịch. Vui lòng thử lại.');
              return;
            }
            await onReload();
            showSaveToast('Đã hoàn tác giao dịch vừa ghi');
          } : null
        );
        return true;
      };

      const handleDeleteExpense = async (id) => {
        const { error } = await sb.from('transactions').delete().eq('id', id);
        if (error) {
          console.error('Lỗi xóa thu chi:', error);
          alert('Không thể xóa giao dịch. Vui lòng thử lại.');
          return false;
        }
        await onReload();
        showSaveToast('Đã xóa khoản thu chi');
        return true;
      };

      const navItems = [
        { id: 'dashboard', label: 'Trang chủ', icon: '🏠' },
        { id: 'orders', label: 'Bán hàng', icon: '🧾', badge: analytics.thisM.pendingCount },
        { id: 'products', label: 'Hàng hóa', icon: '📦', badge: analytics.lowStockProducts.length, badgeColor: 'bg-red-600' },
        { id: 'finance', label: 'Thu chi', icon: '💳' },
        { id: 'bank', label: 'Ngân hàng', icon: '🏦', badge: pendingBankCount, badgeColor: 'bg-red-600' },
        ...(hasAI ? [{ id: 'ai', label: 'Trợ lý AI', icon: '🤖', highlight: true }] : []),
      ];

      const openSpendQuick = () => {
        setFinancePresetMode('expense_other');
        setActiveTab('finance');
      };

      const planBadgeText = user.is_demo
        ? 'Trải nghiệm'
        : hasAI
        ? PLAN_INFO.ai_199k.shortBadge
        : PLAN_INFO.free.shortBadge;

      const mobilePlanBadgeText = user.is_demo
        ? 'Mẫu'
        : hasAI
        ? PLAN_INFO.ai_199k.mobileBadge
        : 'Nâng cấp AI';

      return (
        <div className="h-[100dvh] w-full overflow-hidden flex flex-col md:flex-row">
          {/* THANH TRÊN CÙNG CHO ĐIỆN THOẠI */}
          <div className="md:hidden shrink-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-3 py-2 flex items-center justify-between gap-2">
            <div className="min-w-0 flex items-center gap-2">
              <BizFlowLogo size="sm" />
              <button
                type="button"
                onClick={() => setPlanModalOpen(true)}
                className={`text-xs font-extrabold px-2.5 py-1 rounded-lg border shrink-0 ${
                  user.is_demo
                    ? 'bg-sky-100 text-sky-800 border-sky-200'
                    : hasAI
                    ? 'bg-blue-700 text-white border-blue-700'
                    : 'brand-gradient-btn text-white border-transparent'
                }`}
              >
                {mobilePlanBadgeText}
              </button>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <ThemeToggleButton theme={theme} onToggle={onToggleTheme} compact={true} />
              {user.is_demo && (
                <button
                  onClick={() => setConfirmResetOpen(true)}
                  disabled={busy}
                  title="Khôi phục dữ liệu mẫu"
                  className="min-h-[42px] px-3 rounded-xl bg-blue-50 border-2 border-blue-200 text-blue-800 text-sm font-bold disabled:opacity-50"
                >
                  🔄
                </button>
              )}
              <button
                onClick={onLogout}
                className="min-h-[42px] px-3 rounded-xl bg-slate-100 border-2 border-slate-300 text-slate-900 text-sm font-bold"
              >
                Thoát
              </button>
            </div>
          </div>
